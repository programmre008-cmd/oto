  function openApprovalDetail(reqId) {
    const r = state.teamRequests.find(item => item.id === reqId);
    if (!r) return;
    const content = document.getElementById('approvalSheetContent');
    content.innerHTML = `
      <div class="w-12 h-1.5 bg-[#1e1b4b] rounded-full mx-auto mb-3 opacity-30"></div>
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="text-base font-bold">รายละเอียดคำขอ — ${r.firstName} ${r.lastName}</h3>
          <p class="text-xs text-[#7a76a3]">รหัสพนักงาน: ${r.empId}</p>
        </div>
        <button type="button" onclick="closeApprovalDetail()" class="w-9 h-9 rounded-full border-2 border-[#1e1b4b] bg-white font-bold">✕</button>
      </div>
      <div class="comic-card p-3.5 space-y-2 text-xs">
        <div><b>ประเภท:</b> ${r.type === 'ot' ? `ขอทำโอที (+${r.hours} ชม.)` : 'ขอลาพักร้อน'}</div>
        <div><b>วันที่:</b> ${r.type === 'ot' ? formatThaiFull(r.from) : `${formatThaiShort(r.from)} – ${formatThaiShort(r.to)}`}</div>
        ${r.type === 'ot' ? `<div><b>เวลา:</b> ${r.timeIn} – ${r.timeOut} น.</div>` : ''}
        <div><b>รายละเอียด:</b> ${r.note || '-'}</div>
        ${r.photo ? `
          <div class="pt-2">
            <img src="${r.photo}" class="w-full max-h-64 object-contain rounded-2xl border-2 border-[#1e1b4b]" alt="หลักฐานเช็คเอาท์" />
            <div class="mt-1.5 text-[11px] font-bold">🕒 ${r.checkoutTime || '-'} · 📍 ${r.checkoutLocation || '-'}</div>
          </div>
        ` : ''}
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <button type="button" onclick="decideRequest('${r.id}', 'rejected'); closeApprovalDetail();" class="comic-btn py-3 bg-[#ffd6e0] text-xs">✕ ไม่อนุมัติ</button>
        <button type="button" onclick="decideRequest('${r.id}', 'approved'); closeApprovalDetail();" class="comic-btn py-3 bg-[#c6f3dc] text-xs">✓ อนุมัติคำขอ</button>
      </div>
    `;
    document.getElementById('approvalSheet').classList.add('open');
  }

  function closeApprovalDetail() {
    document.getElementById('approvalSheet').classList.remove('open');
  }

  function decideRequest(reqId, decision) {
    if (!isManager()) return;
    const req = state.teamRequests.find(r => r.id === reqId);
    if (!req) return;
    req.status = decision;
    req.decidedAt = getThaiNowTimestamp();
    req.updatedAt = Date.now();
    window.persistLocalDatabase();
    window.cloudStore?.saveRequest(req);
    showToast(decision === 'approved' ? `อนุมัติคำขอของ ${req.firstName} แล้ว ✓` : `ปฏิเสธคำขอของ ${req.firstName} แล้ว`);
    renderApp();
  }

  function deleteTeamRequest(reqId) {
    if (!isManager()) return;
    const idx = state.teamRequests.findIndex(r => r.id === reqId);
    if (idx === -1) return;
    const removed = state.teamRequests[idx];
    deletedRequestIds.add(reqId);
    state.teamRequests.splice(idx, 1);

    const empUpper = (removed.empId || '').trim().toUpperCase();
    deletedCalendarDocIds.add(`${empUpper}_${removed.from}`);
    allCloudCalendarItems = allCloudCalendarItems.filter(
      it => !((it.empId || '').toUpperCase() === empUpper && it.dateKey === removed.from)
    );
    if (state.items[removed.from] && (state.items[removed.from].empId || '').toUpperCase() === empUpper) {
      delete state.items[removed.from];
    }

    window.persistLocalDatabase();
    window.cloudStore?.deleteRequest(reqId);
    showToast(`ลบรายการของ ${removed.firstName} เรียบร้อยแล้ว`);
    renderApp();
  }

  function openPhotoViewer(src, timeText = '', locText = '') {
    document.getElementById('photoViewerImg').src = src;
    const metaEl = document.getElementById('photoViewerMeta');
    if (metaEl) {
      metaEl.innerHTML = (timeText || locText)
        ? `<div>🕒 เวลาเช็คเอาท์: ${timeText || '-'}</div><div>📍 สถานที่: ${locText || '-'}</div>`
        : '';
    }
    document.getElementById('photoViewer').classList.add('open');
  }

  function closePhotoViewer() {
    document.getElementById('photoViewer').classList.remove('open');
  }

  // =========================================================================
  // Tab 4: โปรไฟล์ (Profile) + ลบบัญชีพนักงานสำหรับ SM + เชื่อมต่อห้องซิงค์กลาง
  // =========================================================================
  let pendingDeleteEmpId = '';

  function requestDeleteEmployeeConfirm(empId) {
    pendingDeleteEmpId = empId;
    renderApp();
  }

  function cancelDeleteEmployeeConfirm() {
    pendingDeleteEmpId = '';
    renderApp();
  }

  function deleteEmployeeAccount(empId) {
    if (!isManager()) {
      showToast(`เฉพาะผู้อนุมัติ (${APPROVER_ID}) เท่านั้นที่ลบบัญชีพนักงานได้`);
      return;
    }
    const cleanId = (empId || '').trim().toUpperCase();
    if (!cleanId || cleanId === APPROVER_ID) return;
    const target = registeredAccounts[cleanId];
    const targetName = target ? `${target.firstName} ${target.lastName}`.trim() : cleanId;

    deletedAccountIds.add(cleanId);
    delete registeredAccounts[cleanId];

    const removedReqs = state.teamRequests.filter(r => (r.empId || '').trim().toUpperCase() === cleanId);
    removedReqs.forEach(r => deletedRequestIds.add(r.id));
    state.teamRequests = state.teamRequests.filter(r => (r.empId || '').trim().toUpperCase() !== cleanId);

    const removedCal = allCloudCalendarItems.filter(it => (it.empId || '').trim().toUpperCase() === cleanId);
    removedCal.forEach(it => deletedCalendarDocIds.add(`${cleanId}_${it.dateKey}`));
    allCloudCalendarItems = allCloudCalendarItems.filter(
      it => (it.empId || '').trim().toUpperCase() !== cleanId
    );
    Object.keys(state.items).forEach(k => {
      if ((state.items[k].empId || '').trim().toUpperCase() === cleanId) {
        delete state.items[k];
      }
    });

    pendingDeleteEmpId = '';
    window.persistLocalDatabase();
    window.cloudStore?.deleteAccount(cleanId);

    showToast(`ลบบัญชี ${targetName} (${cleanId}) และคำขอทั้งหมดแล้ว`);
    renderApp();
  }

  function handleProfileAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 200;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const avatarDataUrl = canvas.toDataURL('image/jpeg', 0.72);
        state.user.avatar = avatarDataUrl;
        const cleanId = (state.user.empId || '').trim().toUpperCase();
        if (cleanId === APPROVER_ID) {
          setSmAvatar(avatarDataUrl);
          registeredAccounts[APPROVER_ID] = {
            empId: APPROVER_ID,
            firstName: APPROVER_NAME.firstName,
            lastName: APPROVER_NAME.lastName,
            password: getApproverPassword(),
            avatar: avatarDataUrl
          };
          window.persistLocalDatabase();
          window.cloudStore?.saveAccount(registeredAccounts[APPROVER_ID]);
        } else if (registeredAccounts[cleanId]) {
          registeredAccounts[cleanId].avatar = avatarDataUrl;
          window.persistLocalDatabase();
          window.cloudStore?.saveAccount(registeredAccounts[cleanId]);
        }
        e.target.value = '';
        showToast('บันทึกรูปโปรไฟล์ใหม่และซิงค์ออนไลน์เรียบร้อย ✨');
        renderApp();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeProfileAvatar() {
    state.user.avatar = '';
    const cleanId = (state.user.empId || '').trim().toUpperCase();
    if (cleanId === APPROVER_ID) {
      setSmAvatar('');
      if (registeredAccounts[APPROVER_ID]) {
        registeredAccounts[APPROVER_ID].avatar = '';
        window.persistLocalDatabase();
        window.cloudStore?.saveAccount(registeredAccounts[APPROVER_ID]);
      }
    } else if (registeredAccounts[cleanId]) {
      registeredAccounts[cleanId].avatar = '';
      window.persistLocalDatabase();
      window.cloudStore?.saveAccount(registeredAccounts[cleanId]);
    }
    showToast('ลบรูปโปรไฟล์แล้ว');
    renderApp();
  }

  async function saveCustomCloudUrlFromUi() {
    const inp = document.getElementById('inpCloudDbUrl');
    if (!inp) return;
    await window.setCustomCloudEndpoint?.(inp.value);
    renderApp();
  }

  async function createAndCopySharedRoom() {
    showToast('กำลังสร้างห้องฐานข้อมูลกลางและรวมข้อมูล...');
    const newUrl = await window.createNewSharedCloudRoom?.();
    if (newUrl) {
      try {
        await navigator.clipboard.writeText(newUrl);
        showToast('สร้างห้องฐานข้อมูลกลางและคัดลอกลิงก์แล้ว ✓ นำไปวางในอีกเครื่องได้เลย');
      } catch (e) {
        showToast('สร้างห้องฐานข้อมูลกลางสำเร็จ ✓');
      }
      renderApp();
    } else {
      showToast('ไม่สามารถสร้างห้องได้ กรุณาตรวจสอบอินเทอร์เน็ต');
    }
  }

    );

    container.innerHTML = `
      <div class="comic-card p-5 text-center mb-3">
        <div class="relative w-24 h-24 mx-auto mb-2.5">
          <div class="w-24 h-24 rounded-full border-[3px] border-[#1e1b4b] bg-[#ffe3ec] flex items-center justify-center overflow-hidden shadow">
            ${getEmployeeAvatarHtml(state.user, 96)}
          </div>
          <label for="inpProfileAvatar" class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#ffb98a] border-2 border-[#1e1b4b] flex items-center justify-center text-xs font-bold shadow cursor-pointer" title="แก้ไขรูปโปรไฟล์">
            ✏️
          </label>
        </div>
        <h2 class="text-lg font-bold">${state.user.firstName} ${state.user.lastName}</h2>
        <div class="inline-block px-3 py-0.5 rounded-full text-xs font-bold border-2 border-[#1e1b4b] mt-1 ${manager ? 'bg-[#ffe6d3]' : 'bg-[#e5e2ff]'}">
          ${manager ? `ผู้อนุมัติหลัก · ${APPROVER_ID}` : `พนักงาน · ${state.user.empId}`}
        </div>

        <div class="flex flex-wrap items-center justify-center gap-2 mt-3">
          <label class="comic-pill px-3 py-1.5 text-xs bg-[#ffb98a] cursor-pointer font-bold">
            📷 ถ่ายรูปโปรไฟล์
            <input type="file" id="inpProfileCamera" accept="image/*" capture="user" class="hidden" />
          </label>
          <label class="comic-pill px-3 py-1.5 text-xs bg-[#e5e2ff] cursor-pointer font-bold">
            🖼️ เลือกจากอัลบั้ม
            <input type="file" id="inpProfileAvatar" accept="image/*" class="hidden" />
          </label>
          ${state.user.avatar ? `
            <button type="button" onclick="removeProfileAvatar()" class="comic-pill px-3 py-1.5 text-xs bg-[#ffd6e0] font-bold">🗑️ ลบรูป</button>
          ` : ''}
        </div>
      </div>

      ${manager ? `
        <div class="comic-card p-4 mb-3">
          <div class="flex items-center justify-between mb-2.5">
            <h3 class="text-sm font-bold">👥 จัดการบัญชีพนักงานในระบบ</h3>
            <span class="text-[11px] font-bold text-[#7a76a3]">${accountList.length} บัญชี</span>
          </div>
          ${accountList.length === 0 ? `
            <p class="text-xs text-[#7a76a3] text-center py-3">ยังไม่มีบัญชีพนักงานที่ลงทะเบียนในระบบ</p>
          ` : `
            <div class="space-y-2">
              ${accountList.map(acc => {
                const isConfirming = pendingDeleteEmpId === acc.empId;
                return `
                  <div class="p-2.5 rounded-2xl border-2 border-[#1e1b4b] bg-[#f6f5ff] flex items-center justify-between gap-2">
                    <div>
                      <div class="text-xs font-bold">${acc.firstName} ${acc.lastName}</div>
                      <div class="text-[11px] text-[#7a76a3]">รหัส: <b>${acc.empId}</b> · Password: <b>${acc.password}</b></div>
                    </div>
                    ${isConfirming ? `
                      <div class="flex items-center gap-1">
                        <button type="button" onclick="deleteEmployeeAccount('${acc.empId}')" class="px-2.5 py-1 rounded-full bg-[#ff5d8f] text-white border border-[#1e1b4b] text-[10px] font-bold">ยืนยันลบ</button>
                        <button type="button" onclick="cancelDeleteEmployeeConfirm()" class="px-2 py-1 rounded-full bg-white border border-[#1e1b4b] text-[10px] font-bold">ยกเลิก</button>
                      </div>
                    ` : `
                      <button type="button" onclick="requestDeleteEmployeeConfirm('${acc.empId}')" class="px-2.5 py-1 rounded-full bg-[#ffd6e0] border border-[#1e1b4b] text-[10px] font-bold">🗑️ ลบบัญชี</button>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <div class="comic-card p-4 mb-3 bg-[#f6f5ff]">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold">☁️ ห้องฐานข้อมูลกลาง (มือถือ ↔ คอมฯ)</span>
            <button type="button" onclick="createAndCopySharedRoom()" class="text-[10px] font-bold text-[#5b4ce6] underline">+ สร้างห้องใหม่ & คัดลอก</button>
          </div>
          <p class="text-[11px] text-[#7a76a3] mb-2">ใช้ URL เดียวกันทั้งในมือถือและคอมพิวเตอร์ เพื่อให้ข้อมูลตรงกัน 100%</p>
          <input id="inpCloudDbUrl" type="text" class="comic-input text-[11px] py-2 mb-2" value="${activeDbUrl}" />
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="window.cloudStore?.pushAllLocalToCloud().then(()=>window.cloudStore?.pullFromCloud(true))" class="comic-pill py-1.5 text-xs bg-[#c6f3dc] font-bold">🔄 ซิงค์ขึ้น-ลงเดี๋ยวนี้</button>
            <button type="button" onclick="saveCustomCloudUrlFromUi()" class="comic-pill py-1.5 text-xs bg-white font-bold">💾 บันทึก URL</button>
          </div>
        </div>
      ` : ''}

      <div class="space-y-2.5">
        <button type="button" onclick="triggerAppInstall()" class="comic-btn w-full py-3 bg-[#c6f3dc] text-[#1e1b4b] text-xs">
          📲 ติดตั้งแอป oto ลงหน้าจอเครื่อง
        </button>
        <button type="button" onclick="openLoginScreen()" class="comic-btn w-full py-3 bg-[#ffb98a] text-[#1e1b4b] text-sm">
          🔄 สลับบัญชี / ออกจากระบบ
        </button>

    const avatarInp = document.getElementById('inpProfileAvatar');
    if (avatarInp) avatarInp.addEventListener('change', handleProfileAvatarUpload);
    const camAvatarInp = document.getElementById('inpProfileCamera');
    if (camAvatarInp) camAvatarInp.addEventListener('change', handleProfileAvatarUpload);

  // =========================================================================
  // Main App Render & Live Thai Clock & PWA Setup
  // =========================================================================
  function renderApp() {
    renderHeader();
    renderNav();
    const main = document.getElementById('appMain');
    if (state.activeTab === 'cal') renderCalendarTab(main);
    else if (state.activeTab === 'sum') renderSummaryTab(main);
    else if (state.activeTab === 'app') renderApprovalTab(main);
    else renderProfileTab(main);
  }

  setInterval(() => {
    const clockEl = document.getElementById('thaiLiveClock');
    if (clockEl) {
      clockEl.textContent = `${getBangkokNowParts().timeString} น.`;
    }
  }, 1000);

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function setupPwaManifest() {
    try {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#1e1b4b"/><circle cx="256" cy="256" r="176" fill="#ffb98a"/><text x="256" y="292" font-family="sans-serif" font-weight="800" font-size="148" text-anchor="middle" fill="#1e1b4b">oto</text></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      const appleLink = document.getElementById('appleTouchIconLink');
      if (appleLink) appleLink.href = iconUrl;

      const manifestObj = {
        name: 'oto — ปฏิทินโอที & ลาพักร้อน',
        short_name: 'oto',
        start_url: '.',
        display: 'standalone',
        background_color: '#1e1b4b',
        theme_color: '#1e1b4b',
        icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }]
      };
      const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
      const manifestLink = document.getElementById('dynamicManifestLink');
      if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
    } catch (e) {}
  }

  async function triggerAppInstall() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    showToast('บนมือถือ: กดปุ่ม แชร์ (Share) หรือ จุด 3 จุด (⋮) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"');
  }

  setupPwaManifest();
  restoreLastAuthInputs();
  onAuthEmpIdChange();
  renderApp();
</script>
