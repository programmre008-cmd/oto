<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="oto" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link id="dynamicManifestLink" rel="manifest" />
  <link id="appleTouchIconLink" rel="apple-touch-icon" />
  <title>oto — ปฏิทินโอที & ลาพักร้อน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Fredoka:wght@600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1e1b4b;
      --paper: #f6f5ff;
      --card: #ffffff;
      --peach: #ffb98a;
      --lavender: #e5e2ff;
      --mint: #c6f3dc;
      --sky: #d9f0ff;
      --rose: #ffd6e0;
      --muted: #7a76a3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
      pointer-events: auto !important;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Anuphan', sans-serif;
      background: #e9e6fb;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    @media (max-width: 640px) {
      html, body {
        padding: 0;
        background: var(--ink);
        align-items: stretch;
      }
      .phone-shell {
        width: 100vw !important;
        min-width: 100vw !important;
        max-width: 100vw !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }
      .bottom-nav {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
      }
      .sheet-card {
        max-height: 92dvh !important;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }

    h1, h2, h3, .font-heading {
      font-family: 'Kanit', sans-serif;
    }

    .font-brand {
      font-family: 'Fredoka', sans-serif;
    }

    .phone-shell {
      width: 412px;
      min-width: 360px;
      max-width: 100%;
      height: 830px;
      max-height: 94vh;
      margin: 0 auto;
      flex-shrink: 0;
      background: var(--paper);
      border-radius: 44px;
      border: 4px solid var(--ink);
      box-shadow: 0 24px 54px rgba(30, 27, 75, 0.22);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      background: #ffffff;
      padding: 16px 20px 26px;
      position: relative;
      z-index: 10;
    }

    .wave-divider {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 22px;
      display: block;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 104px;
      scrollbar-width: none;
    }
    .main-scroll::-webkit-scrollbar {
      display: none;
    }

    .comic-card {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 26px;
      box-shadow: 0 5px 0 var(--ink);
    }

    .comic-pill {
      border: 2px solid var(--ink);
      border-radius: 9999px;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .comic-pill:active {
      transform: scale(0.96);
    }

    .comic-input {
      width: 100%;
      background: #ffffff !important;
      color: var(--ink) !important;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 11px 14px;
      font-family: 'Anuphan', sans-serif;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      cursor: text;
      -webkit-appearance: none;
      appearance: none;
      transition: box-shadow 0.15s ease, transform 0.12s ease;
    }
    .comic-input::placeholder {
      color: #9e9bc2;
      font-weight: 400;
    }
    .comic-input:focus {
      box-shadow: 0 3px 0 var(--ink);
      background: #fffdfb !important;
    }

    .comic-btn {
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }
    .comic-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .comic-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .day-cell {
      aspect-ratio: 1 / 1.16;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.15s ease;
      position: relative;
      background: #f4f3ff;
    }
    .day-cell:hover {
      border-color: rgba(30, 27, 75, 0.25);
    }
    .day-cell:active {
      transform: scale(0.93);
    }
    .day-cell.other-month {
      opacity: 0.32;
      background: transparent;
    }
    .day-cell.is-today {
      border: 2.5px solid var(--ink);
      background: #ffffff;
    }
    .day-cell.has-ot {
      background: linear-gradient(180deg, #ffe6d3 0%, #ffd5ec 100%);
      border: 2px solid var(--ink);
    }
    .day-cell.has-leave {
      background: #0d9488;
      border: 2px solid var(--ink);
      color: #ffffff;
    }
    .day-cell.has-leave .day-num {
      color: #ffffff !important;
    }
    .day-cell.has-leave .day-badge-leave {
      background: #064e3b;
      color: #ffffff;
      border-color: #ffffff;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2.5px solid var(--ink);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 10px 14px 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 25;
      box-shadow: 0 -6px 20px rgba(30, 27, 75, 0.08);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      min-width: 62px;
      transition: color 0.15s ease;
    }
    .nav-item.active {
      color: var(--ink);
    }
    .nav-item.active .nav-icon-wrap {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -22px;
      box-shadow: 0 3px 0 var(--ink);
    }
    .nav-icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(24, 21, 58, 0.55);
      backdrop-filter: blur(2px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-card {
      background: #f6f5ff;
      border-top: 3px solid var(--ink);
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      padding: 14px 18px 24px;
      max-height: 88%;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      scrollbar-width: none;
    }
    .sheet-card::-webkit-scrollbar {
      display: none;
    }
    .sheet-backdrop.open .sheet-card {
      transform: translateY(0);
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: var(--ink);
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 20px 28px;
      color: #ffffff;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .login-overlay::-webkit-scrollbar {
      display: none;
    }
    .login-overlay.hidden {
      display: none;
    }

    .toast-pill {
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #ffffff;
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 0 var(--ink);
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      max-width: 90%;
      text-align: center;
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="phone-shell" id="phoneShell">
  <!-- Login Overlay -->
  <div class="login-overlay" id="loginScreen">
    <div class="flex flex-col items-center text-center mt-2">
      <div class="w-16 h-16 rounded-full bg-white border-[3px] border-[#ffb98a] flex items-center justify-center mb-2 shadow-lg">
        <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="34" r="24" fill="#FFE6D5" stroke="#1E1B4B" stroke-width="3.5"/>
          <path d="M12 24C14 14 23 10 32 10C41 10 50 14 52 24C45 20 39 22 32 22C25 22 19 20 12 24Z" fill="#1E1B4B"/>
          <circle cx="24" cy="34" r="2.8" fill="#1E1B4B"/>
          <circle cx="40" cy="34" r="2.8" fill="#1E1B4B"/>
          <path d="M26 42C28.5 45 35.5 45 38 42" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
          <circle cx="46" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
        </svg>
      </div>
      <div class="font-brand text-3xl tracking-tight text-white">oto</div>
      <p class="text-xs text-[#c7c3ea] mt-0.5">บันทึกเวลาโอที & วันลาพักร้อนของทีม</p>
    </div>

    <div class="space-y-3 my-auto pt-3">
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="btnAuthLoginMode" onclick="setAuthMode('login')" class="comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white">
          🔑 เข้าสู่ระบบ
        </button>
        <button type="button" id="btnAuthRegisterMode" onclick="setAuthMode('register')" class="comic-pill py-2 text-xs font-bold bg-[#2c2866] text-white border-[#7a76a3]">
          ✨ สร้างรหัสพนักงาน
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ใส่รหัสพนักงาน</label>
        <input id="inpEmpId" type="text" oninput="onAuthEmpIdChange()" class="comic-input uppercase" placeholder="ใส่รหัสพนักงาน" value="" autocomplete="username" />
      </div>

      <div id="approverRecognizedBadge" class="hidden rounded-2xl bg-[#c6f3dc] text-[#1e1b4b] px-3 py-2 text-xs font-bold">
        🛡️ ผู้อนุมัติหลัก: <span id="approverRecognizedName">นาย ณัฐวุฒิ ชุมหิรัญ</span> (ไม่ต้องกรอกชื่อ ใส่รหัสผ่านได้เลย)
      </div>

      <div id="nameFieldsGroup" class="grid grid-cols-2 gap-2.5 hidden">
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ชื่อ</label>
          <input id="inpFirst" type="text" class="comic-input" placeholder="เช่น กานต์พิชชา" value="" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">นามสกุล</label>
          <input id="inpLast" type="text" class="comic-input" placeholder="เช่น สุขใจ" value="" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label id="lblPasswordField" class="block text-xs font-semibold text-[#d8d5f7]">รหัสผ่าน (Password)</label>
          <button type="button" id="btnResetSmPass" onclick="resetSmPasswordPrompt()" class="hidden text-[11px] font-bold text-[#ffb98a] underline">
            🔄 รีรหัสผ่าน SM
          </button>
        </div>
        <input id="inpPassword" type="password" class="comic-input" placeholder="กรอกรหัสผ่านของคุณ" value="" autocomplete="current-password" />
      </div>

      <p id="authHelperNote" class="text-[11px] text-[#c7c3ea] leading-relaxed">
        * ระบบจำรหัสพนักงานและซิงค์ข้อมูลข้ามเครื่อง (คอมฯ ↔ มือถือ) อัตโนมัติ
      </p>

      <div class="flex items-center justify-between gap-2 text-[11px] bg-[#262259] border border-[#4c4694] rounded-2xl px-3 py-2">
        <span class="text-[#c7c3ea] shrink-0">☁️ ฐานข้อมูลกลาง:</span>
        <span id="cloudSyncStatusText" class="text-[#36c78c] font-bold text-right">กำลังเชื่อมต่อฐานข้อมูลกลาง...</span>
      </div>

      <button type="button" id="btnAuthSubmit" onclick="handleLogin()" class="comic-btn w-full py-3.5 bg-[#ffb98a] text-[#1e1b4b] text-base mt-1">
        เข้าใช้งานระบบ
      </button>

      <button type="button" id="btnInstallAppLogin" onclick="triggerAppInstall()" class="comic-pill w-full py-2.5 bg-[#2c2866] text-white border-[#7a76a3] text-xs font-bold flex items-center justify-center gap-1.5">
        <span>📲 ติดตั้งแอป oto ลงเครื่อง (iOS / Android / คอมฯ)</span>
      </button>
    </div>
  </div>

  <!-- Top Header -->
  <header class="top-header" id="appHeader"></header>

  <!-- Main Content -->
  <main class="main-scroll" id="appMain"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="appNav"></nav>

  <!-- Day Entry Bottom Sheet -->
  <div class="sheet-backdrop" id="daySheet" onclick="if(event.target===this) closeDaySheet()">
    <div class="sheet-card" id="daySheetContent"></div>
  </div>

  <!-- Approval Detail Sheet -->
  <div class="sheet-backdrop" id="approvalSheet" onclick="if(event.target===this) closeApprovalDetail()">
    <div class="sheet-card" id="approvalSheetContent"></div>
  </div>

  <!-- Photo Lightbox -->
  <div class="sheet-backdrop" id="photoViewer" onclick="closePhotoViewer()" style="justify-content:center; padding:18px; z-index:65;">
    <div class="comic-card p-3 bg-white max-w-full" onclick="event.stopPropagation()">
      <img id="photoViewerImg" src="" class="w-full max-h-[65vh] object-contain rounded-2xl border-2 border-[#1e1b4b]" alt="หลักฐานเช็คเอาท์" />
      <div id="photoViewerMeta" class="mt-2 px-2 py-1.5 rounded-xl bg-[#f6f5ff] border border-[#1e1b4b] text-xs font-bold text-[#1e1b4b]"></div>
      <button type="button" onclick="closePhotoViewer()" class="comic-btn w-full py-2.5 bg-[#ffb98a] text-sm mt-2.5">ปิดรูปภาพ</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-pill" id="toastPill"></div>
</div>

<!-- Cross-Device Centralized Cloud Database Sync (Real Persistent JSONBlob + Firebase + LocalStorage) -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
  import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'oto-ot-leave-shared-v7';

  // ฐานข้อมูลกลาง JSONBlob จริงที่รองรับ CORS จาก Vercel, มือถือ และคอมพิวเตอร์ 100%
  // ใช้ร่วมกันทุกเครื่องโดยอัตโนมัติ (สามารถสร้างห้องใหม่หรือเชื่อมต่อด้วยรหัสทีมได้)
  const DEFAULT_SHARED_BLOB_URL = 'https://jsonblob.com/api/jsonBlob/019d3e8f-7a42-7c91-b410-9f8e2c6a1d05';
  const CUSTOM_DB_STORAGE_KEY = 'oto_central_blob_url_v7';
  const FALLBACK_KV_URL = 'https://kvdb.io/8kP4nQ9vR2wX7mL3zT5yB/oto_shared_team_v7';

  let isSyncingNow = false;
  let lastCloudPushAt = 0;
  let activeCloudUrl = '';

  function resolveCloudUrl() {
    try {
      const saved = (localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim();
      if (saved && saved.startsWith('http')) return saved;
    } catch (e) {}
    return activeCloudUrl || DEFAULT_SHARED_BLOB_URL;
  }

  window.getCurrentCloudEndpoint = () => resolveCloudUrl();

  window.setCustomCloudEndpoint = async function(newUrl) {
    const clean = (newUrl || '').trim();
    try {
      if (clean) localStorage.setItem(CUSTOM_DB_STORAGE_KEY, clean);
      else localStorage.removeItem(CUSTOM_DB_STORAGE_KEY);
    } catch (e) {}
    activeCloudUrl = clean || DEFAULT_SHARED_BLOB_URL;
    await window.cloudStore.pushAllLocalToCloud();
    await window.cloudStore.pullFromCloud(true);
  };

  // สร้างฐานข้อมูลกลางชุดใหม่และรับลิงก์/รหัสแชร์ให้เครื่องอื่นเชื่อมต่อได้ทันที
  window.createNewSharedCloudRoom = async function() {
    try {
      const snap = typeof window.getAllLocalSyncSnapshot === 'function'
        ? window.getAllLocalSyncSnapshot()
        : { accounts: {}, requests: [], calendar: [] };
      const initialPayload = buildMergedPayload({}, snap);

      const res = await fetch('https://jsonblob.com/api/jsonBlob', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(initialPayload)
      });

      if (res.ok) {
        const loc = res.headers.get('Location') || res.headers.get('location') || '';
        const blobId = loc.split('/').pop();
        if (blobId) {
          const newUrl = `https://jsonblob.com/api/jsonBlob/${blobId}`;
          await window.setCustomCloudEndpoint(newUrl);
          return newUrl;
        }
      }
    } catch (e) {
      console.warn('Create room error:', e);
    }
    return '';
  };

  function updateCloudStatusBadge(text, stateLevel = 'ok') {
    const el = document.getElementById('cloudSyncStatusText');
    if (el) {
      el.textContent = text;
      el.className = stateLevel === 'ok'
        ? 'text-[#36c78c] font-bold text-right'
        : stateLevel === 'syncing'
          ? 'text-[#d9f0ff] font-bold text-right'
          : 'text-[#ffb98a] font-bold text-right';
    }
    const headerBadge = document.getElementById('headerSyncBtn');
    if (headerBadge) {
      headerBadge.textContent = stateLevel === 'ok'
        ? '☁️ ออนไลน์ ✓'
        : stateLevel === 'syncing'
          ? '⏳ กำลังซิงค์...'
          : '⚠️ ออฟไลน์';
      headerBadge.style.background = stateLevel === 'ok'
        ? '#c6f3dc'
        : stateLevel === 'syncing'
          ? '#d9f0ff'
          : '#ffd6e0';
    }
  }

  async function ensureJsonBlobReady(url) {
    try {
      const res = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
      });
      if (res.ok) {
        const data = await res.json();
        return { ok: true, data };
      }
      if (res.status === 404 && url.includes('jsonblob.com/api/jsonBlob/')) {
        // หาก Blob เริ่มต้นหมดอายุ ให้สร้าง Blob ใหม่แล้วบันทึกลง KVdb กลางเพื่อให้ทุกเครื่องเห็น URL เดียวกัน
        const created = await window.createNewSharedCloudRoom();
        if (created) {
          try {
            await fetch(FALLBACK_KV_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ activeBlobUrl: created, updatedAt: Date.now() })
            });
          } catch (e) {}
          const retryRes = await fetch(created, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
          if (retryRes.ok) return { ok: true, data: await retryRes.json() };
        }
      }
    } catch (e) {}
    return { ok: false, data: null };
  }

  async function readCentralCloudState() {
    // ตรวจสอบว่ามี URL กลางล่าสุดใน KVdb หรือไม่ (กรณีไม่ตั้งค่า Custom URL เอง)
    let targetUrl = resolveCloudUrl();
    const hasCustom = Boolean((localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim());

    if (!hasCustom) {
      try {
        const kvRes = await fetch(`${FALLBACK_KV_URL}?_t=${Date.now()}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        if (kvRes.ok) {
          const kvData = await kvRes.json();
          if (kvData && typeof kvData.activeBlobUrl === 'string' && kvData.activeBlobUrl.startsWith('http')) {
            targetUrl = kvData.activeBlobUrl;
            activeCloudUrl = targetUrl;
          }
        }
      } catch (e) {}
    }

    const result = await ensureJsonBlobReady(targetUrl);
    if (result.ok) {
      activeCloudUrl = targetUrl;
      return result.data || { accounts: {}, requests: [], calendar: [], tombstones: {} };
    }
    return null;
  }

  async function writeCentralCloudState(payload) {
    const targetUrl = resolveCloudUrl();
    try {
      const res = await fetch(targetUrl, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        activeCloudUrl = targetUrl;
        const hasCustom = Boolean((localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim());
        if (!hasCustom && targetUrl.includes('jsonblob.com')) {
          fetch(FALLBACK_KV_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activeBlobUrl: targetUrl, updatedAt: Date.now() })
          }).catch(() => {});
        }
        return true;
      }
    } catch (e) {
      console.warn('Write cloud error:', e);
    }
    return false;
  }

  function compactImageForCloud(dataUrl, maxLen = 45000) {
    if (!dataUrl || typeof dataUrl !== 'string') return '';
    if (dataUrl.length <= maxLen) return dataUrl;
    return '';
  }

  function buildMergedPayload(remoteData, localSnap) {
    const rData = remoteData && typeof remoteData === 'object' ? remoteData : {};
    const remoteTombs = rData.tombstones || {};

    const mergedTombstones = {
      accounts: Array.from(new Set([
        ...(Array.isArray(remoteTombs.accounts) ? remoteTombs.accounts : []),
        ...(typeof window.getDeletedAccountIds === 'function' ? window.getDeletedAccountIds() : [])
      ])).map(id => String(id).trim().toUpperCase()),
      requests: Array.from(new Set([
        ...(Array.isArray(remoteTombs.requests) ? remoteTombs.requests : []),
        ...(typeof window.getDeletedRequestIds === 'function' ? window.getDeletedRequestIds() : [])
      ])),
      calendar: Array.from(new Set([
        ...(Array.isArray(remoteTombs.calendar) ? remoteTombs.calendar : []),
        ...(typeof window.getDeletedCalendarDocIds === 'function' ? window.getDeletedCalendarDocIds() : [])
      ]))
    };

    const deletedAccSet = new Set(mergedTombstones.accounts);
    const deletedReqSet = new Set(mergedTombstones.requests);
    const deletedCalSet = new Set(mergedTombstones.calendar);

    const mergedAccounts = {};
    Object.entries({ ...(rData.accounts || {}), ...(localSnap.accounts || {}) }).forEach(([rawKey, val]) => {
      const cleanId = (val?.empId || rawKey || '').trim().toUpperCase();
      if (!cleanId || deletedAccSet.has(cleanId)) return;
      mergedAccounts[cleanId] = {
        ...val,
        empId: cleanId,
        avatar: compactImageForCloud(val?.avatar || '', 32000)
      };
    });

    const reqMap = new Map();
    (Array.isArray(rData.requests) ? rData.requests : []).forEach(r => {
      const empId = (r?.empId || '').trim().toUpperCase();
      if (r?.id && !deletedReqSet.has(r.id) && !deletedAccSet.has(empId)) {
        reqMap.set(r.id, { ...r, empId, approverId: 'SM2080797' });
      }
    });
    (localSnap.requests || []).forEach(r => {
      const empId = (r?.empId || '').trim().toUpperCase();
      if (r?.id && !deletedReqSet.has(r.id) && !deletedAccSet.has(empId)) {
        const prev = reqMap.get(r.id);
        if (!prev || (r.updatedAt || 0) >= (prev.updatedAt || 0)) {
          reqMap.set(r.id, {
            ...r,
            empId,
            approverId: 'SM2080797',
            photo: compactImageForCloud(r.photo, 45000) || prev?.photo || ''
          });
        }
      }
    });
    const mergedRequests = Array.from(reqMap.values())
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
      .slice(0, 60);

    const calMap = new Map();
    (Array.isArray(rData.calendar) ? rData.calendar : []).forEach(it => {
      const empId = (it?.empId || 'EMP').trim().toUpperCase();
      if (it?.dateKey && !deletedAccSet.has(empId)) {
        const docId = `${empId}_${it.dateKey}`;
        if (!deletedCalSet.has(docId)) {
          calMap.set(docId, { ...it, empId, approverId: 'SM2080797' });
        }
      }
    });
    (localSnap.calendar || []).forEach(it => {
      const empId = (it?.empId || 'EMP').trim().toUpperCase();
      if (it?.dateKey && !deletedAccSet.has(empId)) {
        const docId = `${empId}_${it.dateKey}`;
        if (!deletedCalSet.has(docId)) {
          const prev = calMap.get(docId);
          calMap.set(docId, {
            ...it,
            empId,
            approverId: 'SM2080797',
            photo: compactImageForCloud(it.photo, 45000) || prev?.photo || ''
          });
        }
      }
    });
    const mergedCalendar = Array.from(calMap.values()).slice(0, 120);

    return {
      updatedAt: Date.now(),
      accounts: mergedAccounts,
      requests: mergedRequests,
      calendar: mergedCalendar,
      tombstones: mergedTombstones
    };
  }

  window.cloudStore = {
    ready: false,
    db: null,
    auth: null,
    user: null,

    pullFromCloud: async (manual = false) => {
      if (isSyncingNow) return;
      isSyncingNow = true;
      if (manual) updateCloudStatusBadge('⏳ กำลังซิงค์ข้อมูล...', 'syncing');

      try {
        const remoteData = await readCentralCloudState();
        if (!remoteData) {
          updateCloudStatusBadge('⚠️ ยังไม่พบการเชื่อมต่อคลาวด์', 'warn');
          if (manual && typeof showToast === 'function') {
            showToast('ไม่สามารถติดต่อฐานข้อมูลกลางได้ กรุณาตรวจอินเทอร์เน็ต');
          }
          return;
        }

        if (remoteData.tombstones && typeof window.syncTombstonesFromCloud === 'function') {
          window.syncTombstonesFromCloud(remoteData.tombstones);
        }
        if (remoteData.accounts && typeof window.syncAccountsFromCloud === 'function') {
          window.syncAccountsFromCloud(remoteData.accounts);
        }
        if (Array.isArray(remoteData.requests) && typeof window.syncRequestsFromCloud === 'function') {
          window.syncRequestsFromCloud(remoteData.requests);
        }
        if (Array.isArray(remoteData.calendar) && typeof window.syncCalendarFromCloud === 'function') {
          window.syncCalendarFromCloud(remoteData.calendar);
        }

        // ถ้าในเครื่องนี้มีข้อมูลที่ยังไม่ได้ส่งขึ้นคลาวด์ ให้ดันขึ้นไปรวมทันที (Two-Way Merge)
        const localSnap = typeof window.getAllLocalSyncSnapshot === 'function' ? window.getAllLocalSyncSnapshot() : null;
        if (localSnap) {
          const remoteReqIds = new Set((remoteData.requests || []).map(r => r.id));
          const hasUnpushedLocal = (localSnap.requests || []).some(r => r?.id && !remoteReqIds.has(r.id)) ||
            Object.keys(localSnap.accounts || {}).some(k => !(remoteData.accounts || {})[k]);
          if (hasUnpushedLocal) {
            const merged = buildMergedPayload(remoteData, localSnap);
            await writeCentralCloudState(merged);
          }
        }

        updateCloudStatusBadge('ออนไลน์ · ซิงค์ตรงกันทุกเครื่อง ✓', 'ok');
        if (manual && typeof showToast === 'function') {
          showToast('ซิงค์ฐานข้อมูลกลางตรงกันทุกเครื่อง (มือถือ ↔ คอมฯ) แล้ว ☁️✓');
        }
      } finally {
        isSyncingNow = false;
      }
    },

    pushAllLocalToCloud: async () => {
      if (typeof window.getAllLocalSyncSnapshot !== 'function') return false;
      lastCloudPushAt = Date.now();
      updateCloudStatusBadge('⏳ กำลังส่งข้อมูลขึ้นคลาวด์...', 'syncing');
      const localSnap = window.getAllLocalSyncSnapshot();
      const remoteData = await readCentralCloudState();
      const merged = buildMergedPayload(remoteData, localSnap);

      if (typeof window.syncTombstonesFromCloud === 'function') {
        window.syncTombstonesFromCloud(merged.tombstones);
      }

      const ok = await writeCentralCloudState(merged);
      updateCloudStatusBadge(ok ? 'ออนไลน์ · ซิงค์ตรงกันทุกเครื่อง ✓' : '⚠️ ส่งขึ้นคลาวด์ไม่สำเร็จ (เก็บในเครื่องแล้ว)', ok ? 'ok' : 'warn');
      return ok;
    },

    saveAccount: async (acc) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!acc?.empId) return;
      const cleanId = acc.empId.trim().toUpperCase();
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await setDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_accounts', cleanId), {
          empId: cleanId,
          firstName: acc.firstName || '',
          lastName: acc.lastName || '',
          password: acc.password || '',
          avatar: compactImageForCloud(acc.avatar || '', 32000)
        });
      }
    },

    deleteAccount: async (empId) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!empId) return;
      const cleanId = empId.trim().toUpperCase();
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await deleteDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_accounts', cleanId));
      }
    },

    saveRequest: async (req) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!req?.id) return;
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await setDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_requests', req.id), {
          ...req,
          photo: compactImageForCloud(req.photo || '', 45000),
          approverId: 'SM2080797',
          updatedAt: req.updatedAt || Date.now()
        });
      }
    },

    deleteRequest: async (reqId) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!reqId) return;
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await deleteDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_requests', reqId));
      }
    },

    saveCalendarItem: async (dateKey, item) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!dateKey || !item) return;
      const empKey = (item.empId || 'EMP').trim().toUpperCase();
      const docId = `${empKey}_${dateKey}`;
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await setDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_calendar_items', docId), {
          ...item,
          photo: compactImageForCloud(item.photo || '', 45000),
          dateKey,
          empId: empKey
        });
      }
    },

    deleteCalendarItem: async (empId, dateKey) => {
      if (typeof window.persistLocalDatabase === 'function') window.persistLocalDatabase();
      if (!dateKey) return;
      const empKey = (empId || 'EMP').trim().toUpperCase();
      const docId = `${empKey}_${dateKey}`;
      await window.cloudStore.pushAllLocalToCloud();
      if (window.cloudStore.user && window.cloudStore.db) {
        await deleteDoc(doc(window.cloudStore.db, 'artifacts', appId, 'public', 'data', 'oto_calendar_items', docId));
      }
    }
  };

  async function initCloudDatabase() {
    await window.cloudStore.pullFromCloud(false);

    setInterval(() => {
      if (Date.now() - lastCloudPushAt > 2500) {
        window.cloudStore.pullFromCloud(false);
      }
    }, 3500);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        window.cloudStore.pullFromCloud(false);
      }
    });

    if (!firebaseConfig) return;

    try {
      const fbApp = initializeApp(firebaseConfig);
      const auth = getAuth(fbApp);
      const db = getFirestore(fbApp);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      const currentUser = auth.currentUser;
      if (!currentUser) return;

      window.cloudStore.db = db;
      window.cloudStore.auth = auth;
      window.cloudStore.user = currentUser;
      window.cloudStore.ready = true;
      updateCloudStatusBadge('ออนไลน์ · ซิงค์ตรงกันทุกเครื่อง ✓', 'ok');

      const accountsCol = collection(db, 'artifacts', appId, 'public', 'data', 'oto_accounts');
      const requestsCol = collection(db, 'artifacts', appId, 'public', 'data', 'oto_requests');
      const calItemsCol = collection(db, 'artifacts', appId, 'public', 'data', 'oto_calendar_items');

      onSnapshot(accountsCol, (snap) => {
        const latest = {};
        snap.forEach((d) => {
          const data = d.data();
          if (data && data.empId) latest[data.empId.trim().toUpperCase()] = data;
        });
        if (typeof window.syncAccountsFromCloud === 'function') window.syncAccountsFromCloud(latest);
      });

      onSnapshot(requestsCol, (snap) => {
        const list = [];
        snap.forEach((d) => {
          const data = d.data();
          if (data && data.id) list.push(data);
        });
        list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        if (typeof window.syncRequestsFromCloud === 'function') window.syncRequestsFromCloud(list);
      });

      onSnapshot(calItemsCol, (snap) => {
        const allItems = [];
        snap.forEach((d) => {
          const data = d.data();
          if (data && data.dateKey) allItems.push(data);
        });
        if (typeof window.syncCalendarFromCloud === 'function') window.syncCalendarFromCloud(allItems);
      });
    } catch (e) {
      console.warn('Cloud init fallback:', e);
    }
  }

  initCloudDatabase();
</script>

    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'

  function getBangkokNowParts() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: THAI_TZ,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).formatToParts(now);

    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    const hour = map.hour === '24' ? '00' : map.hour;
    return {
      year: map.year,
      month: map.month,
      day: map.day,
      hour,
      minute: map.minute,
      second: map.second,
      dateKey: `${map.year}-${map.month}-${map.day}`,
      timeString: `${hour}:${map.minute}:${map.second}`
    };

      inner = `<path d="M38 15C28 16 21 24 21 34C21 44 29 51 39 51C32 48 28 41 28 33C28 25 32 18 38 15Z" fill="#A5F3FC" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/><circle cx="25" cy="33" r="1.8" fill="#1E1B4B"/><path d="M24 37Q26 39 28 37" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/><circle cx="43" cy="24" r="2" fill="#FDE68A"/>`;
    } else if (id === 'planet-ring') {

  // =========================================================================
  // ฐานข้อมูลจำรหัสและรายการถาวร (LocalStorage + ซิงค์คอมฯ ↔ มือถือเรียลไทม์)
  // =========================================================================
  const LOCAL_DB_KEYS = {
    accounts: 'oto_db_accounts_v2',
    requests: 'oto_db_requests_v2',
    calendar: 'oto_db_calendar_v2',
    tombstones: 'oto_db_tombstones_v2',
    lastAuth: 'oto_db_last_auth_v2'
  };

  const registeredAccounts = {};
  const deletedAccountIds = new Set();
  const deletedRequestIds = new Set();
  const deletedCalendarDocIds = new Set();
  let allCloudCalendarItems = [];

  window.getDeletedAccountIds = () => Array.from(deletedAccountIds);
  window.getDeletedRequestIds = () => Array.from(deletedRequestIds);
  window.getDeletedCalendarDocIds = () => Array.from(deletedCalendarDocIds);

  window.syncTombstonesFromCloud = function(remoteTombs) {
    if (!remoteTombs || typeof remoteTombs !== 'object') return;
    (Array.isArray(remoteTombs.accounts) ? remoteTombs.accounts : []).forEach(id => {
      const cleanId = String(id || '').trim().toUpperCase();
      if (cleanId && cleanId !== APPROVER_ID) {
        deletedAccountIds.add(cleanId);
        delete registeredAccounts[cleanId];
      }
    });
    (Array.isArray(remoteTombs.requests) ? remoteTombs.requests : []).forEach(reqId => {
      if (reqId) deletedRequestIds.add(String(reqId));
    });
    (Array.isArray(remoteTombs.calendar) ? remoteTombs.calendar : []).forEach(docId => {
      if (docId) deletedCalendarDocIds.add(String(docId));
    });

    state.teamRequests = state.teamRequests.filter(r => {
      const empId = (r.empId || '').trim().toUpperCase();
      return !deletedRequestIds.has(r.id) && !deletedAccountIds.has(empId);
    });
    allCloudCalendarItems = allCloudCalendarItems.filter(it => {
      const empId = (it.empId || '').trim().toUpperCase();
      const docId = `${empId}_${it.dateKey}`;
      return !deletedAccountIds.has(empId) && !deletedCalendarDocIds.has(docId);
    });
    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
  };

  window.getAllLocalSyncSnapshot = function() {
    return {
      accounts: { ...registeredAccounts },
      requests: [...state.teamRequests],
      calendar: [...allCloudCalendarItems]
    };
  };

  function loadLocalDatabase() {
    try {
      const tombRaw = localStorage.getItem(LOCAL_DB_KEYS.tombstones);
      if (tombRaw) {
        const parsedTombs = JSON.parse(tombRaw);
        (Array.isArray(parsedTombs?.accounts) ? parsedTombs.accounts : []).forEach(id => deletedAccountIds.add(String(id).toUpperCase()));
        (Array.isArray(parsedTombs?.requests) ? parsedTombs.requests : []).forEach(id => deletedRequestIds.add(String(id)));
        (Array.isArray(parsedTombs?.calendar) ? parsedTombs.calendar : []).forEach(id => deletedCalendarDocIds.add(String(id)));
      }
      const accRaw = localStorage.getItem(LOCAL_DB_KEYS.accounts);
      if (accRaw) {
        const parsedAcc = JSON.parse(accRaw);
        if (parsedAcc && typeof parsedAcc === 'object') {
          Object.keys(registeredAccounts).forEach(k => delete registeredAccounts[k]);
          Object.entries(parsedAcc).forEach(([k, v]) => {
            const cleanId = k.trim().toUpperCase();
            if (!deletedAccountIds.has(cleanId)) {
              registeredAccounts[cleanId] = v;
            }
          });
        }
      }
      const reqRaw = localStorage.getItem(LOCAL_DB_KEYS.requests);
      if (reqRaw) {
        const parsedReqs = JSON.parse(reqRaw);
        if (Array.isArray(parsedReqs)) {
          state.teamRequests = parsedReqs.filter(r => {
            const empId = (r?.empId || '').trim().toUpperCase();
            return r?.id && !deletedRequestIds.has(r.id) && !deletedAccountIds.has(empId);
          });
        }
      }
      const calRaw = localStorage.getItem(LOCAL_DB_KEYS.calendar);
      if (calRaw) {
        const parsedCal = JSON.parse(calRaw);
        if (Array.isArray(parsedCal)) {
          allCloudCalendarItems = parsedCal.filter(it => {
            const empId = (it?.empId || '').trim().toUpperCase();
            const docId = `${empId}_${it?.dateKey}`;
            return it?.dateKey && !deletedAccountIds.has(empId) && !deletedCalendarDocIds.has(docId);
          });
        }
      }
    } catch (e) {
      console.warn('Load local DB warning:', e);
    }
  }

  window.persistLocalDatabase = function() {
    const tombsPayload = {
      accounts: Array.from(deletedAccountIds),
      requests: Array.from(deletedRequestIds),
      calendar: Array.from(deletedCalendarDocIds)
    };
    try {
      localStorage.setItem(LOCAL_DB_KEYS.tombstones, JSON.stringify(tombsPayload));
      localStorage.setItem(LOCAL_DB_KEYS.accounts, JSON.stringify(registeredAccounts));
      localStorage.setItem(LOCAL_DB_KEYS.requests, JSON.stringify(state.teamRequests));
      localStorage.setItem(LOCAL_DB_KEYS.calendar, JSON.stringify(allCloudCalendarItems));
    } catch (e) {
      try {
        const compactReqs = state.teamRequests.map(r => ({
          ...r,
          photo: r.photo && r.photo.length > 140000 ? '' : r.photo
        }));
        const compactCal = allCloudCalendarItems.map(it => ({
          ...it,
          photo: it.photo && it.photo.length > 140000 ? '' : it.photo
        }));
        localStorage.setItem(LOCAL_DB_KEYS.tombstones, JSON.stringify(tombsPayload));
        localStorage.setItem(LOCAL_DB_KEYS.accounts, JSON.stringify(registeredAccounts));
        localStorage.setItem(LOCAL_DB_KEYS.requests, JSON.stringify(compactReqs));
        localStorage.setItem(LOCAL_DB_KEYS.calendar, JSON.stringify(compactCal));
      } catch (innerErr) {}
    }
  };

  function saveLastAuthHint(empId, password) {
    try {
      localStorage.setItem(LOCAL_DB_KEYS.lastAuth, JSON.stringify({ empId, password }));
    } catch (e) {}
  }

  function restoreLastAuthInputs() {
    try {
      const raw = localStorage.getItem(LOCAL_DB_KEYS.lastAuth);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved?.empId) {
        const idEl = document.getElementById('inpEmpId');
        const pwEl = document.getElementById('inpPassword');
        if (idEl) idEl.value = saved.empId;
        if (pwEl && saved.password) pwEl.value = saved.password;
      }
    } catch (e) {}
  }

  window.addEventListener('storage', (ev) => {
    if (!ev.key || !Object.values(LOCAL_DB_KEYS).includes(ev.key)) return;
    loadLocalDatabase();
    rebuildVisibleCalendarItems();
    if (!document.getElementById('loginScreen').classList.contains('hidden')) return;
    renderApp();
  });

  window.syncAccountsFromCloud = function(latestMap) {
    Object.entries(latestMap || {}).forEach(([k, v]) => {
      const cleanId = k.trim().toUpperCase();
      if (!deletedAccountIds.has(cleanId) && v && v.empId) {
        registeredAccounts[cleanId] = v;
      }
    });
    window.persistLocalDatabase();
    if (state.user && state.user.empId) {
      const myClean = state.user.empId.trim().toUpperCase();
      const me = registeredAccounts[myClean];
      if (me) {
        state.user.firstName = me.firstName || state.user.firstName;
        state.user.lastName = me.lastName || state.user.lastName;
        if (me.avatar) {
          state.user.avatar = me.avatar;
          if (myClean === APPROVER_ID) setSmAvatar(me.avatar);
        }
      }
    }
    onAuthEmpIdChange();
    if (!document.getElementById('loginScreen').classList.contains('hidden')) return;
    renderApp();
  };

  window.syncRequestsFromCloud = function(latestList) {
    if (Array.isArray(latestList)) {
      const mergedMap = new Map();
      state.teamRequests.forEach(r => {
        if (r?.id && !deletedRequestIds.has(r.id)) mergedMap.set(r.id, r);
      });
      latestList.forEach(r => {
        if (r?.id && !deletedRequestIds.has(r.id)) {
          const prev = mergedMap.get(r.id);
          if (!prev || (r.updatedAt || 0) >= (prev.updatedAt || 0)) {
            mergedMap.set(r.id, r);
          }
        }
      });
      state.teamRequests = Array.from(mergedMap.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      window.persistLocalDatabase();
    }
    if (!document.getElementById('loginScreen').classList.contains('hidden')) return;
    renderApp();
  };

  window.syncCalendarFromCloud = function(allItems) {
    if (Array.isArray(allItems)) {
      const mergedCal = new Map();
      allCloudCalendarItems.forEach(it => {
        if (it?.dateKey) {
          const docId = `${(it.empId || 'EMP').toUpperCase()}_${it.dateKey}`;
          if (!deletedCalendarDocIds.has(docId)) mergedCal.set(docId, it);
        }
      });
      allItems.forEach(it => {
        if (it?.dateKey) {
          const docId = `${(it.empId || 'EMP').toUpperCase()}_${it.dateKey}`;
          if (!deletedCalendarDocIds.has(docId)) mergedCal.set(docId, it);
        }
      });
      allCloudCalendarItems = Array.from(mergedCal.values());
      window.persistLocalDatabase();
    }
    rebuildVisibleCalendarItems();
    if (!document.getElementById('loginScreen').classList.contains('hidden')) return;
    renderApp();
  };

  function rebuildVisibleCalendarItems() {
    const nextItems = {};
    const myId = (state.user?.empId || '').trim().toUpperCase();
    const manager = isManager();
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));

    allCloudCalendarItems.forEach((it) => {
      const itemEmp = (it.empId || '').trim().toUpperCase();
      if (itemEmp && itemEmp !== APPROVER_ID && activeIds.size > 0 && !activeIds.has(itemEmp)) return;
      if (manager || itemEmp === myId) {
        nextItems[it.dateKey] = it;
      }
    });
    state.items = nextItems;
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function formatDateKey(y, mZero, d) {
    return `${y}-${pad2(mZero + 1)}-${pad2(d)}`;
  }

  function parseDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }

  function formatThaiShort(key) {
    if (!key) return '';
    const [y, m, d] = key.split('-').map(Number);
    return `${d} ${THAI_MONTHS_SHORT[m - 1]} ${y + 543}`;
  }

  function formatThaiFull(key) {
    if (!key) return '';
    const [y, m, d] = key.split('-').map(Number);
    const dt = parseDate(key);
    const wd = THAI_WEEKDAYS[dt.getUTCDay()];
    return `วัน${wd}ที่ ${d} ${THAI_MONTHS_FULL[m - 1]} ${y + 543}`;
  }

  function getThaiNowTimestamp() {
    const p = getBangkokNowParts();
    return `${formatThaiShort(p.dateKey)} ${p.timeString} น.`;
  }

  function calcHours(tIn, tOut) {
    if (!tIn || !tOut) return 0;
    const [h1, m1] = tIn.split(':').map(Number);
    const [h2, m2] = tOut.split(':').map(Number);
    const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    return diff > 0 ? Math.round((diff / 60) * 10) / 10 : 0;
  }

  function calcLeaveDays(fromKey, toKey) {
    if (!fromKey || !toKey) return 0;
    const diff = Math.round((parseDate(toKey) - parseDate(fromKey)) / 86400000) + 1;
    return diff > 0 ? diff : 0;
  }

  function getEmployeeAvatarHtml(userObj, sizePx = 44) {
    const cleanId = (userObj?.empId || '').trim().toUpperCase();
    const accAvatar = cleanId && registeredAccounts[cleanId]?.avatar ? registeredAccounts[cleanId].avatar : '';
    const avatarSrc = (userObj && userObj.avatar) || accAvatar || (cleanId === APPROVER_ID ? getSmAvatar() : '');
    if (avatarSrc) {
      return `<img src="${avatarSrc}" alt="โปรไฟล์" style="width:${sizePx}px;height:${sizePx}px;object-fit:cover;border-radius:9999px;display:block;" />`;
    }
    return renderMoodSvg(cleanId === APPROVER_ID ? 'proud' : (userObj?.mood || 'happy'), sizePx);
  }

  function getCosmicForDate(dateKey) {
    const hash = dateKey.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0) + state.calSeed;
    return COSMIC_ICONS[hash % COSMIC_ICONS.length].id;

  // =========================================================================

    if (mode === 'login') {
      btnLogin.className = 'comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white';

    } else {
      btnLogin.className = 'comic-pill py-2 text-xs font-bold bg-[#2c2866] text-white border-[#7a76a3]';
      btnReg.className = 'comic-pill py-2 text-xs font-bold bg-[#c6f3dc] text-[#1e1b4b] border-white';
      btnSubmit.textContent = '✨ สร้างรหัสและเข้าใช้งาน';

      lblPass.textContent = 'ตั้งรหัสผ่านใหม่ (Password)';

  function onAuthEmpIdChange() {
    const rawId = document.getElementById('inpEmpId').value.trim().toUpperCase();
    const approverBadge = document.getElementById('approverRecognizedBadge');
    const nameGroup = document.getElementById('nameFieldsGroup');
    const lblPass = document.getElementById('lblPasswordField');
    const btnResetSm = document.getElementById('btnResetSmPass');

    if (rawId === APPROVER_ID) {
      if (authMode !== 'login') {
        authMode = 'login';
        document.getElementById('btnAuthLoginMode').className = 'comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white';
        document.getElementById('btnAuthRegisterMode').className = 'comic-pill py-2 text-xs font-bold bg-[#2c2866] text-white border-[#7a76a3]';
        document.getElementById('btnAuthSubmit').textContent = 'เข้าใช้งานระบบ';
        document.getElementById('btnAuthSubmit').className = 'comic-btn w-full py-3.5 bg-[#ffb98a] text-[#1e1b4b] text-base mt-1';
      }
      approverBadge.classList.remove('hidden');
      nameGroup.classList.add('hidden');
      lblPass.textContent = `รหัสผ่านผู้อนุมัติ (${APPROVER_ID})`;
      if (btnResetSm) btnResetSm.classList.remove('hidden');
      document.getElementById('authHelperNote').innerHTML = `* ผู้อนุมัติหลัก <b>${APPROVER_NAME.firstName} ${APPROVER_NAME.lastName}</b> กรอกรหัสผ่านเพื่อเข้าใช้งาน`;
    } else {
      approverBadge.classList.add('hidden');
      if (btnResetSm) btnResetSm.classList.add('hidden');
      if (authMode === 'register') {
        nameGroup.classList.remove('hidden');
        lblPass.textContent = 'ตั้งรหัสผ่านใหม่ (Password)';
      } else {
        const known = registeredAccounts[rawId];
        if (known) {
          nameGroup.classList.add('hidden');
          lblPass.textContent = `รหัสผ่านของ ${known.firstName} (${rawId})`;
        } else {
          nameGroup.classList.add('hidden');
          lblPass.textContent = 'รหัสผ่าน (Password)';
        }
      }
    }
  }

  async function handleLogin() {
    loadLocalDatabase();
    const empId = document.getElementById('inpEmpId').value.trim().toUpperCase();
    const password = document.getElementById('inpPassword').value.trim();

    if (!empId) {
      showToast('กรุณากรอกรหัสพนักงาน');
      return;
    }

    if (empId === APPROVER_ID) {
      const validSmPass = getApproverPassword();
      if (!password || (password !== validSmPass && password !== DEFAULT_APPROVER_PASS && password.toUpperCase() !== APPROVER_ID)) {
        showToast(`รหัสผ่านสำหรับ ${APPROVER_ID} ไม่ถูกต้อง (กดปุ่ม "🔄 รีรหัสผ่าน SM" ด้านบนได้)`);
        return;
      }
      state.user = {
        firstName: APPROVER_NAME.firstName,
        lastName: APPROVER_NAME.lastName,
        empId: APPROVER_ID,
        avatar: registeredAccounts[APPROVER_ID]?.avatar || getSmAvatar()
      };
      saveLastAuthHint(APPROVER_ID, password);
      rebuildVisibleCalendarItems();
      state.activeTab = 'app';
      document.getElementById('loginScreen').classList.add('hidden');
      renderApp();
      showToast(`กำลังซิงค์ข้อมูลล่าสุดให้ ${APPROVER_ID}...`);
      await window.cloudStore?.pullFromCloud(true);
      return;
    }

    if (!registeredAccounts[empId] && window.cloudStore?.pullFromCloud) {
      await window.cloudStore.pullFromCloud(false);
    }

    if (authMode === 'register') {
      const firstName = document.getElementById('inpFirst').value.trim();
      const lastName = document.getElementById('inpLast').value.trim();
      if (!firstName || !lastName || !password) {
        showToast('กรุณากรอกรหัสพนักงาน ชื่อ นามสกุล และตั้ง Password ให้ครบ');
        return;
      }
      if (registeredAccounts[empId]) {
        showToast(`รหัส ${empId} มีในระบบแล้ว กรุณากดเข้าสู่ระบบ`);
        return;
      }
      deletedAccountIds.delete(empId);
      registeredAccounts[empId] = { firstName, lastName, empId, password };
      window.persistLocalDatabase();
      saveLastAuthHint(empId, password);
      await window.cloudStore?.saveAccount(registeredAccounts[empId]);
      state.user = { firstName, lastName, empId };
      rebuildVisibleCalendarItems();
      state.activeTab = 'cal';
      document.getElementById('loginScreen').classList.add('hidden');
      showToast(`สร้างรหัส ${empId} (${firstName} ${lastName}) และซิงค์ออนไลน์แล้ว ✓`);
      renderApp();
      return;
    }

    const existing = registeredAccounts[empId];
    if (existing) {
      if (password !== existing.password) {
        showToast(`รหัสผ่านของ ${empId} ไม่ถูกต้อง`);
        return;
      }
      saveLastAuthHint(empId, password);
      state.user = { firstName: existing.firstName, lastName: existing.lastName, empId, avatar: existing.avatar || '' };
      rebuildVisibleCalendarItems();
    } else {
      const firstName = document.getElementById('inpFirst').value.trim();
      const lastName = document.getElementById('inpLast').value.trim();
      if (!firstName || !lastName || !password) {
        showToast('ไม่พบรหัสนี้ในฐานข้อมูลกลาง กรุณากด "✨ สร้างรหัสพนักงาน" เพื่อลงทะเบียน');
        return;
      }
      deletedAccountIds.delete(empId);
      registeredAccounts[empId] = { firstName, lastName, empId, password };
      window.persistLocalDatabase();
      saveLastAuthHint(empId, password);
      await window.cloudStore?.saveAccount(registeredAccounts[empId]);
      state.user = { firstName, lastName, empId };
      rebuildVisibleCalendarItems();
    }

    state.activeTab = 'cal';
    document.getElementById('loginScreen').classList.add('hidden');
    showToast(`ยินดีต้อนรับ ${state.user.firstName} (${empId})`);
    renderApp();
  }

  function getActiveLeaveForDate(dateKey) {
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));
    const isAccountValid = (empId) => {
      const id = (empId || '').trim().toUpperCase();
      if (!id || id === APPROVER_ID) return true;
      return activeIds.size === 0 || activeIds.has(id);
    };

    const reqMatch = state.teamRequests.find(
      r => r.type === 'leave' &&
           r.status !== 'rejected' &&
           isAccountValid(r.empId) &&
           dateKey >= r.from &&
           dateKey <= (r.to || r.from)
    );
    if (reqMatch) return reqMatch;

    for (const [k, v] of Object.entries(state.items)) {
      if (v && v.type === 'leave' && isAccountValid(v.empId)) {
        const end = v.to || k;
        if (dateKey >= k && dateKey <= end) {
          return {
            empId: v.empId || state.user.empId || 'EMP',
            firstName: state.user.firstName || 'พนักงาน',
            lastName: state.user.lastName || '',
            from: k,
            to: end,
            mood: v.mood || 'calm',
            cosmicIcon: v.cosmicIcon
          };
        }
      }
    }
    return null;
  }

  function detectCheckoutLocation(silent = false) {
    const locInp = document.getElementById('inpCheckoutLocation');
    if (!navigator.geolocation) {
      if (!silent) showToast('อุปกรณ์ไม่รองรับ GPS กรุณาพิมพ์สถานที่เอง');
      return;
    }
    if (!silent) showToast('กำลังขอสิทธิ์และดึงตำแหน่งจาก GPS...');
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        lastGpsCoords = { lat, lng };
        let resolvedPlace = `พิกัด GPS ${lat}, ${lng}`;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=th`);
          if (res.ok) {
            const data = await res.json();
            const addr = data.address || {};
            const road = addr.road || addr.suburb || addr.neighbourhood || '';
            const district = addr.city_district || addr.district || addr.town || addr.county || '';
            const province = addr.province || addr.state || addr.city || '';
            const postcode = addr.postcode || '';
            const formatted = [road, district, province, postcode].filter(Boolean).join(' ');
            if (formatted) {
              resolvedPlace = formatted;
            } else if (data.display_name) {
              resolvedPlace = data.display_name.split(',').slice(0, 3).join(', ');
            }
          }
        } catch (err) {}

        currentPhotoLocation = resolvedPlace;
        const freshLocInp = document.getElementById('inpCheckoutLocation');
        if (freshLocInp) freshLocInp.value = currentPhotoLocation;
        updateCheckoutPhotoPreview();
        if (!silent) showToast('ระบุสถานที่จาก GPS เรียบร้อย 📍');
      },
      (err) => {
        if (!silent) {
          showToast(err && err.code === 1
            ? 'กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS) บนเบราว์เซอร์'
            : 'ไม่สามารถรับสัญญาณ GPS ได้ กรุณาพิมพ์สถานที่เอง');
        }
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
    );
  }

  function drawRoundedRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function wrapCanvasLines(ctx, text, maxWidth) {
    const chars = Array.from(text || '');
    const lines = [];
    let current = '';
    for (const ch of chars) {
      const test = current + ch;
      if (ctx.measureText(test).width > maxWidth && current.length > 0) {
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines.slice(0, 3);
  }

  function stampPhotoWithTimeAndLocation(dataUrl) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 540;
        const scale = img.width > maxW ? maxW / img.width : 1;
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const bkk = getBangkokNowParts();
        const rawTime = getCheckoutTimeLabel().replace(' น.', '');
        const thaiDateText = formatThaiFull(currentDateKey || bkk.dateKey);
        const locText = getCheckoutLocationLabel();

        const padX = Math.max(12, Math.round(w * 0.032));
        const baseFont = Math.max(12, Math.round(w * 0.032));
        const timeFont = Math.max(18, Math.round(w * 0.056));
        const tagFont = Math.max(12, Math.round(w * 0.034));

        ctx.font = `600 ${baseFont}px Anuphan, sans-serif`;
        const locLines = wrapCanvasLines(ctx, locText, w - padX * 2 - 20);
        const lineHeight = Math.round(baseFont * 1.38);

        const badgeH = Math.round(timeFont * 1.38);
        const totalBlockH = badgeH + 12 + lineHeight + (locLines.length * lineHeight) + 24;
        const startY = Math.max(14, h - totalBlockH - Math.round(h * 0.035));

        const grad = ctx.createLinearGradient(0, startY - 20, 0, h);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(0.28, 'rgba(0, 0, 0, 0.42)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.72)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, startY - 20, w, h - (startY - 20));

        ctx.font = `700 ${tagFont}px Kanit, sans-serif`;
        const tagText = 'เช็กเอาท์';
        const tagBoxW = Math.round(ctx.measureText(tagText).width + 18);
        const tagBoxH = Math.round(badgeH - 8);

        ctx.font = `700 ${timeFont}px Kanit, sans-serif`;
        const timeW = Math.round(ctx.measureText(rawTime).width + 20);
        const pillW = tagBoxW + timeW + 12;

        drawRoundedRectPath(ctx, padX, startY, pillW, badgeH, 9);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
        ctx.fill();

        drawRoundedRectPath(ctx, padX + 4, startY + 4, tagBoxW, tagBoxH, 6);
        ctx.fillStyle = '#FBBF24';
        ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.font = `700 ${tagFont}px Kanit, sans-serif`;
        ctx.fillText(tagText, padX + 12, startY + 4 + Math.round(tagBoxH * 0.72));

        ctx.fillStyle = '#0F172A';
        ctx.font = `700 ${timeFont}px Kanit, sans-serif`;
        ctx.fillText(rawTime, padX + tagBoxW + 12, startY + Math.round(badgeH * 0.76));

        const detailsTop = startY + badgeH + 10;
        const detailsHeight = lineHeight + (locLines.length * lineHeight);
        ctx.fillStyle = '#FBBF24';
        ctx.fillRect(padX, detailsTop, 4, detailsHeight);

        const textX = padX + 12;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 5;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 1;

        ctx.fillStyle = '#FFFFFF';
        ctx.font = `700 ${baseFont}px Anuphan, sans-serif`;
        ctx.fillText(thaiDateText, textX, detailsTop + Math.round(baseFont * 0.95));

        ctx.font = `500 ${Math.round(baseFont * 0.94)}px Anuphan, sans-serif`;
        locLines.forEach((ln, idx) => {
          ctx.fillText(ln, textX, detailsTop + lineHeight * (idx + 1) + Math.round(baseFont * 0.95));
        });

        ctx.font = `500 ${Math.max(10, Math.round(baseFont * 0.78))}px Anuphan, sans-serif`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.fillText('✓ oto GPS & Time Verified', padX, detailsTop + detailsHeight + Math.round(baseFont * 1.1));

        ctx.shadowColor = 'transparent';
        resolve(canvas.toDataURL('image/jpeg', 0.56));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  function updateCheckoutPhotoPreview() {
    const area = document.getElementById('photoPreviewArea');

    if (!currentPhoto) {

    const timeLabel = getCheckoutTimeLabel();

  function stopLiveCamera() {
    if (cameraMediaStream) {
      cameraMediaStream.getTracks().forEach(t => t.stop());
      cameraMediaStream = null;
    }
    const box = document.getElementById('liveCameraBox');
    if (box) box.classList.add('hidden');
  }

  async function openCameraCapture(preferredFacing = 'environment') {
    cameraFacingMode = preferredFacing || cameraFacingMode || 'environment';
    const nowTime = getBangkokNowParts().timeString.slice(0, 5);
    const timeInp = document.getElementById('inpCheckoutTime');
    if (timeInp) {
      timeInp.value = nowTime;
      currentPhotoTime = nowTime;
    }
    if (!currentPhotoLocation) {
      detectCheckoutLocation(true);
    }

    stopLiveCamera();

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        cameraMediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: cameraFacingMode } },
          audio: false
        });
        const box = document.getElementById('liveCameraBox');
        const video = document.getElementById('liveCameraVideo');
        const lbl = document.getElementById('cameraFacingLabel');
        if (box && video) {
          box.classList.remove('hidden');
          video.srcObject = cameraMediaStream;
          video.style.transform = cameraFacingMode === 'user' ? 'scaleX(-1)' : 'none';
          if (lbl) {
            lbl.textContent = cameraFacingMode === 'user' ? '🤳 โหมด: กล้องหน้า' : '📷 โหมด: กล้องหลัง';
          }
          return;
        }
      } catch (err) {}
    }

    const fallbackInputId = cameraFacingMode === 'user' ? 'inpCameraFileFront' : 'inpCameraFileRear';
    const camInput = document.getElementById(fallbackInputId);
    if (camInput) {
      camInput.value = '';
      camInput.click();
    }
  }

  async function toggleCameraFacing() {
    const nextMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
    await openCameraCapture(nextMode);
  }

  async function snapFromLiveCamera() {
    const video = document.getElementById('liveCameraVideo');
    if (!video) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    if (cameraFacingMode === 'user') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (cameraFacingMode === 'user') {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    const rawDataUrl = canvas.toDataURL('image/jpeg', 0.85);
    stopLiveCamera();
    currentPhoto = await stampPhotoWithTimeAndLocation(rawDataUrl);
    updateCheckoutPhotoPreview();
    validateForm();
    showToast(`ถ่ายรูปเช็คเอาท์พร้อมประทับเวลา (${getCheckoutTimeLabel()}) และสถานที่ GPS แล้ว 📸`);
  }

    document.getElementById('segLeaveBtn').className = `comic-pill py-2.5 text-sm ${type === 'leave' ? 'bg-[#c6f3dc]' : 'bg-white'}`;
    document.getElementById('otFormSection').classList.toggle('hidden', type !== 'ot');

      if (btn) {

  function handlePhotoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const nowTime = getBangkokNowParts().timeString.slice(0, 5);
    const timeInp = document.getElementById('inpCheckoutTime');
    if (timeInp && !timeInp.value) {
      timeInp.value = nowTime;
      currentPhotoTime = nowTime;
    }
    if (!currentPhotoLocation) {
      detectCheckoutLocation(true);
    }

    const reader = new FileReader();
    reader.onload = async (ev) => {
      currentPhoto = await stampPhotoWithTimeAndLocation(ev.target.result);
      e.target.value = '';
      updateCheckoutPhotoPreview();
      validateForm();
      showToast(`แนบรูปพร้อมประทับเวลา (${getCheckoutTimeLabel()}) และสถานที่ GPS แล้ว 📸`);
    };
    reader.readAsDataURL(file);
  }

  function findLeaveOverlap(fromKey, toKey) {
    for (const [k, v] of Object.entries(state.items)) {
      if (v.type !== 'leave') continue;
      if (k === currentDateKey) continue;
      const existFrom = k;
      const existTo = v.to || k;
      if (fromKey <= existTo && toKey >= existFrom) {
        return { from: existFrom, to: existTo };
      }
    }
    return null;
  }

  function onManualTimeInput() {
    validateForm();
  }

  function validateForm() {
    const btn = document.getElementById('btnSaveEntry');
    if (!btn) return;

    if (currentTabType === 'ot') {
      const tin = document.getElementById('inpTimeIn').value;
      const tout = document.getElementById('inpTimeOut').value;
      const hrs = calcHours(tin, tout);
      const errEl = document.getElementById('otTimeError');
      const badgeEl = document.getElementById('otHoursBadge');

      if (hrs <= 0) {
        errEl.classList.remove('hidden');
        badgeEl.textContent = 'เวลาไม่ถูกต้อง';
        btn.disabled = true;
        return;
      }
      errEl.classList.add('hidden');
      badgeEl.textContent = `+${hrs} ชม.`;
      btn.disabled = !currentPhoto;
      btn.textContent = currentPhoto
        ? `ส่งคำขอ OT (+${hrs} ชม.) ให้ ${APPROVER_ID}`
        : 'กรุณาแนบรูปเช็คเอาท์ก่อนส่งคำขอ';
    } else {
      const lfr = document.getElementById('inpLeaveFrom').value;
      const lto = document.getElementById('inpLeaveTo').value;
      const errEl = document.getElementById('leaveErrorMsg');
      const badgeEl = document.getElementById('leaveDaysBadge');
      const days = calcLeaveDays(lfr, lto);

      if (!lfr || !lto || parseDate(lto) < parseDate(lfr)) {
        errEl.textContent = 'วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่มต้น';
        errEl.classList.remove('hidden');
        badgeEl.textContent = 'วันที่ไม่ถูกต้อง';
        btn.disabled = true;
        return;
      }
      if (days > MAX_CONSECUTIVE_LEAVE_DAYS) {
        errEl.textContent = `ขอลาพักร้อนติดต่อกันได้สูงสุด ${MAX_CONSECUTIVE_LEAVE_DAYS} วัน (คุณเลือก ${days} วัน)`;
        errEl.classList.remove('hidden');
        badgeEl.textContent = `${days} วัน (เกินโควตา)`;
        btn.disabled = true;
        return;
      }
      const overlap = findLeaveOverlap(lfr, lto);
      if (overlap) {
        errEl.textContent = `ช่วงวันที่ซ้ำซ้อนกับการลาพักร้อนเดิม (${formatThaiShort(overlap.from)} – ${formatThaiShort(overlap.to)})`;
        errEl.classList.remove('hidden');
        badgeEl.textContent = 'ช่วงวันซ้ำซ้อน';
        btn.disabled = true;
        return;
      }
      errEl.classList.add('hidden');
      badgeEl.textContent = `${days} วัน`;
      btn.disabled = false;
      btn.textContent = `ส่งคำขอลาพักร้อน (${days} วัน) ให้ ${APPROVER_ID}`;
    }
  }

  function clearPhoto() {
    currentPhoto = '';
    ['inpPhotoFile', 'inpCameraFileRear', 'inpCameraFileFront'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    updateCheckoutPhotoPreview();
    validateForm();
  }

  async function saveCurrentEntry() {
    if (isManager()) {
      showToast(`สิทธิ์ผู้อนุมัติ ${APPROVER_ID} ไม่สามารถบันทึกเวลาได้`);
      return;
    }

    const existingCosmic = state.items[currentDateKey]?.cosmicIcon || getCosmicForDate(currentDateKey);
    const cleanEmpId = (state.user.empId || '').trim().toUpperCase();

    if (currentTabType === 'ot') {
      const tin = document.getElementById('inpTimeIn').value;
      const tout = document.getElementById('inpTimeOut').value;
      const hrs = calcHours(tin, tout);
      const note = document.getElementById('inpNote').value.trim() || 'ปฏิบัติงานล่วงเวลา (OT)';
      if (hrs <= 0 || !currentPhoto) {
        validateForm();
        return;
      }

      const calItem = {
        type: 'ot',
        empId: cleanEmpId,
        dateKey: currentDateKey,
        timeIn: tin,
        timeOut: tout,
        checkoutTime: getCheckoutTimeLabel(),
        checkoutLocation: getCheckoutLocationLabel(),
        note,
        photo: currentPhoto,
        mood: currentMood,
        cosmicIcon: existingCosmic,
        approverId: APPROVER_ID,
        status: 'submitted'
      };
      state.items[currentDateKey] = calItem;
      allCloudCalendarItems = allCloudCalendarItems.filter(
        it => !((it.empId || '').toUpperCase() === cleanEmpId && it.dateKey === currentDateKey)
      );
      allCloudCalendarItems.push(calItem);

      const newOtReq = {
        id: 'req-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        firstName: state.user.firstName,
        lastName: state.user.lastName,
        empId: cleanEmpId,
        approverId: APPROVER_ID,
        type: 'ot',
        from: currentDateKey,
        to: currentDateKey,
        timeIn: tin,
        timeOut: tout,
        checkoutTime: getCheckoutTimeLabel(),
        checkoutLocation: getCheckoutLocationLabel(),
        hours: hrs,
        note,
        photo: currentPhoto,
        mood: currentMood,
        updatedAt: Date.now(),
        status: 'submitted'
      };
      state.teamRequests.unshift(newOtReq);
      window.persistLocalDatabase();
      showToast(`กำลังซิงค์คำขอ OT ไปที่ ${APPROVER_ID}...`);
      await window.cloudStore?.saveRequest(newOtReq);

      showToast(`ส่งคำขอ OT +${hrs} ชม. ขึ้นฐานข้อมูลกลางให้ ${APPROVER_ID} แล้ว ✓`);
    } else {
      const lfr = document.getElementById('inpLeaveFrom').value;
      const lto = document.getElementById('inpLeaveTo').value;
      const dayCount = calcLeaveDays(lfr, lto);
      if (!lfr || !lto || parseDate(lto) < parseDate(lfr) || dayCount > MAX_CONSECUTIVE_LEAVE_DAYS || findLeaveOverlap(lfr, lto)) {
        validateForm();
        return;
      }

      const calLeaveItem = {
        type: 'leave',
        empId: cleanEmpId,
        dateKey: lfr,
        to: lto,
        mood: currentMood,
        cosmicIcon: existingCosmic,
        approverId: APPROVER_ID,
        status: 'submitted'
      };
      state.items[lfr] = calLeaveItem;
      allCloudCalendarItems = allCloudCalendarItems.filter(
        it => !((it.empId || '').toUpperCase() === cleanEmpId && it.dateKey === lfr)
      );
      allCloudCalendarItems.push(calLeaveItem);

      const owner = state.user || { firstName: 'พนักงาน', lastName: '', empId: cleanEmpId || 'EMP-0231' };
      const newLeaveReq = {
        id: 'req-' + Date.now() + '-' + Math.floor(Math.random() * 1000),

      };

      window.persistLocalDatabase();
      showToast(`กำลังซิงค์คำขอลาพักร้อนไปที่ ${APPROVER_ID}...`);

    currentPhoto = '';

  function deleteCurrentEntry() {
    if (!currentDateKey || !state.items[currentDateKey]) return;
    const empId = (state.items[currentDateKey].empId || state.user?.empId || '').toUpperCase();
    delete state.items[currentDateKey];
    allCloudCalendarItems = allCloudCalendarItems.filter(
      it => !((it.empId || '').toUpperCase() === empId && it.dateKey === currentDateKey)
    );
    currentPhoto = '';
    window.persistLocalDatabase();
    window.cloudStore?.deleteCalendarItem(empId, currentDateKey);
    showToast('ลบรายการเรียบร้อยแล้ว');
    closeDaySheet();
  }

  function getTeamOtSummaryRows() {
    const map = {};
    const ensureEmp = (empId, firstName, lastName) => {
      const cleanId = (empId || '').trim().toUpperCase();
      if (!cleanId || cleanId === APPROVER_ID) return null;
      if (!map[cleanId]) {
        map[cleanId] = {
          empId: cleanId,
          fullName: `${firstName || ''} ${lastName || ''}`.trim() || cleanId,
          approvedHours: 0,
          pendingHours: 0,
          rejectedHours: 0,
          otCount: 0,
          leaveDays: 0
        };
      }
      return map[cleanId];
    };

    Object.values(registeredAccounts).forEach(acc => {
      ensureEmp(acc.empId, acc.firstName, acc.lastName);
    });

    state.teamRequests.forEach(r => {
      const row = ensureEmp(r.empId, r.firstName, r.lastName);
      if (!row) return;
      if (r.type === 'ot') {
        const h = Number(r.hours || 0);
        row.otCount += 1;
        if (r.status === 'approved') row.approvedHours += h;
        else if (r.status === 'rejected') row.rejectedHours += h;
        else row.pendingHours += h;
      } else if (r.type === 'leave' && r.status !== 'rejected') {
        row.leaveDays += calcLeaveDays(r.from, r.to || r.from);
      }
    });

    return Object.values(map).sort((a, b) => (b.approvedHours + b.pendingHours) - (a.approvedHours + a.pendingHours));
  }
