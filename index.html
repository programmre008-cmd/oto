<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="oto" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link id="dynamicManifestLink" rel="manifest" />
  <link id="appleTouchIconLink" rel="apple-touch-icon" />
  <title>oto — ปฏิทินโอที & ลาพักร้อน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Fredoka:wght@600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1e1b4b;
      --paper: #f6f5ff;
      --card: #ffffff;
      --peach: #ffb98a;
      --lavender: #e5e2ff;
      --mint: #c6f3dc;
      --sky: #d9f0ff;
      --rose: #ffd6e0;
      --muted: #7a76a3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
      pointer-events: auto !important;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Anuphan', sans-serif;
      background: #e9e6fb;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    @media (max-width: 640px) {
      html, body {
        padding: 0;
        background: var(--ink);
        align-items: stretch;
      }
      .phone-shell {
        width: 100vw !important;
        min-width: 100vw !important;
        max-width: 100vw !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }
      .bottom-nav {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
      }
      .sheet-card {
        max-height: 92dvh !important;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }

    h1, h2, h3, .font-heading {
      font-family: 'Kanit', sans-serif;
    }

    .font-brand {
      font-family: 'Fredoka', sans-serif;
    }

    .phone-shell {
      width: 412px;
      min-width: 360px;
      max-width: 100%;
      height: 830px;
      max-height: 94vh;
      margin: 0 auto;
      flex-shrink: 0;
      background: var(--paper);
      border-radius: 44px;
      border: 4px solid var(--ink);
      box-shadow: 0 24px 54px rgba(30, 27, 75, 0.22);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      background: #ffffff;
      padding: 16px 20px 26px;
      position: relative;
      z-index: 10;
    }

    .wave-divider {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 22px;
      display: block;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 104px;
      scrollbar-width: none;
    }
    .main-scroll::-webkit-scrollbar {
      display: none;
    }

    .comic-card {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 26px;
      box-shadow: 0 5px 0 var(--ink);
    }

    .comic-pill {
      border: 2px solid var(--ink);
      border-radius: 9999px;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .comic-pill:active {
      transform: scale(0.96);
    }

    .comic-input {
      width: 100%;
      background: #ffffff !important;
      color: var(--ink) !important;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 11px 14px;
      font-family: 'Anuphan', sans-serif;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      cursor: text;
      -webkit-appearance: none;
      appearance: none;
      transition: box-shadow 0.15s ease, transform 0.12s ease;
    }
    .comic-input::placeholder {
      color: #9e9bc2;
      font-weight: 400;
    }
    .comic-input:focus {
      box-shadow: 0 3px 0 var(--ink);
      background: #fffdfb !important;
    }

    .comic-btn {
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }
    .comic-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .comic-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .day-cell {
      aspect-ratio: 1 / 1.16;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.15s ease;
      position: relative;
      background: #f4f3ff;
    }
    .day-cell:hover {
      border-color: rgba(30, 27, 75, 0.25);
    }
    .day-cell:active {
      transform: scale(0.93);
    }
    .day-cell.other-month {
      opacity: 0.32;
      background: transparent;
    }
    .day-cell.is-today {
      border: 2.5px solid var(--ink);
      background: #ffffff;
    }
    .day-cell.has-ot {
      background: linear-gradient(180deg, #ffe6d3 0%, #ffd5ec 100%);
      border: 2px solid var(--ink);
    }
    .day-cell.has-leave {
      background: #0d9488;
      border: 2px solid var(--ink);
      color: #ffffff;
    }
    .day-cell.has-leave .day-num {
      color: #ffffff !important;
    }
    .day-cell.has-leave .day-badge-leave {
      background: #064e3b;
      color: #ffffff;
      border-color: #ffffff;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2.5px solid var(--ink);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 10px 14px 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 25;
      box-shadow: 0 -6px 20px rgba(30, 27, 75, 0.08);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      min-width: 62px;
      transition: color 0.15s ease;
    }
    .nav-item.active {
      color: var(--ink);
    }
    .nav-item.active .nav-icon-wrap {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -22px;
      box-shadow: 0 3px 0 var(--ink);
    }
    .nav-icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(24, 21, 58, 0.55);
      backdrop-filter: blur(2px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-card {
      background: #f6f5ff;
      border-top: 3px solid var(--ink);
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      padding: 14px 18px 24px;
      max-height: 88%;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      scrollbar-width: none;
    }
    .sheet-card::-webkit-scrollbar {
      display: none;
    }
    .sheet-backdrop.open .sheet-card {
      transform: translateY(0);
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: var(--ink);
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 20px 28px;
      color: #ffffff;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .login-overlay::-webkit-scrollbar {
      display: none;
    }
    .login-overlay.hidden {
      display: none;
    }

    .toast-pill {
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #ffffff;
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 0 var(--ink);
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      max-width: 90%;
      text-align: center;
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="phone-shell" id="phoneShell">
  <!-- Login Overlay -->
  <div class="login-overlay" id="loginScreen">
    <div class="flex flex-col items-center text-center mt-2">
      <div class="w-16 h-16 rounded-full bg-white border-[3px] border-[#ffb98a] flex items-center justify-center mb-2 shadow-lg">
        <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="34" r="24" fill="#FFE6D5" stroke="#1E1B4B" stroke-width="3.5"/>
          <path d="M12 24C14 14 23 10 32 10C41 10 50 14 52 24C45 20 39 22 32 22C25 22 19 20 12 24Z" fill="#1E1B4B"/>
          <circle cx="24" cy="34" r="2.8" fill="#1E1B4B"/>
          <circle cx="40" cy="34" r="2.8" fill="#1E1B4B"/>
          <path d="M26 42C28.5 45 35.5 45 38 42" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
          <circle cx="46" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
        </svg>
      </div>
      <div class="font-brand text-3xl tracking-tight text-white">oto</div>
      <p class="text-xs text-[#c7c3ea] mt-0.5">บันทึกเวลาโอที & วันลาพักร้อนของทีม</p>
    </div>

    <div class="space-y-3 my-auto pt-3">
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="btnAuthLoginMode" onclick="setAuthMode('login')" class="comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white">
          🔑 เข้าสู่ระบบ
        </button>
        <button type="button" id="btnAuthRegisterMode" onclick="setAuthMode('register')" class="comic-pill py-2 text-xs font-bold bg-[#2c2866] text-white border-[#7a76a3]">
          ✨ สร้างรหัสพนักงาน
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ใส่รหัสพนักงาน</label>
        <input id="inpEmpId" type="text" oninput="onAuthEmpIdChange()" class="comic-input uppercase" placeholder="ใส่รหัสพนักงาน" value="" autocomplete="username" />
      </div>

      <div id="approverRecognizedBadge" class="hidden rounded-2xl bg-[#c6f3dc] text-[#1e1b4b] px-3 py-2 text-xs font-bold">
        🛡️ ผู้อนุมัติหลัก: <span id="approverRecognizedName">นาย ณัฐวุฒิ ชุมหิรัญ</span> (ไม่ต้องกรอกชื่อ ใส่รหัสผ่านได้เลย)
      </div>

      <div id="nameFieldsGroup" class="grid grid-cols-2 gap-2.5 hidden">
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ชื่อ</label>
          <input id="inpFirst" type="text" class="comic-input" placeholder="เช่น กานต์พิชชา" value="" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">นามสกุล</label>
          <input id="inpLast" type="text" class="comic-input" placeholder="เช่น สุขใจ" value="" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label id="lblPasswordField" class="block text-xs font-semibold text-[#d8d5f7]">รหัสผ่าน (Password)</label>
          <button type="button" id="btnResetSmPass" onclick="resetSmPasswordPrompt()" class="hidden text-[11px] font-bold text-[#ffb98a] underline">
            🔄 รีรหัสผ่าน SM
          </button>
        </div>
        <input id="inpPassword" type="password" class="comic-input" placeholder="กรอกรหัสผ่านของคุณ" value="" autocomplete="current-password" />
      </div>

      <p id="authHelperNote" class="text-[11px] text-[#c7c3ea] leading-relaxed">
        * ระบบจำรหัสพนักงานและซิงค์ข้อมูลข้ามเครื่อง (คอมฯ ↔ มือถือ) อัตโนมัติ
      </p>

      <div class="flex items-center justify-between gap-2 text-[11px] bg-[#262259] border border-[#4c4694] rounded-2xl px-3 py-2">
        <span class="text-[#c7c3ea] shrink-0">☁️ ฐานข้อมูลกลาง:</span>
        <span id="cloudSyncStatusText" class="text-[#36c78c] font-bold text-right">กำลังเชื่อมต่อฐานข้อมูลกลาง...</span>
      </div>

      <button type="button" id="btnAuthSubmit" onclick="handleLogin()" class="comic-btn w-full py-3.5 bg-[#ffb98a] text-[#1e1b4b] text-base mt-1">
        เข้าใช้งานระบบ
      </button>

      <button type="button" id="btnInstallAppLogin" onclick="triggerAppInstall()" class="comic-pill w-full py-2.5 bg-[#2c2866] text-white border-[#7a76a3] text-xs font-bold flex items-center justify-center gap-1.5">
        <span>📲 ติดตั้งแอป oto ลงเครื่อง (iOS / Android / คอมฯ)</span>
      </button>
    </div>
  </div>

  <!-- Top Header -->
  <header class="top-header" id="appHeader"></header>

  <!-- Main Content -->
  <main class="main-scroll" id="appMain"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="appNav"></nav>

  <!-- Day Entry Bottom Sheet -->
  <div class="sheet-backdrop" id="daySheet" onclick="if(event.target===this) closeDaySheet()">
    <div class="sheet-card" id="daySheetContent"></div>
  </div>

  <!-- Approval Detail Sheet -->
  <div class="sheet-backdrop" id="approvalSheet" onclick="if(event.target===this) closeApprovalDetail()">
    <div class="sheet-card" id="approvalSheetContent"></div>
  </div>

  <!-- Photo Lightbox -->
  <div class="sheet-backdrop" id="photoViewer" onclick="closePhotoViewer()" style="justify-content:center; padding:18px; z-index:65;">
    <div class="comic-card p-3 bg-white max-w-full" onclick="event.stopPropagation()">
      <img id="photoViewerImg" src="" class="w-full max-h-[65vh] object-contain rounded-2xl border-2 border-[#1e1b4b]" alt="หลักฐานเช็คเอาท์" />
      <div id="photoViewerMeta" class="mt-2 px-2 py-1.5 rounded-xl bg-[#f6f5ff] border border-[#1e1b4b] text-xs font-bold text-[#1e1b4b]"></div>
      <button type="button" onclick="closePhotoViewer()" class="comic-btn w-full py-2.5 bg-[#ffb98a] text-sm mt-2.5">ปิดรูปภาพ</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-pill" id="toastPill"></div>
</div>

<!-- Cross-Device Centralized Cloud Database Sync -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
  import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'oto-ot-leave-shared-v8';

  const DEFAULT_SHARED_BLOB_URL = 'https://api.jsonstorage.net/v1/json/4e9a7c2b-8f13-4d6e-9a21-7b3c5d8e0f12/oto-team-v8';
  const CUSTOM_DB_STORAGE_KEY = 'oto_central_blob_url_v8';
  const NTFY_TOPIC_URL = 'https://ntfy.sh/oto_team_sync_sm2080797_v8';

  let isSyncingNow = false;
  let lastCloudPushAt = 0;
  let activeCloudUrl = '';
  let lastSyncFingerprint = '';

  function resolveCloudUrl() {
    const custom = (localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim();
    if (custom && custom.startsWith('http')) {
      activeCloudUrl = custom;
      return custom;
    }
    activeCloudUrl = DEFAULT_SHARED_BLOB_URL;
    return DEFAULT_SHARED_BLOB_URL;
  }

  async function readFromNtfyRelay() {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3500);
      const res = await fetch(`${NTFY_TOPIC_URL}/json?poll=1&since=24h`, {
        method: 'GET',
        cache: 'no-store',
        signal: controller.signal
      });
      clearTimeout(timer);
      if (!res.ok) return null;
      const text = await res.text();
      if (!text.trim()) return { ok: true, data: null };
      const lines = text.trim().split('\n');
      let latestPayload = null;
      for (let i = lines.length - 1; i >= 0; i--) {
        try {
          const evt = JSON.parse(lines[i]);
          if (evt && evt.message) {
            const parsed = JSON.parse(evt.message);
            if (parsed && typeof parsed === 'object' && (parsed.accounts || parsed.requests || parsed.calendar)) {
              latestPayload = parsed;
              break;
            }
          }
        } catch (e) {}
      }
      return { ok: true, data: latestPayload };
    } catch (e) {
      return null;
    }
  }

  async function writeToNtfyRelay(payload) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3500);
      const res = await fetch(NTFY_TOPIC_URL, {
        method: 'POST',
        headers: { 'Title': 'oto_sync' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timer);
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  async function readCentralCloudState() {
    const targetUrl = resolveCloudUrl();
    const hasCustom = Boolean((localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim());

    if (hasCustom) {
      try {
        const res = await fetch(targetUrl, { method: 'GET', cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') return { ok: true, data };
        }
      } catch (e) {}
    }

    const ntfyRes = await readFromNtfyRelay();
    if (ntfyRes && ntfyRes.ok) {
      return { ok: true, data: ntfyRes.data || { accounts: {}, requests: [], calendar: [], tombstones: {} } };
    }

    return { ok: false, data: null };
  }

  async function writeCentralCloudState(payload) {
    const targetUrl = resolveCloudUrl();
    const hasCustom = Boolean((localStorage.getItem(CUSTOM_DB_STORAGE_KEY) || '').trim());
    const tasks = [];

    if (hasCustom) {
      tasks.push(
        fetch(targetUrl, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(r => r.ok).catch(() => false)
      );
    }

    tasks.push(writeToNtfyRelay(payload));
    const results = await Promise.all(tasks);
    return results.some(Boolean);
  }

  function compactImageForCloud(dataUrl, maxLen = 28000) {
    if (!dataUrl || typeof dataUrl !== 'string') return '';
    if (dataUrl.length <= maxLen) return dataUrl;
    return '';
  }

  function setCloudBadge(text, isOnline) {
    const el = document.getElementById('cloudSyncStatusText');
    if (el) {
      el.textContent = text;
      el.className = isOnline ? 'text-[#36c78c] font-bold text-right' : 'text-[#ffb98a] font-bold text-right';
    }
    const headerBadge = document.getElementById('headerCloudBadge');
    if (headerBadge) {
      headerBadge.textContent = isOnline ? '☁️ ออนไลน์ ✓' : '⚠️ ออฟไลน์';
      headerBadge.className = isOnline
        ? 'text-[10px] px-2.5 py-0.5 rounded-full bg-[#c6f3dc] border border-[#1e1b4b] font-bold text-[#1e1b4b]'
        : 'text-[10px] px-2.5 py-0.5 rounded-full bg-[#ffd6e0] border border-[#1e1b4b] font-bold text-[#1e1b4b]';
    }
  }

  let db = null;
  let firestoreReady = false;

  function safeFirestorePayload(obj) {
    const copy = { ...obj };
    if (copy.photo && copy.photo.length > 650000) copy.photo = '';
    if (copy.avatarPhoto && copy.avatarPhoto.length > 350000) copy.avatarPhoto = '';
    return copy;
  }

  window.cloudStore = {
    isReady: () => firestoreReady || Boolean(activeCloudUrl),
    getCloudUrl: () => resolveCloudUrl(),
    setCustomCloudUrl: async (newUrl) => {
      const clean = (newUrl || '').trim();
      if (clean && clean.startsWith('http')) {
        localStorage.setItem(CUSTOM_DB_STORAGE_KEY, clean);
      } else {
        localStorage.removeItem(CUSTOM_DB_STORAGE_KEY);
      }
      resolveCloudUrl();
      await window.cloudStore.pushFullSnapshot();
      await window.cloudStore.pullFromCloud(true);
    },

    buildLocalSnapshot: () => {
      const stateObj = window.getAppSyncSnapshot ? window.getAppSyncSnapshot() : {
        accounts: {},
        requests: [],
        calendar: [],
        tombstones: { accounts: [], requests: [], calendar: [] }
      };

      const compactAccounts = {};
      Object.entries(stateObj.accounts || {}).forEach(([k, acc]) => {
        if (!acc) return;
        compactAccounts[k] = {
          ...acc,
          avatarPhoto: compactImageForCloud(acc.avatarPhoto, 25000)
        };
      });

      const compactRequests = (stateObj.requests || []).map(r => ({
        ...r,
        photo: compactImageForCloud(r.photo, 28000)
      }));

      const compactCalendar = (stateObj.calendar || []).map(c => ({
        ...c,
        photo: compactImageForCloud(c.photo, 22000)
      }));

      return {
        updatedAt: Date.now(),
        accounts: compactAccounts,
        requests: compactRequests,
        calendar: compactCalendar,
        tombstones: stateObj.tombstones || { accounts: [], requests: [], calendar: [] }
      };
    },

    pushFullSnapshot: async () => {
      try {
        lastCloudPushAt = Date.now();
        const payload = window.cloudStore.buildLocalSnapshot();
        const ok = await writeCentralCloudState(payload);
        if (ok) {
          setCloudBadge('ออนไลน์ · ซิงค์ข้ามเครื่องแล้ว ✓', true);
        } else {
          setCloudBadge('ออฟไลน์ (ข้อมูลเก็บในเครื่อง)', false);
        }
        return ok;
      } catch (e) {
        setCloudBadge('ออฟไลน์ (ข้อมูลเก็บในเครื่อง)', false);
        return false;
      }
    },

    pullFromCloud: async (showNotification = false) => {
      if (isSyncingNow) return false;
      isSyncingNow = true;
      try {
        const res = await readCentralCloudState();
        if (!res.ok) {
          setCloudBadge('ออฟไลน์ (กำลังลองเชื่อมต่อใหม่...)', false);
          return false;
        }
        const remote = res.data || {};
        setCloudBadge('ออนไลน์ · ซิงค์ข้ามเครื่องแล้ว ✓', true);

        const remoteFp = JSON.stringify({
          a: Object.keys(remote.accounts || {}).sort(),
          r: (remote.requests || []).map(x => `${x.id}:${x.status}:${x.updatedAt || 0}`).sort(),
          c: (remote.calendar || []).map(x => `${x.empId || ''}:${x.dateKey}:${x.type}`).sort(),
          t: remote.tombstones || {}
        });

        let hadDiff = false;
        if (typeof window.mergeCloudSnapshot === 'function') {
          hadDiff = window.mergeCloudSnapshot(remote);
        }

        if (hadDiff && remoteFp !== lastSyncFingerprint) {
          lastSyncFingerprint = remoteFp;
          await window.cloudStore.pushFullSnapshot();
        } else {
          lastSyncFingerprint = remoteFp;
        }

        if (showNotification && typeof window.showToast === 'function') {
          window.showToast('☁️ ซิงค์ข้อมูลล่าสุดจากฐานข้อมูลกลางเรียบร้อย');
        }
        return true;
      } catch (e) {
        setCloudBadge('ออฟไลน์ (กำลังลองเชื่อมต่อใหม่...)', false);
        return false;
      } finally {
        isSyncingNow = false;
      }
    },

    saveAccount: async (acc) => {
      if (!acc || !acc.empId) return;
      if (firestoreReady && db) {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_accounts', acc.empId.toUpperCase()), safeFirestorePayload(acc));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    },

    deleteAccount: async (empId) => {
      if (!empId) return;
      if (firestoreReady && db) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_accounts', empId.toUpperCase()));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    },

    saveRequest: async (req) => {
      if (!req || !req.id) return;
      if (firestoreReady && db) {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_requests', req.id), safeFirestorePayload(req));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    },

    deleteRequest: async (reqId) => {
      if (!reqId) return;
      if (firestoreReady && db) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_requests', reqId));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    },

    saveCalendarItem: async (item) => {
      if (!item || !item.dateKey) return;
      const docId = `${(item.empId || 'EMP').toUpperCase()}_${item.dateKey}`;
      if (firestoreReady && db) {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_calendar', docId), safeFirestorePayload({ ...item, docId }));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    },

    deleteCalendarItem: async (empId, dateKey) => {
      if (!dateKey) return;
      const docId = `${(empId || 'EMP').toUpperCase()}_${dateKey}`;
      if (firestoreReady && db) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'oto_calendar', docId));
        } catch (e) {}
      }
      await window.cloudStore.pushFullSnapshot();
    }
  };

  async function initCloudDatabase() {
    await window.cloudStore.pullFromCloud(false);

    setInterval(() => {
      if (Date.now() - lastCloudPushAt > 1800) {
        window.cloudStore.pullFromCloud(false);
      }
    }, 2200);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        window.cloudStore.pullFromCloud(false);
      }
    });

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        firestoreReady = true;
        setCloudBadge('ออนไลน์ · ซิงค์ข้ามเครื่องแล้ว ✓', true);

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'oto_accounts'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          if (typeof window.syncAccountsFromCloud === 'function') window.syncAccountsFromCloud(list);
        });

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'oto_requests'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          if (typeof window.syncRequestsFromCloud === 'function') window.syncRequestsFromCloud(list);
        });

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'oto_calendar'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          if (typeof window.syncCalendarFromCloud === 'function') window.syncCalendarFromCloud(list);
        });
      } catch (err) {}
    }
  }

  initCloudDatabase();
</script>

<script>
  // =========================================================================
  // Application State & Thai Calendar / Cosmic Icons / Moods
  // =========================================================================
  const THAI_MONTHS = [
    'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
  ];
  const THAI_MONTHS_SHORT = [
    'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
    'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
  ];
  const THAI_DAYS_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  const THAI_DAYS_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

  const APPROVER_ID = 'SM2080797';
  const APPROVER_NAME = 'นาย ณัฐวุฒิ ชุมหิรัญ';
  const DEFAULT_APPROVER_PASS = '2080797';

  const MOODS = [
    { id: 'happy', label: 'สดใส', bg: '#FFE6D5', mouth: 'M24 38C27 42 37 42 40 38', blush: true },
    { id: 'calm', label: 'ชิลล์', bg: '#D9F0FF', mouth: 'M25 39H39', blush: true },
    { id: 'proud', label: 'ภูมิใจ', bg: '#C6F3DC', mouth: 'M23 36C26 43 38 43 41 36Z', blush: true },
    { id: 'tired', label: 'ล้าหน่อย', bg: '#E5E2FF', mouth: 'M25 41C28 38 36 38 39 41', blush: false },
    { id: 'fire', label: 'ลุยเต็มที่', bg: '#FFD6E0', mouth: 'M24 37C28 41 36 41 40 37', blush: true }
  ];

  const COSMIC_ICONS = [
    { id: 'planet', label: 'ดาวเสาร์', svg: '<circle cx="16" cy="16" r="7" fill="#FFB98A"/><ellipse cx="16" cy="16" rx="13" ry="4" transform="rotate(-22 16 16)" stroke="#ffffff" stroke-width="2" fill="none"/>' },
    { id: 'moon', label: 'พระจันทร์', svg: '<path d="M19 7C13.5 7 9 11.5 9 17C9 22.5 13.5 27 19 27C21.5 27 23.8 26.1 25.5 24.5C20.5 24.5 16.5 20.5 16.5 15.5C16.5 11.8 18.7 8.6 21.8 7.3C20.9 7.1 20 7 19 7Z" fill="#FFE082"/>' },
    { id: 'star', label: 'ดาววิ้ง', svg: '<polygon points="16,5 19.2,12.2 27,13 21.2,18.2 22.9,26 16,21.9 9.1,26 10.8,18.2 5,13 12.8,12.2" fill="#E5E2FF"/>' },
    { id: 'rocket', label: 'จรวด', svg: '<path d="M16 5C20 9 22 14 22 20H10C10 14 12 9 16 5Z" fill="#FF9EB5"/><circle cx="16" cy="14" r="2.5" fill="#1E1B4B"/><path d="M10 18L6 23H10V18ZM22 18L26 23H22V18Z" fill="#80DEEA"/>' },
    { id: 'cat', label: 'แมวอวกาศ', svg: '<circle cx="16" cy="18" r="8" fill="#D9F0FF"/><polygon points="9,13 11,6 15,11" fill="#D9F0FF"/><polygon points="23,13 21,6 17,11" fill="#D9F0FF"/><circle cx="13.5" cy="17" r="1.4" fill="#1E1B4B"/><circle cx="18.5" cy="17" r="1.4" fill="#1E1B4B"/>' }
  ];

  function renderMoodSvg(moodId, size = 34, avatarPhoto = '') {
    if (avatarPhoto && typeof avatarPhoto === 'string' && avatarPhoto.startsWith('data:image')) {
      return `<img src="${avatarPhoto}" alt="profile" style="width:${size}px;height:${size}px;" class="rounded-full object-cover border-2 border-[#1e1b4b] shrink-0 bg-white" />`;
    }
    const m = MOODS.find(x => x.id === moodId) || MOODS[0];
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" class="shrink-0">
        <circle cx="32" cy="32" r="28" fill="${m.bg}" stroke="#1E1B4B" stroke-width="3.5"/>
        <circle cx="23" cy="27" r="3" fill="#1E1B4B"/>
        <circle cx="41" cy="27" r="3" fill="#1E1B4B"/>
        ${m.blush ? '<circle cx="17" cy="33" r="3.2" fill="#FF9EB5" opacity="0.75"/><circle cx="47" cy="33" r="3.2" fill="#FF9EB5" opacity="0.75"/>' : ''}
        <path d="${m.mouth}" stroke="#1E1B4B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    `;
  }

  function renderCosmicSvg(iconId, size = 20) {
    const ic = COSMIC_ICONS.find(x => x.id === iconId) || COSMIC_ICONS[0];
    return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">${ic.svg}</svg>`;
  }

  // =========================================================================
  // Local Storage & Sync State Management
  // =========================================================================
  const LS_KEYS = {
    accounts: 'oto_accounts_v8',
    requests: 'oto_requests_v8',
    calendar: 'oto_calendar_v8',
    tombstones: 'oto_tombstones_v8',
    session: 'oto_session_v8',
    smPass: 'oto_sm_pass_v8'
  };

  function safeJsonParse(str, fallback) {
    try {
      const v = JSON.parse(str);
      return v !== null && v !== undefined ? v : fallback;
    } catch (e) {
      return fallback;
    }
  }

  let registeredAccounts = safeJsonParse(localStorage.getItem(LS_KEYS.accounts), {});
  let allCloudCalendarItems = safeJsonParse(localStorage.getItem(LS_KEYS.calendar), []);
  const savedTombstones = safeJsonParse(localStorage.getItem(LS_KEYS.tombstones), { accounts: [], requests: [], calendar: [] });
  let deletedAccountIds = new Set(savedTombstones.accounts || []);
  let deletedRequestIds = new Set(savedTombstones.requests || []);
  let deletedCalendarKeys = new Set(savedTombstones.calendar || []);

  const state = {
    user: safeJsonParse(localStorage.getItem(LS_KEYS.session), null),
    activeTab: 'cal',
    approvalSubTab: 'pending',
    viewYear: 2026,
    viewMonth: 10, // พฤศจิกายน 2569 (0-indexed: 10 = Nov)
    items: {},
    teamRequests: safeJsonParse(localStorage.getItem(LS_KEYS.requests), []),
    iconSeed: 0,
    confirmDeleteEmpId: null
  };

  // Init Thai current month/year if needed
  (function initCurrentThaiDate() {
    const now = new Date();
    if (now.getFullYear() >= 2025) {
      state.viewYear = now.getFullYear();
      state.viewMonth = now.getMonth();
    }
  })();

  function isManager() {
    return (state.user?.empId || '').trim().toUpperCase() === APPROVER_ID;
  }

  function getSmPassword() {
    return localStorage.getItem(LS_KEYS.smPass) || DEFAULT_APPROVER_PASS;
  }

  window.persistLocalDatabase = function () {
    try {
      localStorage.setItem(LS_KEYS.accounts, JSON.stringify(registeredAccounts));
      localStorage.setItem(LS_KEYS.requests, JSON.stringify(state.teamRequests));
      localStorage.setItem(LS_KEYS.calendar, JSON.stringify(allCloudCalendarItems));
      localStorage.setItem(LS_KEYS.tombstones, JSON.stringify({
        accounts: Array.from(deletedAccountIds),
        requests: Array.from(deletedRequestIds),
        calendar: Array.from(deletedCalendarKeys)
      }));
      if (state.user) {
        localStorage.setItem(LS_KEYS.session, JSON.stringify(state.user));
      } else {
        localStorage.removeItem(LS_KEYS.session);
      }
    } catch (e) {}
  };

  window.getAppSyncSnapshot = function () {
    return {
      accounts: registeredAccounts,
      requests: state.teamRequests,
      calendar: allCloudCalendarItems,
      tombstones: {
        accounts: Array.from(deletedAccountIds),
        requests: Array.from(deletedRequestIds),
        calendar: Array.from(deletedCalendarKeys)
      }
    };
  };

  window.mergeCloudSnapshot = function (remote) {
    if (!remote || typeof remote !== 'object') return false;
    let changed = false;

    const rTomb = remote.tombstones || {};
    (rTomb.accounts || []).forEach(id => {
      const up = String(id).trim().toUpperCase();
      if (up && !deletedAccountIds.has(up)) {
        deletedAccountIds.add(up);
        changed = true;
      }
    });
    (rTomb.requests || []).forEach(id => {
      if (id && !deletedRequestIds.has(id)) {
        deletedRequestIds.add(id);
        changed = true;
      }
    });
    (rTomb.calendar || []).forEach(k => {
      if (k && !deletedCalendarKeys.has(k)) {
        deletedCalendarKeys.add(k);
        changed = true;
      }
    });

    // Purge deleted accounts locally
    deletedAccountIds.forEach(delId => {
      if (registeredAccounts[delId]) {
        delete registeredAccounts[delId];
        changed = true;
      }
    });

    // Merge accounts
    Object.entries(remote.accounts || {}).forEach(([rawId, acc]) => {
      if (!acc) return;
      const empId = String(acc.empId || rawId).trim().toUpperCase();
      if (!empId || deletedAccountIds.has(empId)) return;
      const existing = registeredAccounts[empId];
      if (!existing || (acc.updatedAt || 0) > (existing.updatedAt || 0)) {
        registeredAccounts[empId] = {
          ...existing,
          ...acc,
          empId,
          avatarPhoto: acc.avatarPhoto || (existing && existing.avatarPhoto) || ''
        };
        changed = true;
      }
    });

    // Merge requests
    const reqMap = new Map();
    state.teamRequests.forEach(r => {
      const empUp = (r.empId || '').trim().toUpperCase();
      if (!deletedRequestIds.has(r.id) && !deletedAccountIds.has(empUp)) {
        reqMap.set(r.id, r);
      } else {
        changed = true;
      }
    });

    (remote.requests || []).forEach(r => {
      if (!r || !r.id) return;
      const empUp = (r.empId || '').trim().toUpperCase();
      if (deletedRequestIds.has(r.id) || deletedAccountIds.has(empUp)) return;
      const localReq = reqMap.get(r.id);
      if (!localReq || (r.updatedAt || 0) > (localReq.updatedAt || 0) || (localReq.status === 'submitted' && r.status !== 'submitted')) {
        reqMap.set(r.id, {
          ...localReq,
          ...r,
          photo: r.photo || (localReq && localReq.photo) || ''
        });
        changed = true;
      }
    });
    state.teamRequests = Array.from(reqMap.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    // Merge calendar items
    const calMap = new Map();
    allCloudCalendarItems.forEach(c => {
      const empUp = (c.empId || '').trim().toUpperCase();
      const key = `${empUp}_${c.dateKey}`;
      if (!deletedCalendarKeys.has(key) && !deletedAccountIds.has(empUp)) {
        calMap.set(key, c);
      } else {
        changed = true;
      }
    });

    (remote.calendar || []).forEach(c => {
      if (!c || !c.dateKey) return;
      const empUp = (c.empId || '').trim().toUpperCase();
      const key = `${empUp}_${c.dateKey}`;
      if (deletedCalendarKeys.has(key) || deletedAccountIds.has(empUp)) return;
      const localCal = calMap.get(key);
      if (!localCal || (c.updatedAt || 0) > (localCal.updatedAt || 0)) {
        calMap.set(key, {
          ...localCal,
          ...c,
          photo: c.photo || (localCal && localCal.photo) || ''
        });
        changed = true;
      }
    });
    allCloudCalendarItems = Array.from(calMap.values());

    if (changed) {
      window.persistLocalDatabase();
      rebuildVisibleCalendarItems();
      if (state.user) renderApp();
    } else {
      rebuildVisibleCalendarItems();
    }
    return changed;
  };

  window.syncAccountsFromCloud = (list) => {
    const map = {};
    (list || []).forEach(a => { if (a && a.empId) map[a.empId.toUpperCase()] = a; });
    window.mergeCloudSnapshot({ accounts: map });
  };
  window.syncRequestsFromCloud = (list) => {
    window.mergeCloudSnapshot({ requests: list || [] });
  };
  window.syncCalendarFromCloud = (list) => {
    window.mergeCloudSnapshot({ calendar: list || [] });
  };

  function calcHours(tIn, tOut) {
    if (!tIn || !tOut) return 0;
    const [h1, m1] = tIn.split(':').map(Number);
    const [h2, m2] = tOut.split(':').map(Number);
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 0) diff += 24 * 60;
    return Math.round((diff / 60) * 10) / 10;
  }

  function formatThaiShort(dateKey) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-').map(Number);
    return `${d} ${THAI_MONTHS_SHORT[m - 1]} ${y + 543}`;
  }

  function formatThaiFull(dateKey) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return `วัน${THAI_DAYS_FULL[dt.getDay()]}ที่ ${d} ${THAI_MONTHS[m - 1]} ${y + 543}`;
  }

  function rebuildVisibleCalendarItems() {
    const nextItems = {};
    const myId = (state.user?.empId || '').trim().toUpperCase();
    const manager = isManager();
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));
    let synthesizedCount = 0;

    allCloudCalendarItems.forEach((it) => {
      const itemEmp = (it.empId || '').trim().toUpperCase();
      if (itemEmp && itemEmp !== APPROVER_ID && activeIds.size > 0 && !activeIds.has(itemEmp)) return;
      if (manager || itemEmp === myId) {
        nextItems[it.dateKey] = it;
      }

      if (itemEmp && itemEmp !== APPROVER_ID) {
        const autoReqId = `auto-${itemEmp}-${it.dateKey}-${it.type || 'ot'}`;
        const alreadyExists = state.teamRequests.some(
          r => r.id === autoReqId || ((r.empId || '').trim().toUpperCase() === itemEmp && r.from === it.dateKey && r.type === (it.type || 'ot'))
        );
        if (!alreadyExists && !deletedRequestIds.has(autoReqId)) {
          const acc = registeredAccounts[itemEmp] || {};
          const isOt = (it.type || 'ot') === 'ot';
          state.teamRequests.unshift({
            id: autoReqId,
            firstName: acc.firstName || 'พนักงาน',
            lastName: acc.lastName || '',
            empId: itemEmp,
            approverId: APPROVER_ID,
            type: isOt ? 'ot' : 'leave',
            from: it.dateKey,
            to: it.to || it.dateKey,
            timeIn: it.timeIn || '18:00',
            timeOut: it.timeOut || '21:00',
            checkoutTime: it.checkoutTime || '',
            checkoutLocation: it.checkoutLocation || '',
            hours: isOt ? calcHours(it.timeIn || '18:00', it.timeOut || '21:00') : 0,
            note: it.note || (isOt ? 'ปฏิบัติงานล่วงเวลา (OT)' : 'ลาพักร้อน'),
            photo: it.photo || '',
            mood: it.mood || 'happy',
            updatedAt: Date.now(),
            status: 'submitted'
          });
          synthesizedCount += 1;
        }
      }
    });

    if (synthesizedCount > 0) {
      window.persistLocalDatabase();
    }
    state.items = nextItems;
  }

  // =========================================================================
  // Auth / Login / Registration
  // =========================================================================
  let authMode = 'login';

  function setAuthMode(mode) {
    authMode = mode;
    const btnLogin = document.getElementById('btnAuthLoginMode');
    const btnReg = document.getElementById('btnAuthRegisterMode');
    const nameGroup = document.getElementById('nameFieldsGroup');
    const submitBtn = document.getElementById('btnAuthSubmit');

    if (mode === 'login') {
      btnLogin.className = 'comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white';

  async function handleLogin() {
    const empId = (document.getElementById('inpEmpId').value || '').trim().toUpperCase();
    const pass = (document.getElementById('inpPassword').value || '').trim();
    const first = (document.getElementById('inpFirst').value || '').trim();
    const last = (document.getElementById('inpLast').value || '').trim();

    if (!empId) {
      showToast('กรุณากรอกรหัสพนักงาน');
      return;
    }

    // Pull latest accounts before validating
    if (window.cloudStore && window.cloudStore.pullFromCloud) {
      await window.cloudStore.pullFromCloud(false);
    }

    if (empId === APPROVER_ID) {
      const validSmPass = getSmPassword();
      if (pass !== validSmPass && pass !== DEFAULT_APPROVER_PASS && pass !== APPROVER_ID) {
        showToast('รหัสผ่าน SM ไม่ถูกต้อง (กดปุ่ม 🔄 รีรหัสผ่าน SM ด้านบนได้)');
        return;
      }
      const existingSm = registeredAccounts[APPROVER_ID] || {};
      state.user = {
        empId: APPROVER_ID,
        firstName: 'นาย ณัฐวุฒิ',
        lastName: 'ชุมหิรัญ',
        mood: existingSm.mood || 'happy',
        avatarPhoto: existingSm.avatarPhoto || ''
      };
      window.persistLocalDatabase();
      enterAuthenticatedApp();
      return;
    }

    if (authMode === 'register') {
      if (!first) {
        showToast('กรุณากรอกชื่อพนักงาน');
        return;
      }
      if (!pass) {
        showToast('กรุณาตั้งรหัสผ่าน');
        return;
      }
      if (deletedAccountIds.has(empId)) {
        deletedAccountIds.delete(empId);
      }
      const acc = {
        empId,
        firstName: first,
        lastName: last,
        password: pass,
        mood: 'happy',
        avatarPhoto: '',
        updatedAt: Date.now()
      };
      registeredAccounts[empId] = acc;
      state.user = { ...acc };
      window.persistLocalDatabase();
      if (window.cloudStore) await window.cloudStore.saveAccount(acc);
      showToast(`✨ สร้างรหัส ${empId} สำเร็จ!`);
      enterAuthenticatedApp();
      return;
    }

    // Login mode for employees
    const acc = registeredAccounts[empId];
    if (!acc) {
      showToast('ไม่พบรหัสพนักงานนี้ กดปุ่ม "✨ สร้างรหัสพนักงาน" ด้านบนเพื่อลงทะเบียน');
      return;
    }
    if (acc.password && pass !== acc.password) {
      showToast('รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');
      return;
    }

    state.user = { ...acc };
    window.persistLocalDatabase();
    enterAuthenticatedApp();
  }

  function getLeaveDateMap() {
    const map = {};
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));

    const addRange = (fromStr, toStr, info) => {
      if (!fromStr) return;
      const start = new Date(fromStr + 'T00:00:00');
      const end = new Date((toStr || fromStr) + 'T00:00:00');
      if (isNaN(start.getTime())) return;
      const cur = new Date(start);
      let guard = 0;
      while (cur <= end && guard < 60) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const d = String(cur.getDate()).padStart(2, '0');
        map[`${y}-${m}-${d}`] = info;
        cur.setDate(cur.getDate() + 1);
        guard++;
      }
    };

    const myId = (state.user?.empId || '').trim().toUpperCase();
    const manager = isManager();

    state.teamRequests.forEach(r => {
      if (r.type !== 'leave' || r.status === 'rejected') return;
      const empUp = (r.empId || '').trim().toUpperCase();
      if (activeIds.size > 0 && !activeIds.has(empUp)) return;
      if (manager || empUp === myId) {
        addRange(r.from, r.to, { empId: empUp, firstName: r.firstName, mood: r.mood || 'calm' });
      }
    });

    Object.values(state.items).forEach(it => {
      if (it.type === 'leave') {
        const empUp = (it.empId || '').trim().toUpperCase();
        if (activeIds.size > 0 && empUp && !activeIds.has(empUp)) return;
        addRange(it.dateKey, it.to || it.dateKey, { empId: empUp, mood: it.mood || 'calm' });
      }
    });

    return map;
  }

  function renderCalendarTab() {
    const year = state.viewYear;
    const month = state.viewMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const leaveMap = getLeaveDateMap();

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    let totalOtHours = 0;
    let totalLeaveDays = 0;
    const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;

    Object.values(state.items).forEach(it => {
      if (it.dateKey && it.dateKey.startsWith(monthPrefix) && it.type === 'ot') {
        totalOtHours += calcHours(it.timeIn, it.timeOut);
      }
    });
    Object.keys(leaveMap).forEach(dk => {
      if (dk.startsWith(monthPrefix)) totalLeaveDays += 1;
    });

    const cells = [];
    for (let i = firstDay - 1; i >= 0; i--) {
      cells.push(`<div class="day-cell other-month"><span class="text-xs font-bold">${prevDays - i}</span></div>`);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const item = state.items[dateKey];
      const leaveInfo = leaveMap[dateKey];
      const isToday = dateKey === todayKey;

      let extraClass = '';
      let middleContent = '';
      let bottomBadge = '';

      const iconIdx = (d + state.iconSeed) % COSMIC_ICONS.length;
      const iconId = (item && item.icon) || COSMIC_ICONS[iconIdx].id;

      if (leaveInfo) {
        extraClass = 'has-leave';
        middleContent = `<div class="w-6 h-6 rounded-lg bg-[#1e1b4b] flex items-center justify-center">${renderCosmicSvg(iconId, 16)}</div>`;
        bottomBadge = `<span class="day-badge-leave text-[8px] leading-tight font-bold px-1 py-0.2 rounded border">ลาพักร้อน</span>`;
      } else if (item && item.type === 'ot') {
        extraClass = 'has-ot';
        const hrs = calcHours(item.timeIn, item.timeOut);
        middleContent = `<div class="w-6 h-6 rounded-lg bg-[#1e1b4b] flex items-center justify-center">${renderCosmicSvg(iconId, 16)}</div>`;
        bottomBadge = `<span class="text-[9px] font-bold px-1.5 rounded-full bg-white border border-[#1e1b4b] text-[#1e1b4b]">+${hrs}ชม.</span>`;
      }

      cells.push(`
        <div class="day-cell ${isToday ? 'is-today' : ''} ${extraClass}" onclick="openDaySheet('${dateKey}')">
          <span class="day-num text-xs font-bold text-[#1e1b4b]">${d}</span>
          ${middleContent}
          ${bottomBadge}
        </div>
      `);
    }

    const totalSlots = Math.ceil(cells.length / 7) * 7;
    let nextDay = 1;
    while (cells.length < totalSlots) {
      cells.push(`<div class="day-cell other-month"><span class="text-xs font-bold">${nextDay++}</span></div>`);
    }

    return `
      <div class="comic-card p-3.5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-[#1e1b4b]">${THAI_MONTHS[month]} ${year + 543}</h2>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="shuffleIcons()" class="comic-pill px-2.5 py-1 text-[11px] bg-white">🎲 สุ่มไอคอน</button>
            <button type="button" onclick="changeMonth(-1)" class="w-7 h-7 rounded-full border-2 border-[#1e1b4b] bg-white font-bold text-xs flex items-center justify-center">‹</button>
            <button type="button" onclick="changeMonth(1)" class="w-7 h-7 rounded-full border-2 border-[#1e1b4b] bg-white font-bold text-xs flex items-center justify-center">›</button>
          </div>
        </div>

        <div class="grid grid-cols-7 text-center text-[11px] font-bold text-[#7a76a3] mb-1.5">
          ${THAI_DAYS_SHORT.map(d => `<div>${d}</div>`).join('')}
        </div>

        <div class="grid grid-cols-7 gap-1.5">
          ${cells.join('')}
        </div>

        <div class="mt-3 pt-2.5 border-t border-dashed border-[#c7c3ea] flex items-center justify-between text-xs font-bold">
          <div class="flex items-center gap-3">
            <span>⚡ OT รวม: <span class="text-[#4f46e5]">${Math.round(totalOtHours * 10) / 10} ชม.</span></span>
            <span>🌴 ลาพักร้อน: <span class="text-[#0d9488]">${totalLeaveDays} วัน</span></span>
          </div>
          ${isManager()
            ? `<span class="px-2.5 py-1 rounded-full bg-[#ffe6d3] border border-[#1e1b4b] text-[10px]">🔒 SM ดูอย่างเดียว</span>`
            : `<button type="button" onclick="goToday()" class="comic-pill px-3 py-1 text-[11px] bg-white">วันนี้</button>`
          }
        </div>
      </div>

      ${isManager() ? `
        <div class="comic-card p-3 mt-3 bg-[#f0efff] text-center text-xs font-semibold text-[#1e1b4b]">
          🛡️ สิทธิ์ผู้อนุมัติ <b>SM2080797</b> ไม่สามารถบันทึกหรือแก้ไขเวลาของใครได้ · ไปที่แท็บ <b>อนุมัติ</b> เพื่อตรวจสอบคำขอ
        </div>

  }

  async function fetchCurrentGpsLocation() {
    const locEl = document.getElementById('gpsStatusLabel');
    if (locEl) locEl.textContent = 'กำลังดึงพิกัด GPS...';

    if (!navigator.geolocation) {
      currentCheckoutLocation = 'ไม่รองรับ GPS บนอุปกรณ์นี้';
      if (locEl) locEl.textContent = currentCheckoutLocation;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude.toFixed(5);
        const lon = pos.coords.longitude.toFixed(5);
        currentCheckoutLocation = `พิกัด ${lat}, ${lon}`;
        try {
          const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=th`);
          if (resp.ok) {
            const geo = await resp.json();
            if (geo && geo.display_name) {
              const parts = geo.display_name.split(',').slice(0, 3).join(' ');
              currentCheckoutLocation = parts.trim();
            }
          }
        } catch (e) {}
        if (locEl) locEl.textContent = `📍 ${currentCheckoutLocation}`;
      },
      () => {
        currentCheckoutLocation = 'ไม่สามารถเข้าถึง GPS (กรุณาเปิดสิทธิ์ตำแหน่ง)';
        if (locEl) locEl.textContent = currentCheckoutLocation;
      },
      { enableHighAccuracy: true, timeout: 7000 }
    );
  }

  async function startLiveCamera(facing) {
    cameraFacingMode = facing || 'environment';
    await fetchCurrentGpsLocation();
    try {
      stopLiveCamera();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: cameraFacingMode },
        audio: false
      });
      activeCameraStream = stream;
      const camBox = document.getElementById('liveCameraContainer');
      const videoEl = document.getElementById('liveCameraVideo');
      if (camBox && videoEl) {
        camBox.classList.remove('hidden');
        videoEl.srcObject = stream;
      }
    } catch (err) {
      showToast('ไม่สามารถเปิดกล้องสดได้ กรุณากดเลือกรูปจากอัลบั้มด้านล่าง');
    }
  }

  function switchCameraFacing() {
    const nextFacing = cameraFacingMode === 'environment' ? 'user' : 'environment';
    startLiveCamera(nextFacing);
  }

  function stampWatermarkOnCanvas(sourceEl, width, height) {
    const canvas = document.createElement('canvas');
    const maxW = 720;
    const scale = width > maxW ? maxW / width : 1;
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(sourceEl, 0, 0, canvas.width, canvas.height);

    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const th = new Date(utc + 7 * 3600000);
    const timeStr = `${String(th.getHours()).padStart(2, '0')}:${String(th.getMinutes()).padStart(2, '0')}`;
    currentCheckoutTime = timeStr;
    const locStr = currentCheckoutLocation || 'ยืนยันพิกัด GPS แล้ว';

    const pad = 12;
    const boxH = 68;
    const y0 = canvas.height - boxH - pad;
    ctx.fillStyle = 'rgba(20, 18, 52, 0.82)';
    ctx.beginPath();
    ctx.roundRect(pad, y0, canvas.width - pad * 2, boxH, 12);
    ctx.fill();

    ctx.fillStyle = '#FFB98A';
    ctx.font = 'bold 16px Kanit, sans-serif';
    ctx.fillText(`เช็คเอาท์ ${timeStr} น. · ${formatThaiShort(editingDateKey)}`, pad + 12, y0 + 24);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '13px Anuphan, sans-serif';
    ctx.fillText(`📍 ${locStr.slice(0, 48)}`, pad + 12, y0 + 46);

    ctx.fillStyle = '#36C78C';
    ctx.font = 'bold 11px Anuphan, sans-serif';
    ctx.fillText('✓ oto GPS & Time Verified', pad + 12, y0 + 62);

    return canvas.toDataURL('image/jpeg', 0.72);
  }

  function captureLivePhoto() {
    const videoEl = document.getElementById('liveCameraVideo');
    if (!videoEl || !videoEl.videoWidth) return;
    currentPhoto = stampWatermarkOnCanvas(videoEl, videoEl.videoWidth, videoEl.videoHeight);
    stopLiveCamera();
    renderDaySheet();
  }

  function handleFilePhotoUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        currentPhoto = stampWatermarkOnCanvas(img, img.width, img.height);
        event.target.value = '';
        renderDaySheet();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearCheckoutPhoto() {
    currentPhoto = '';
    currentCheckoutTime = '';
    const fileInput = document.getElementById('inpFilePhoto');
    if (fileInput) fileInput.value = '';
    renderDaySheet();
  }

  async function saveCurrentEntry() {
    if (!state.user || isManager()) return;
    const empId = state.user.empId.trim().toUpperCase();
    const note = (document.getElementById('inpNote')?.value || '').trim();

    if (editingType === 'ot') {
      const timeIn = document.getElementById('inpTimeIn')?.value || '18:00';
      const timeOut = document.getElementById('inpTimeOut')?.value || '21:00';
      const hours = calcHours(timeIn, timeOut);

      const calItem = {
        dateKey: editingDateKey,
        empId,
        type: 'ot',
        timeIn,
        timeOut,
        note: note || 'ปฏิบัติงานล่วงเวลา (OT)',
        mood: editingMood,
        photo: currentPhoto,
        checkoutTime: currentCheckoutTime,
        checkoutLocation: currentCheckoutLocation,
        updatedAt: Date.now()
      };

      const reqObj = {
        id: `req-${empId}-${editingDateKey}-ot-${Date.now()}`,
        firstName: state.user.firstName,
        lastName: state.user.lastName,
        empId,
        approverId: APPROVER_ID,
        type: 'ot',
        from: editingDateKey,
        to: editingDateKey,
        timeIn,
        timeOut,
        hours,
        note: note || 'ปฏิบัติงานล่วงเวลา (OT)',
        mood: editingMood,
        photo: currentPhoto,
        checkoutTime: currentCheckoutTime,
        checkoutLocation: currentCheckoutLocation,
        updatedAt: Date.now(),
        status: 'submitted'
      };

      allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empId && c.dateKey === editingDateKey));
      allCloudCalendarItems.push(calItem);
      state.teamRequests.unshift(reqObj);

      window.persistLocalDatabase();
      rebuildVisibleCalendarItems();
      closeDaySheet();
      renderApp();
      showToast(`ส่งคำขอทำโอที +${hours} ชม. ไปที่ SM2080797 แล้ว`);

      if (window.cloudStore) {
        await window.cloudStore.saveCalendarItem(calItem);
        await window.cloudStore.saveRequest(reqObj);
      }
    } else {
      const from = document.getElementById('inpLeaveFrom')?.value || editingDateKey;
      const to = document.getElementById('inpLeaveTo')?.value || from;

      const calItem = {
        dateKey: from,
        to,
        empId,
        type: 'leave',
        note: note || 'ลาพักร้อน',
        mood: editingMood,
        updatedAt: Date.now()
      };

      const reqObj = {
        id: `req-${empId}-${from}-leave-${Date.now()}`,
        firstName: state.user.firstName,
        lastName: state.user.lastName,
        empId,
        approverId: APPROVER_ID,
        type: 'leave',
        from,
        to,
        hours: 0,
        note: note || 'ลาพักร้อน',
        mood: editingMood,
        updatedAt: Date.now(),
        status: 'submitted'
      };

      allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empId && c.dateKey === from));
      allCloudCalendarItems.push(calItem);
      state.teamRequests.unshift(reqObj);

      window.persistLocalDatabase();
      rebuildVisibleCalendarItems();
      closeDaySheet();
      renderApp();
      showToast(`ส่งคำขอลาพักร้อน (${formatThaiShort(from)} – ${formatThaiShort(to)}) ไปที่ SM2080797 แล้ว`);

      if (window.cloudStore) {
        await window.cloudStore.saveCalendarItem(calItem);
        await window.cloudStore.saveRequest(reqObj);
      }
    }
  }

    `;
  }

  function exportTeamExcel() {
    let csv = '\uFEFFรหัสพนักงาน,ชื่อ-นามสกุล,ประเภท,วันที่เริ่ม,ถึงวันที่,เวลาเริ่ม,เวลาเลิก,ชั่วโมง OT,หมายเหตุ,สถานะ\n';
    state.teamRequests.forEach(r => {
      const statusText = r.status === 'approved' ? 'อนุมัติแล้ว' : r.status === 'rejected' ? 'ไม่อนุมัติ' : 'รออนุมัติ';
      csv += `"${r.empId}","${r.firstName} ${r.lastName || ''}","${r.type === 'ot' ? 'OT' : 'ลาพักร้อน'}","${r.from}","${r.to || r.from}","${r.timeIn || '-'}","${r.timeOut || '-'}","${r.hours || 0}","${(r.note || '').replace(/"/g, '""')}","${statusText}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `oto-report-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 ดาวน์โหลดไฟล์รายงาน Excel เรียบร้อย');
  }

  // Approval Queue & Details (SM2080797)

  function openApprovalDetail(reqId) {
    const r = state.teamRequests.find(x => x.id === reqId);
    if (!r) return;
    const sheet = document.getElementById('approvalSheetContent');
    sheet.innerHTML = `
      <div class="w-10 h-1.5 rounded-full bg-[#c7c3ea] mx-auto mb-3"></div>
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="text-base font-bold">รายละเอียดคำขอ — ${r.firstName} ${r.lastName || ''}</h3>
          <p class="text-xs text-[#7a76a3]">รหัสพนักงาน: ${r.empId}</p>
        </div>
        <button type="button" onclick="closeApprovalDetail()" class="w-8 h-8 rounded-full border-2 border-[#1e1b4b] bg-white font-bold">✕</button>
      </div>

      <div class="comic-card p-3.5 bg-white space-y-1.5 text-xs mb-3">
        <div><b>ประเภท:</b> ${r.type === 'ot' ? `ขอทำโอที (+${r.hours} ชม.)` : 'ขอลาพักร้อน'}</div>
        <div><b>วันที่:</b> ${r.type === 'ot' ? formatThaiFull(r.from) : `${formatThaiShort(r.from)} – ${formatThaiShort(r.to)}`}</div>
        ${r.type === 'ot' ? `<div><b>เวลา:</b> ${r.timeIn} – ${r.timeOut} น.</div>` : ''}
        <div><b>รายละเอียด:</b> ${r.note || '-'}</div>
        ${r.photo ? `
          <div class="pt-2">
            <img src="${r.photo}" onclick="openPhotoViewer('${r.id}')" class="w-full max-h-64 object-cover rounded-2xl border-2 border-[#1e1b4b] cursor-pointer" alt="หลักฐาน" />
            <div class="text-[11px] text-[#7a76a3] mt-1.5">🕒 ${r.checkoutTime || '-'} น. · 📍 ${r.checkoutLocation || 'GPS Verified'}</div>
          </div>
        ` : ''}
      </div>

      ${r.status === 'submitted' ? `
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="decideRequest('${r.id}', 'rejected'); closeApprovalDetail();" class="comic-btn py-3 bg-[#ffd6e0] text-sm">✕ ไม่อนุมัติ</button>
          <button type="button" onclick="decideRequest('${r.id}', 'approved'); closeApprovalDetail();" class="comic-btn py-3 bg-[#c6f3dc] text-sm">✓ อนุมัติคำขอ</button>

    `;
    document.getElementById('approvalSheet').classList.add('open');

  function closeApprovalDetail() {
    document.getElementById('approvalSheet').classList.remove('open');
  }

  function openPhotoViewer(reqId) {
    const r = state.teamRequests.find(x => x.id === reqId);
    if (!r || !r.photo) return;
    document.getElementById('photoViewerImg').src = r.photo;
    document.getElementById('photoViewerMeta').textContent = `${r.firstName} (${r.empId}) · เช็คเอาท์ ${r.checkoutTime || '-'} น. · ${r.checkoutLocation || ''}`;
    document.getElementById('photoViewer').classList.add('open');
  }

  function closePhotoViewer() {
    document.getElementById('photoViewer').classList.remove('open');
  }

  async function decideRequest(reqId, decision) {
    const idx = state.teamRequests.findIndex(r => r.id === reqId);
    if (idx === -1) return;
    state.teamRequests[idx].status = decision;
    state.teamRequests[idx].updatedAt = Date.now();
    const updatedReq = state.teamRequests[idx];

    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast(decision === 'approved' ? '✓ อนุมัติคำขอเรียบร้อยแล้ว' : '✕ บันทึกไม่อนุมัติคำขอแล้ว');

    if (window.cloudStore) {
      await window.cloudStore.saveRequest(updatedReq);
    }
  }

  async function deleteTeamRequest(reqId) {
    const target = state.teamRequests.find(r => r.id === reqId);
    if (!target) return;
    deletedRequestIds.add(reqId);
    state.teamRequests = state.teamRequests.filter(r => r.id !== reqId);

    const empUp = (target.empId || '').trim().toUpperCase();
    const calKey = `${empUp}_${target.from}`;
    deletedCalendarKeys.add(calKey);
    allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empUp && c.dateKey === target.from));

    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast('🗑️ ลบรายการคำขอและข้อมูลบนปฏิทินเรียบร้อย');

    if (window.cloudStore) {
      await window.cloudStore.deleteRequest(reqId);
      await window.cloudStore.deleteCalendarItem(empUp, target.from);
    }
  }

  // =========================================================================
  // Profile, Avatar Photo Editor, Employee Account Deletion & Cloud Config
  // =========================================================================
  function renderProfileTab() {
    const manager = isManager();
    const empList = Object.values(registeredAccounts).filter(a => (a.empId || '').toUpperCase() !== APPROVER_ID);

    return `
      <div class="comic-card p-4 text-center mb-3">
        <div class="relative inline-block">
          ${renderMoodSvg(state.user.mood, 76, state.user.avatarPhoto)}
          <label class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#ffb98a] border-2 border-[#1e1b4b] flex items-center justify-center text-xs cursor-pointer shadow">
            ✏️
            <input type="file" accept="image/*" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
        </div>

        <h2 class="text-base font-bold mt-2">${state.user.firstName} ${state.user.lastName || ''}</h2>
        <p class="text-xs text-[#7a76a3]">รหัส: <b>${state.user.empId}</b> ${manager ? '(ผู้อนุมัติหลัก)' : ''}</p>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <label class="comic-pill py-2 text-xs bg-[#d9f0ff] cursor-pointer flex items-center justify-center gap-1">
            <span>📷 ถ่ายรูปโปรไฟล์</span>
            <input type="file" accept="image/*" capture="user" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
          <label class="comic-pill py-2 text-xs bg-[#e5e2ff] cursor-pointer flex items-center justify-center gap-1">
            <span>🖼️ เลือกจากอัลบั้ม</span>
            <input type="file" accept="image/*" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
        </div>

        ${state.user.avatarPhoto ? `
          <button type="button" onclick="removeProfileAvatar()" class="mt-2 text-[11px] font-bold text-[#e11d48] underline">ลบรูปโปรไฟล์ (กลับไปใช้ไอคอนอารมณ์)</button>
        ` : ''}
      </div>

      <div class="comic-card p-3.5 mb-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold">☁️ การซิงค์ฐานข้อมูลกลางข้ามเครื่อง</h3>
          <button type="button" onclick="window.cloudStore && window.cloudStore.pullFromCloud(true)" class="comic-pill px-3 py-1 text-[11px] bg-[#c6f3dc]">🔄 ซิงค์ขึ้น-ลงเดี๋ยวนี้</button>
        </div>
        <p class="text-[11px] text-[#7a76a3]">ระบบซิงค์ข้อมูลบัญชี คำขอ OT และวันลาพักร้อนระหว่างคอมพิวเตอร์และโทรศัพท์มือถืออัตโนมัติทุก 2 วินาที</p>
      </div>

      ${manager ? `
        <div class="comic-card p-3.5 mb-3">
          <div class="flex items-center justify-between mb-2.5">
            <h3 class="text-sm font-bold">👥 จัดการบัญชีพนักงานในระบบ (${empList.length} คน)</h3>
          </div>
          ${empList.length === 0 ? `
            <p class="text-xs text-[#7a76a3] text-center py-3">ยังไม่มีบัญชีพนักงานที่ลงทะเบียน</p>
          ` : `
            <div class="space-y-2">
              ${empList.map(emp => {
                const id = emp.empId.toUpperCase();
                const isConfirming = state.confirmDeleteEmpId === id;
                return `
                  <div class="p-2.5 rounded-2xl border-2 border-[#1e1b4b] bg-[#f6f5ff] flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      ${renderMoodSvg(emp.mood || 'happy', 34, emp.avatarPhoto)}
                      <div class="min-w-0">
                        <div class="text-xs font-bold truncate">${emp.firstName} ${emp.lastName || ''}</div>
                        <div class="text-[10px] text-[#7a76a3]">รหัส: <b>${id}</b></div>
                      </div>
                    </div>
                    ${isConfirming ? `
                      <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="deleteEmployeeAccount('${id}')" class="px-2.5 py-1 rounded-full bg-[#ff4d8d] text-white border border-[#1e1b4b] text-[10px] font-bold">ยืนยันลบ</button>
                        <button type="button" onclick="state.confirmDeleteEmpId=null; renderApp();" class="px-2 py-1 rounded-full bg-white border border-[#1e1b4b] text-[10px] font-bold">ยกเลิก</button>
                      </div>
                    ` : `
                      <button type="button" onclick="state.confirmDeleteEmpId='${id}'; renderApp();" class="comic-pill px-3 py-1 text-[11px] bg-[#ffd6e0] shrink-0">🗑️ ลบบัญชี</button>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      ` : ''}

      <button type="button" onclick="logoutUser()" class="comic-btn w-full py-3 bg-[#ffd6e0] text-[#1e1b4b] text-sm">
        ออกจากระบบ / สลับรหัสพนักงาน
      </button>
    `;
  }

  function handleProfileAvatarUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file || !state.user) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const size = 240;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const avatarData = canvas.toDataURL('image/jpeg', 0.78);

        state.user.avatarPhoto = avatarData;
        const id = state.user.empId.toUpperCase();
        registeredAccounts[id] = {
          ...(registeredAccounts[id] || state.user),
          empId: id,
          avatarPhoto: avatarData,
          updatedAt: Date.now()
        };
        window.persistLocalDatabase();
        renderApp();
        showToast('✨ อัปเดตรูปโปรไฟล์เรียบร้อยแล้ว');
        if (window.cloudStore) await window.cloudStore.saveAccount(registeredAccounts[id]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function removeProfileAvatar() {
    if (!state.user) return;
    state.user.avatarPhoto = '';
    const id = state.user.empId.toUpperCase();
    if (registeredAccounts[id]) {
      registeredAccounts[id].avatarPhoto = '';
      registeredAccounts[id].updatedAt = Date.now();
    }
    window.persistLocalDatabase();
    renderApp();
    showToast('ลบรูปโปรไฟล์แล้ว');
    if (window.cloudStore && registeredAccounts[id]) {
      await window.cloudStore.saveAccount(registeredAccounts[id]);
    }
  }

  async function deleteEmployeeAccount(empId) {
    const targetId = (empId || '').trim().toUpperCase();
    if (!targetId || targetId === APPROVER_ID) return;

    deletedAccountIds.add(targetId);
    delete registeredAccounts[targetId];

    // ลบคำขอ OT และวันลาพักร้อนทั้งหมดของบัญชีนี้
    state.teamRequests.forEach(r => {
      if ((r.empId || '').trim().toUpperCase() === targetId) {
        deletedRequestIds.add(r.id);
      }
    });
    state.teamRequests = state.teamRequests.filter(r => (r.empId || '').trim().toUpperCase() !== targetId);

    // ลบรายการบนปฏิทินทั้งหมดของบัญชีนี้
    allCloudCalendarItems.forEach(c => {
      if ((c.empId || '').trim().toUpperCase() === targetId) {
        deletedCalendarKeys.add(`${targetId}_${c.dateKey}`);
      }
    });
    allCloudCalendarItems = allCloudCalendarItems.filter(c => (c.empId || '').trim().toUpperCase() !== targetId);

    state.confirmDeleteEmpId = null;
    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast(`🗑️ ลบบัญชี ${targetId} และลบรายการ OT/ลาพักร้อนทั้งหมดแล้ว`);

    if (window.cloudStore) {
      await window.cloudStore.deleteAccount(targetId);
    }
  }

  // =========================================================================
  // Toast, PWA Install & Main Render Loop
  // =========================================================================
  let toastTimer = null;
  function showToast(msg) {
    const pill = document.getElementById('toastPill');
    if (!pill) return;
    pill.textContent = msg;
    pill.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => pill.classList.remove('show'), 2800);
  }
  window.showToast = showToast;

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function triggerAppInstall() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt = null;
      return;
    }
    showToast('เปิดใน Safari / Chrome แล้วกด "แชร์ → เพิ่มไปยังหน้าจอโฮม" เพื่อติดตั้งแอป');
  }

  function renderApp() {
    const activeEl = document.activeElement;
    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
      return;
    }
    if (!state.user) return;
    renderHeader();
    renderNav();
    const main = document.getElementById('appMain');
    if (state.activeTab === 'cal') main.innerHTML = renderCalendarTab();
    else if (state.activeTab === 'sum') main.innerHTML = renderSummaryTab();
    else if (state.activeTab === 'app' && isManager()) main.innerHTML = renderApprovalTab();
    else main.innerHTML = renderProfileTab();
  }

  setInterval(() => {
    const clockEl = document.getElementById('liveThaiClock');
    if (clockEl) clockEl.textContent = getThaiTimeStr();
  }, 1000);

  // Resume session if already logged in
  if (state.user && state.user.empId) {
    document.getElementById('loginScreen').classList.add('hidden');
    rebuildVisibleCalendarItems();
    renderApp();
  }
</script>
