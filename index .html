  let _exceljsPromise = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (_exceljsPromise) return _exceljsPromise;
    _exceljsPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = () => (window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS missing')));
      s.onerror = () => { _exceljsPromise = null; reject(new Error('ExcelJS load failed')); };
      document.head.appendChild(s);
    });
    return _exceljsPromise;
  }

  function dkToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function dkToUtc(k) { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function fmtThaiDate(dt) { return `${dt.getDate()} ${THAI_MONTHS_SHORT[dt.getMonth()]} ${dt.getFullYear() + 543}`; }
  function isoWeekInfo(dk) {
    const d = dkToDate(dk);
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const thu = new Date(mon); thu.setDate(mon.getDate() + 3);
    const isoYear = thu.getFullYear();
    const jan4 = new Date(isoYear, 0, 4);
    const w1 = new Date(jan4); w1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
    const week = Math.round((mon - w1) / (7 * 86400000)) + 1;
    return { key: `${isoYear}-W${String(week).padStart(2, '0')}`, isoYear, week, mon, sun };
  }

  function buildOtWorkbook(ExcelJS) {
    const FONT = 'Tahoma';
    const C = { ink: 'FF1E1B4B', accent: 'FF5B4CE6', peach: 'FFFFE6D3', mint: 'FFC6F3DC', lav: 'FFE5E2FF', rose: 'FFFFD6E0', paper: 'FFF6F5FF', white: 'FFFFFFFF', muted: 'FF7A76A3', orange: 'FFFF8A4C', grey: 'FF9E9BC2' };
    const thin = { style: 'thin', color: { argb: 'FFC7C3EA' } };
    const border = { top: thin, left: thin, bottom: thin, right: thin };
    const solid = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
    const r2 = (n) => Math.round(n * 100) / 100;
    const empOf = (r) => (r.empId || '').trim().toUpperCase();
    const nameOf = (r) => `${r.firstName || ''} ${r.lastName || ''}`.trim() || empOf(r);
    const bar = (v, max) => (max > 0 && v > 0 ? '█'.repeat(Math.max(1, Math.round((v / max) * 18))) : '');
    const NUM = '#,##0.0#', NUM_DASH = '#,##0.0#;-#,##0.0#;"-"';

    const wb = new ExcelJS.Workbook();
    wb.creator = 'oto';
    wb.created = new Date();

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const todayMonth = todayKey.slice(0, 7), todayYear = todayKey.slice(0, 4), todayWeek = isoWeekInfo(todayKey).key;

    // ----- ข้อมูลตั้งต้น: OT ที่ไม่ถูกปฏิเสธ -----
    const otRows = state.teamRequests
      .filter(r => r.type === 'ot' && r.status !== 'rejected' && r.from)
      .map(r => ({ r, emp: empOf(r), name: nameOf(r), dk: r.from, hrs: otHoursOf(r), appr: r.status === 'approved' }))
      .filter(x => x.hrs > 0);
    const leaveReqs = state.teamRequests.filter(r => r.type === 'leave' && r.status !== 'rejected' && r.from);
    const leaveDaysOf = (r) => Math.max(1, Math.round((dkToDate(r.to || r.from) - dkToDate(r.from)) / 86400000) + 1);

    const totalHrs = otRows.reduce((s, x) => s + x.hrs, 0);
    const apprHrs = otRows.filter(x => x.appr).reduce((s, x) => s + x.hrs, 0);
    const maxPersonDay = new Set(otRows.map(x => x.emp + '|' + x.dk)).size;

    function aggregate(keyFn) {
      const m = new Map();
      otRows.forEach(x => {
        const k = keyFn(x);
        let g = m.get(k);
        if (!g) { g = { key: k, hrs: 0, appr: 0, days: new Set(), people: new Map() }; m.set(k, g); }
        g.hrs += x.hrs;
        if (x.appr) g.appr += x.hrs;
        g.days.add(x.emp + '|' + x.dk);
        const p = g.people.get(x.emp) || { name: x.name, hrs: 0 };
        p.hrs += x.hrs;
        g.people.set(x.emp, p);
      });
      return [...m.values()].sort((a, b) => (a.key < b.key ? -1 : 1));
    }
    const topOf = (g) => [...g.people.values()].sort((a, b) => b.hrs - a.hrs);

    // ----- helper จัดหน้า -----
    function newSheet(title, tab, widths) {
      const ws = wb.addWorksheet(title, { properties: { tabColor: { argb: tab } }, views: [{ showGridLines: false }] });
      ws.columns = widths.map(w => ({ width: w }));
      return ws;
    }
    function titleBlock(ws, text, sub, span) {
      ws.mergeCells(1, 1, 1, span);
      const c = ws.getCell(1, 1);
      c.value = text;
      c.font = { name: FONT, size: 16, bold: true, color: { argb: C.white } };
      c.fill = solid(C.ink);
      c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      ws.getRow(1).height = 34;
      ws.mergeCells(2, 1, 2, span);
      const s = ws.getCell(2, 1);
      s.value = sub;
      s.font = { name: FONT, size: 10, color: { argb: C.muted } };
      s.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      ws.getRow(2).height = 30;
    }
    function headerRow(ws, rowNum, labels, fill) {
      const row = ws.getRow(rowNum);
      labels.forEach((l, i) => {
        const c = row.getCell(i + 1);
        c.value = l;
        c.font = { name: FONT, size: 11, bold: true, color: { argb: C.white } };
        c.fill = solid(fill || C.accent);
        c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        c.border = border;
      });
      row.height = 28;
    }
    // fmts: n=ทศนิยม, i=จำนวนเต็ม, c=กึ่งกลาง, b=แท่งกราฟ, d=ตัวเลขแสดง - เมื่อเป็น 0, t=ข้อความ
    function bodyRow(ws, rowNum, values, fmts, opts = {}) {
      const row = ws.getRow(rowNum);
      values.forEach((v, i) => {
        const c = row.getCell(i + 1);
        c.value = v;
        c.border = border;
        c.font = { name: FONT, size: 11, bold: !!opts.bold, color: { argb: opts.color || C.ink } };
        const f = fmts[i] || 't';
        if (f === 'n') { c.numFmt = NUM; c.alignment = { horizontal: 'right', vertical: 'middle' }; }
        else if (f === 'd') { c.numFmt = NUM_DASH; c.alignment = { horizontal: 'right', vertical: 'middle' }; }
        else if (f === 'i') { c.numFmt = '#,##0'; c.alignment = { horizontal: 'right', vertical: 'middle' }; }
        else if (f === 'c') { c.alignment = { horizontal: 'center', vertical: 'middle' }; }
        else if (f === 'b') { c.font = { name: FONT, size: 11, color: { argb: C.orange } }; c.alignment = { horizontal: 'left', vertical: 'middle' }; }
        else { c.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true }; }
        if (opts.fill) c.fill = solid(opts.fill);
        else if (opts.zebra) c.fill = solid(C.paper);
      });
      row.height = opts.height || 21;
    }
    function noteRow(ws, rowNum, text, span) {
      ws.mergeCells(rowNum, 1, rowNum, span);
      const c = ws.getCell(rowNum, 1);
      c.value = text;
      c.font = { name: FONT, size: 10, italic: true, color: { argb: C.muted } };
      c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
    }

    const RULE = 'OT = เวลาทำงานรวม − 9 ชม. (ทำงาน 8 ชม. + พัก 1 ชม.) · นับเฉพาะคำขอที่ไม่ถูกปฏิเสธ (อนุมัติแล้ว + รออนุมัติ)';
    const stamp = `ออกรายงานเมื่อ ${fmtThaiDate(now)} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} น.`;

    // =====================================================================
    // 1) สรุปภาพรวม
    // =====================================================================
    {
      const ws = newSheet('สรุปภาพรวม', 'FF5B4CE6', [38, 18, 18, 16, 30]);
      titleBlock(ws, '⚡ รายงานสรุป OT ทีม', `${stamp}\n${RULE}`, 5);
      const byMonth = aggregate(x => x.dk.slice(0, 7));
      const byWeek = aggregate(x => isoWeekInfo(x.dk).key);
      const byYear = aggregate(x => x.dk.slice(0, 4));
      const pick = (arr, k) => (arr.find(g => g.key === k)?.hrs) || 0;
      const peak = [...byMonth].sort((a, b) => b.hrs - a.hrs)[0];
      const peakLabel = peak ? `${THAI_MONTHS[Number(peak.key.slice(5)) - 1]} ${Number(peak.key.slice(0, 4)) + 543} (${r2(peak.hrs)} ชม.)` : '-';
      const empCount = new Set(otRows.map(x => x.emp)).size;
      const kpis = [
        ['OT รวมทั้งหมด (ชม.)', r2(totalHrs), C.peach, 'n'],
        ['  └ อนุมัติแล้ว (ชม.)', r2(apprHrs), C.mint, 'n'],
        ['  └ รออนุมัติ (ชม.)', r2(totalHrs - apprHrs), C.peach, 'n'],
        ['OT สัปดาห์นี้ (ชม.)', r2(pick(byWeek, todayWeek)), C.lav, 'n'],
        ['OT เดือนนี้ (ชม.)', r2(pick(byMonth, todayMonth)), C.lav, 'n'],
        ['OT ปีนี้ (ชม.)', r2(pick(byYear, todayYear)), C.lav, 'n'],
        ['เดือนที่ OT สูงสุด', peakLabel, C.lav, 't'],
        ['จำนวนวันที่มี OT (คน-วัน)', maxPersonDay, C.white, 'i'],
        ['จำนวนพนักงานที่ขอ OT (คน)', empCount, C.white, 'i'],
        ['OT เฉลี่ยต่อคน (ชม.)', empCount ? r2(totalHrs / empCount) : 0, C.white, 'n'],
        ['วันลาพักร้อนรวม (วัน)', leaveReqs.reduce((s, r) => s + leaveDaysOf(r), 0), C.mint, 'i']
      ];
      headerRow(ws, 4, ['ตัวชี้วัด', 'ค่า'], C.ink);
      kpis.forEach((k, i) => {
        bodyRow(ws, 5 + i, [k[0], k[1]], ['t', k[3]], { fill: k[2], bold: i === 0 });
        ws.getCell(5 + i, 2).alignment = { horizontal: 'right', vertical: 'middle' };
      });

      let row = 5 + kpis.length + 2;
      ws.mergeCells(row, 1, row, 5);
      const h = ws.getCell(row, 1);
      h.value = '🏆 ใครขอ OT เยอะที่สุด (Top 5)';
      h.font = { name: FONT, size: 13, bold: true, color: { argb: C.ink } };
      row += 1;
      headerRow(ws, row, ['ชื่อ (รหัส)', 'OT รวม (ชม.)', 'อนุมัติแล้ว (ชม.)', '% ของทีม', 'กราฟ'], C.accent);
      const people = new Map();
      otRows.forEach(x => {
        const p = people.get(x.emp) || { name: x.name, hrs: 0, appr: 0 };
        p.hrs += x.hrs; if (x.appr) p.appr += x.hrs;
        people.set(x.emp, p);
      });
      const ranked = [...people.entries()].sort((a, b) => b[1].hrs - a[1].hrs).slice(0, 5);
      if (!ranked.length) {
        bodyRow(ws, row + 1, ['ยังไม่มีข้อมูล OT', '', '', '', ''], ['t', 't', 't', 't', 't']);
      }
      ranked.forEach(([id, p], i) => {
        bodyRow(ws, row + 1 + i, [`${i + 1}. ${p.name} (${id})`, r2(p.hrs), r2(p.appr), totalHrs ? p.hrs / totalHrs : 0, bar(p.hrs, ranked[0][1].hrs)], ['t', 'n', 'n', 'c', 'b'], { zebra: i % 2 === 1 });
        ws.getCell(row + 1 + i, 4).numFmt = '0.0%';
      });
    }

    // =====================================================================
    // 2-4) ตารางสรุปตามช่วงเวลา (รายเดือน / รายสัปดาห์ / รายปี)
    // =====================================================================
    function periodSheet(title, tab, headline, firstHeads, groups, labelFn, extraNote) {
      const nFirst = firstHeads.length;
      const widths = [...firstHeads.map((h, i) => (i === 0 ? 24 : 26)), 14, 14, 14, 12, 24, 14, 62, 24];
      const ws = newSheet(title, tab, widths);
      const span = nFirst + 8;
      titleBlock(ws, headline, `${stamp}\n${RULE}`, span);
      headerRow(ws, 4, [...firstHeads, 'OT รวม (ชม.)', 'อนุมัติแล้ว (ชม.)', 'จำนวนวัน (คน-วัน)', 'จำนวนคน', 'ขอเยอะสุด', 'ชม. ของคนนั้น', 'Top 3', 'กราฟ'], C.accent);
      ws.views = [{ state: 'frozen', ySplit: 4, showGridLines: false }];
      const maxHrs = Math.max(0, ...groups.map(g => g.hrs));
      let r = 5;
      groups.forEach((g, i) => {
        const top = topOf(g);
        const top3 = top.slice(0, 3).map((p, j) => `${j + 1}. ${p.name} (${r2(p.hrs)})`).join('   ');
        const isPeak = g.hrs === maxHrs && maxHrs > 0;
        bodyRow(ws, r, [...labelFn(g), r2(g.hrs), r2(g.appr), g.days.size, g.people.size, top[0].name, r2(top[0].hrs), top3, bar(g.hrs, maxHrs)],
          [...firstHeads.map(() => 't'), 'n', 'n', 'i', 'i', 't', 'n', 't', 'b'], { fill: isPeak ? C.peach : undefined, zebra: !isPeak && i % 2 === 1 });
        r += 1;
      });
      if (!groups.length) { bodyRow(ws, r, [...firstHeads.map((_, i) => (i === 0 ? 'ยังไม่มีข้อมูล OT' : '')), '', '', '', '', '', '', '', ''], [...firstHeads.map(() => 't'), 't', 't', 't', 't', 't', 't', 't', 't']); r += 1; }
      else {
        const peopleAll = new Set(otRows.map(x => x.emp)).size;
        const topAll = [...new Map(otRows.map(x => [x.emp, 0])).keys()].map(id => ({ id, name: otRows.find(x => x.emp === id).name, hrs: otRows.filter(x => x.emp === id).reduce((s, x) => s + x.hrs, 0) })).sort((a, b) => b.hrs - a.hrs)[0];
        bodyRow(ws, r, [...firstHeads.map((_, i) => (i === 0 ? 'รวมทั้งหมด' : '')), r2(totalHrs), r2(apprHrs), maxPersonDay, peopleAll, topAll.name, r2(topAll.hrs), '', ''],
          [...firstHeads.map(() => 't'), 'n', 'n', 'i', 'i', 't', 'n', 't', 't'], { fill: C.lav, bold: true, height: 24 });
        r += 1;
      }
      noteRow(ws, r + 1, extraNote || 'แถวสีส้ม = ช่วงที่มี OT สูงสุด · "จำนวนวัน (คน-วัน)" = นับ 1 คนที่ทำ OT 1 วัน เป็น 1', span);
      ws.getRow(r + 1).height = 22;
      return ws;
    }

    const monthLabel = (k) => `${THAI_MONTHS[Number(k.slice(5)) - 1]} ${Number(k.slice(0, 4)) + 543}`;
    periodSheet('รายเดือน', 'FFFFB98A', '📅 สรุป OT รายเดือน', ['เดือน'], aggregate(x => x.dk.slice(0, 7)), (g) => [monthLabel(g.key)]);

    periodSheet('รายสัปดาห์', 'FFD9F0FF', '🗓️ สรุป OT รายสัปดาห์ (จันทร์–อาทิตย์)', ['สัปดาห์', 'ช่วงวันที่'], aggregate(x => isoWeekInfo(x.dk).key), (g) => {
      const wi = isoWeekInfo(`${g.key.slice(0, 4)}-01-04`);
      // หาวันจันทร์ของสัปดาห์จากรหัส ISO
      const mon = new Date(wi.mon); mon.setDate(mon.getDate() + (Number(g.key.slice(6)) - 1) * 7);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      return [`สัปดาห์ที่ ${Number(g.key.slice(6))}/${Number(g.key.slice(0, 4)) + 543}`, `${fmtThaiDate(mon)} – ${fmtThaiDate(sun)}`];
    });

    {
      const years = aggregate(x => x.dk.slice(0, 4));
      const monthsInYear = (y) => new Set(otRows.filter(x => x.dk.startsWith(y)).map(x => x.dk.slice(0, 7))).size;
      const ws = periodSheet('รายปี', 'FFC6F3DC', '📆 สรุป OT รายปี', ['ปี (พ.ศ.)', 'OT เฉลี่ยต่อเดือน (ชม.)'], years, (g) => [Number(g.key) + 543, r2(g.hrs / Math.max(1, monthsInYear(g.key)))]);
      years.forEach((g, i) => { const c = ws.getCell(5 + i, 2); c.numFmt = NUM; c.alignment = { horizontal: 'right', vertical: 'middle' }; ws.getCell(5 + i, 1).alignment = { horizontal: 'center', vertical: 'middle' }; });
    }

    // =====================================================================
    // 5) อันดับคนขอ OT
    // =====================================================================
    {
      const ws = newSheet('อันดับคนขอ OT', 'FFFFD6E0', [9, 14, 28, 14, 14, 14, 14, 14, 12, 14, 26]);
      titleBlock(ws, '🏆 อันดับพนักงานที่ขอ OT', `${stamp}\n${RULE}`, 11);
      headerRow(ws, 4, ['อันดับ', 'รหัส', 'ชื่อ', 'OT รวม (ชม.)', 'อนุมัติแล้ว (ชม.)', 'รออนุมัติ (ชม.)', 'จำนวนวัน', 'เฉลี่ย/วัน (ชม.)', '% ของทีม', 'ลาพักร้อน (วัน)', 'กราฟ'], C.accent);
      ws.views = [{ state: 'frozen', ySplit: 4, showGridLines: false }];
      const map = new Map();
      Object.values(registeredAccounts).forEach(a => {
        const id = (a.empId || '').toUpperCase();
        if (!id || id === APPROVER_ID) return;
        map.set(id, { id, name: `${a.firstName || ''} ${a.lastName || ''}`.trim() || id, hrs: 0, appr: 0, days: new Set(), leave: 0 });
      });
      const ensure = (id, name) => { if (!map.has(id)) map.set(id, { id, name, hrs: 0, appr: 0, days: new Set(), leave: 0 }); return map.get(id); };
      otRows.forEach(x => { const p = ensure(x.emp, x.name); p.hrs += x.hrs; if (x.appr) p.appr += x.hrs; p.days.add(x.dk); });
      leaveReqs.forEach(r => { const p = ensure(empOf(r), nameOf(r)); p.leave += leaveDaysOf(r); });
      const list = [...map.values()].sort((a, b) => b.hrs - a.hrs || a.name.localeCompare(b.name));
      const maxH = Math.max(0, ...list.map(p => p.hrs));
      list.forEach((p, i) => {
        const medal = p.hrs > 0 ? (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : String(i + 1)) : '-';
        bodyRow(ws, 5 + i, [medal, p.id, p.name, r2(p.hrs), r2(p.appr), r2(p.hrs - p.appr), p.days.size, p.days.size ? r2(p.hrs / p.days.size) : 0, totalHrs ? p.hrs / totalHrs : 0, p.leave, bar(p.hrs, maxH)],
          ['c', 'c', 't', 'd', 'd', 'd', 'i', 'd', 'c', 'd', 'b'], { fill: i === 0 && p.hrs > 0 ? C.peach : undefined, zebra: !(i === 0 && p.hrs > 0) && i % 2 === 1 });
        ws.getCell(5 + i, 9).numFmt = '0.0%';
      });
      if (!list.length) bodyRow(ws, 5, ['', '', 'ยังไม่มีพนักงานในระบบ', '', '', '', '', '', '', '', ''], ['t', 't', 't', 't', 't', 't', 't', 't', 't', 't', 't']);
    }

    // =====================================================================
    // 6) ตารางรายคน × รายเดือน
    // =====================================================================
    {
      const months = [...new Set(otRows.map(x => x.dk.slice(0, 7)))].sort();
      const widths = [14, 26, ...months.map(() => 11), 14];
      const ws = newSheet('รายคน-รายเดือน', 'FFE5E2FF', widths);
      const span = 2 + months.length + 1;
      titleBlock(ws, '👥 OT แยกรายคน × รายเดือน (ชม.)', `${stamp}\n${RULE}`, Math.max(span, 4));
      headerRow(ws, 4, ['รหัส', 'ชื่อ', ...months.map(m => `${THAI_MONTHS_SHORT[Number(m.slice(5)) - 1]} ${String(Number(m.slice(0, 4)) + 543).slice(2)}`), 'รวม'], C.accent);
      ws.views = [{ state: 'frozen', xSplit: 2, ySplit: 4, showGridLines: false }];
      const ids = [...new Set(otRows.map(x => x.emp))];
      const sumBy = (id, m) => otRows.filter(x => x.emp === id && (!m || x.dk.startsWith(m))).reduce((s, x) => s + x.hrs, 0);
      const people = ids.map(id => ({ id, name: otRows.find(x => x.emp === id).name, total: sumBy(id) })).sort((a, b) => b.total - a.total);
      people.forEach((p, i) => {
        bodyRow(ws, 5 + i, [p.id, p.name, ...months.map(m => r2(sumBy(p.id, m))), r2(p.total)], ['c', 't', ...months.map(() => 'd'), 'n'], { zebra: i % 2 === 1 });
        ws.getCell(5 + i, span).font = { name: FONT, size: 11, bold: true, color: { argb: C.ink } };
      });
      if (people.length) {
        const tr = 5 + people.length;
        bodyRow(ws, tr, ['', 'รวมทั้งทีม', ...months.map(m => r2(otRows.filter(x => x.dk.startsWith(m)).reduce((s, x) => s + x.hrs, 0))), r2(totalHrs)], ['t', 't', ...months.map(() => 'd'), 'n'], { fill: C.lav, bold: true, height: 24 });
        if (months.length) {
          const colL = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
          ws.addConditionalFormatting({ ref: `C5:${colL(2 + months.length)}${4 + people.length}`, rules: [{ type: 'colorScale', cfvo: [{ type: 'min' }, { type: 'max' }], color: [{ argb: 'FFFFFFFF' }, { argb: 'FFFFB98A' }] }] });
        }
      } else {
        bodyRow(ws, 5, ['', 'ยังไม่มีข้อมูล OT', '', ''].slice(0, Math.max(4, span)), [], {});
      }
    }

    // =====================================================================
    // 7) รายการทั้งหมด
    // =====================================================================
    {
      const ws = newSheet('รายการทั้งหมด', 'FFC7C3EA', [13, 12, 12, 24, 13, 13, 10, 10, 13, 10, 12, 34, 14]);
      titleBlock(ws, '📋 รายการ OT & ลาพักร้อน ทั้งหมด', `${stamp}\nวันที่แสดงเป็น ค.ศ. (วว/ดด/ปปปป) เพื่อให้กรองและเรียงลำดับใน Excel ได้ถูกต้อง · ใช้ปุ่มกรองที่หัวตารางได้`, 13);
      headerRow(ws, 4, ['วันที่', 'วัน', 'รหัส', 'ชื่อ', 'ประเภท', 'ถึงวันที่', 'เข้างาน', 'เลิกงาน', 'ทำงานรวม (ชม.)', 'พัก (ชม.)', 'OT (ชม.)', 'หมายเหตุ', 'สถานะ'], C.ink);
      ws.views = [{ state: 'frozen', ySplit: 4, showGridLines: false }];
      const sorted = [...state.teamRequests].filter(r => r.from).sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : empOf(a) < empOf(b) ? -1 : 1));
      sorted.forEach((r, i) => {
        const isOt = r.type === 'ot';
        const hasT = isOt && r.timeIn && r.timeOut;
        const work = hasT ? calcWorkHours(r.timeIn, r.timeOut) : '';
        const status = r.status === 'approved' ? 'อนุมัติแล้ว' : r.status === 'rejected' ? 'ไม่อนุมัติ' : 'รออนุมัติ';
        const rowNum = 5 + i;
        bodyRow(ws, rowNum, [dkToUtc(r.from), THAI_DAYS_FULL[dkToDate(r.from).getDay()], empOf(r), nameOf(r), isOt ? 'OT' : 'ลาพักร้อน', dkToUtc(r.to || r.from),
          isOt ? (r.timeIn || '-') : '-', isOt ? (r.timeOut || '-') : '-', work, hasT ? BREAK_HOURS : '', isOt ? otHoursOf(r) : '', (r.note || ''), status],
          ['c', 'c', 'c', 't', 'c', 'c', 'c', 'c', 'n', 'n', 'n', 't', 'c'], { zebra: i % 2 === 1, color: r.status === 'rejected' ? C.grey : C.ink });
        ws.getCell(rowNum, 1).numFmt = 'dd/mm/yyyy';
        ws.getCell(rowNum, 6).numFmt = 'dd/mm/yyyy';
        const sc = ws.getCell(rowNum, 13);
        sc.fill = solid(r.status === 'approved' ? C.mint : r.status === 'rejected' ? C.rose : C.peach);
        sc.font = { name: FONT, size: 11, bold: true, color: { argb: C.ink } };
        const oc = ws.getCell(rowNum, 11);
        if (isOt && otHoursOf(r) > 0 && r.status !== 'rejected') oc.font = { name: FONT, size: 11, bold: true, color: { argb: 'FF5B4CE6' } };
      });
      if (sorted.length) ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4 + sorted.length, column: 13 } };
    }

    return wb;
  }

  async function exportTeamExcel() {
    showToast('⏳ กำลังสร้างไฟล์ Excel...');
    let ExcelJS;
    try { ExcelJS = await loadExcelJS(); }
    catch (e) { showToast('โหลดตัวสร้าง Excel ไม่ได้ (เน็ตหลุด?) — ดาวน์โหลดแบบ CSV แทน'); exportTeamCsvFallback(); return; }
    try {
      const wb = buildOtWorkbook(ExcelJS);
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `oto-report-${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showToast('📥 ดาวน์โหลดรายงาน Excel เรียบร้อย');
    } catch (e) {
      console.error(e);
      showToast('สร้าง Excel ไม่สำเร็จ — ดาวน์โหลดแบบ CSV แทน');
      exportTeamCsvFallback();
    }
  }

                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2.5">
                    ${renderMoodSvg(r.mood || empAcc.mood || 'happy', 40, empAcc.avatarPhoto)}
                    <div>
                      <div class="text-sm font-bold flex items-center gap-1.5">
                        <span>${r.firstName} ${r.lastName || ''}</span>
                        <span class="text-[10px] px-2 py-0.2 rounded-full border border-[#1e1b4b] bg-[#f6f5ff]">${r.empId}</span>
                      </div>
                      <div class="text-xs font-bold text-[#4f46e5] mt-0.5">
                        ${r.type === 'ot' ? `⚡ ขอทำโอที +${fmtH(otHoursOf(r))} ชม. (${formatThaiShort(r.from)})` : `🌴 ขอลาพักร้อน (${formatThaiShort(r.from)} – ${formatThaiShort(r.to)})`}
                      </div>
                      <div class="text-[11px] text-[#7a76a3] mt-0.5">
                        ${r.type === 'ot' ? `เวลา ${r.timeIn} – ${r.timeOut} น. · ` : ''}${r.note || ''}
                      </div>
                    </div>
                  </div>
                  <button type="button" onclick="deleteTeamRequest('${r.id}')" class="w-8 h-8 rounded-full bg-[#ffd6e0] border border-[#1e1b4b] flex items-center justify-center text-xs shrink-0" title="ลบรายการนี้">🗑️</button>
                </div>

                ${r.photo ? `
                  <div class="mt-2.5 p-2 rounded-2xl border border-[#1e1b4b] bg-[#f6f5ff] flex items-center justify-between gap-2">
                    <div class="min-w-0 text-[11px]">
                      <div class="font-bold">📸 หลักฐานเช็คเอาท์: ${r.checkoutTime || '-'} น.</div>
                      <div class="text-[#7a76a3] truncate">📍 ${r.checkoutLocation || 'ยืนยัน GPS แล้ว'}</div>
                    </div>
                    <button type="button" onclick="openApprovalDetail('${r.id}')" class="comic-pill px-3 py-1 text-[11px] bg-white shrink-0">ดูรูปหลักฐาน</button>
                  </div>
                ` : ''}

                ${r.status === 'submitted' ? `
                  <div class="grid grid-cols-2 gap-2 mt-3">
                    <button type="button" onclick="decideRequest('${r.id}', 'rejected')" class="comic-btn py-2 bg-[#ffd6e0] text-xs">✕ ไม่อนุมัติ</button>
                    <button type="button" onclick="decideRequest('${r.id}', 'approved')" class="comic-btn py-2 bg-[#c6f3dc] text-xs">✓ อนุมัติคำขอ</button>
                  </div>
                ` : `
                  <div class="mt-2.5 pt-2 border-t border-dashed border-[#c7c3ea] flex items-center justify-between text-xs font-bold">
                    <span>ผลการพิจารณา:</span>
                    <span class="px-2.5 py-0.5 rounded-full border border-[#1e1b4b] ${r.status === 'approved' ? 'bg-[#c6f3dc]' : 'bg-[#ffd6e0]'}">
                      ${r.status === 'approved' ? '✓ อนุมัติแล้ว' : '✕ ไม่อนุมัติ'}
                    </span>
                  </div>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
  }

  function openApprovalDetail(reqId) {
    const r = state.teamRequests.find(x => x.id === reqId);
    if (!r) return;
    const sheet = document.getElementById('approvalSheetContent');
    sheet.innerHTML = `
      <div class="w-10 h-1.5 rounded-full bg-[#c7c3ea] mx-auto mb-3"></div>
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="text-base font-bold">รายละเอียดคำขอ — ${r.firstName} ${r.lastName || ''}</h3>
          <p class="text-xs text-[#7a76a3]">รหัสพนักงาน: ${r.empId}</p>
        </div>
        <button type="button" onclick="closeApprovalDetail()" class="w-8 h-8 rounded-full border-2 border-[#1e1b4b] bg-white font-bold">✕</button>
      </div>

      <div class="comic-card p-3.5 bg-white space-y-1.5 text-xs mb-3">
        <div><b>ประเภท:</b> ${r.type === 'ot' ? `ขอทำโอที (+${fmtH(otHoursOf(r))} ชม.)` : 'ขอลาพักร้อน'}</div>
        <div><b>วันที่:</b> ${r.type === 'ot' ? formatThaiFull(r.from) : `${formatThaiShort(r.from)} – ${formatThaiShort(r.to)}`}</div>
        ${r.type === 'ot' ? `<div><b>เวลา:</b> ${r.timeIn} – ${r.timeOut} น.</div>` : ''}
        <div><b>รายละเอียด:</b> ${r.note || '-'}</div>
        ${r.photo ? `
          <div class="pt-2">
            <img src="${r.photo}" onclick="openPhotoViewer('${r.id}')" class="w-full max-h-64 object-cover rounded-2xl border-2 border-[#1e1b4b] cursor-pointer" alt="หลักฐาน" />
            <div class="text-[11px] text-[#7a76a3] mt-1.5">🕒 ${r.checkoutTime || '-'} น. · 📍 ${r.checkoutLocation || 'GPS Verified'}</div>
          </div>
        ` : ''}
      </div>

      ${r.status === 'submitted' ? `
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="decideRequest('${r.id}', 'rejected'); closeApprovalDetail();" class="comic-btn py-3 bg-[#ffd6e0] text-sm">✕ ไม่อนุมัติ</button>
          <button type="button" onclick="decideRequest('${r.id}', 'approved'); closeApprovalDetail();" class="comic-btn py-3 bg-[#c6f3dc] text-sm">✓ อนุมัติคำขอ</button>
        </div>
      ` : ''}
    `;
    document.getElementById('approvalSheet').classList.add('open');
  }

  function closeApprovalDetail() {
    document.getElementById('approvalSheet').classList.remove('open');
  }

  function openPhotoViewer(reqId) {
    const r = state.teamRequests.find(x => x.id === reqId);
    if (!r || !r.photo) return;
    document.getElementById('photoViewerImg').src = r.photo;
    document.getElementById('photoViewerMeta').textContent = `${r.firstName} (${r.empId}) · เช็คเอาท์ ${r.checkoutTime || '-'} น. · ${r.checkoutLocation || ''}`;
    document.getElementById('photoViewer').classList.add('open');
  }

  function closePhotoViewer() {
    document.getElementById('photoViewer').classList.remove('open');
  }

  async function decideRequest(reqId, decision) {
    const idx = state.teamRequests.findIndex(r => r.id === reqId);
    if (idx === -1) return;
    state.teamRequests[idx].status = decision;
    state.teamRequests[idx].updatedAt = Date.now();
    const updatedReq = state.teamRequests[idx];

    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast(decision === 'approved' ? '✓ อนุมัติคำขอเรียบร้อยแล้ว' : '✕ บันทึกไม่อนุมัติคำขอแล้ว');

    if (window.cloudStore) {
      await window.cloudStore.saveRequest(updatedReq);
    }
  }

  async function deleteTeamRequest(reqId) {
    const target = state.teamRequests.find(r => r.id === reqId);
    if (!target) return;
    deletedRequestIds.add(reqId);
    state.teamRequests = state.teamRequests.filter(r => r.id !== reqId);

    const empUp = (target.empId || '').trim().toUpperCase();
    const calKey = `${empUp}_${target.from}`;
    deletedCalendarKeys.add(calKey);
    allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empUp && c.dateKey === target.from));

    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast('🗑️ ลบรายการคำขอและข้อมูลบนปฏิทินเรียบร้อย');

    if (window.cloudStore) {
      await window.cloudStore.deleteRequest(reqId);
      await window.cloudStore.deleteCalendarItem(empUp, target.from);
    }
  }

  // =========================================================================
  // Profile, Avatar Photo Editor, Employee Account Deletion & Cloud Config
  // =========================================================================
  function renderProfileTab() {
    const manager = isManager();
    const empList = Object.values(registeredAccounts).filter(a => (a.empId || '').toUpperCase() !== APPROVER_ID);

    return `
      <div class="comic-card p-4 text-center mb-3">
        <div class="relative inline-block">
          ${renderMoodSvg(state.user.mood, 76, state.user.avatarPhoto)}
          <label class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#ffb98a] border-2 border-[#1e1b4b] flex items-center justify-center text-xs cursor-pointer shadow">
            ✏️
            <input type="file" accept="image/*" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
        </div>

        <h2 class="text-base font-bold mt-2">${state.user.firstName} ${state.user.lastName || ''}</h2>
        <p class="text-xs text-[#7a76a3]">รหัส: <b>${state.user.empId}</b> ${manager ? '(ผู้อนุมัติหลัก)' : ''}</p>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <label class="comic-pill py-2 text-xs bg-[#d9f0ff] cursor-pointer flex items-center justify-center gap-1">
            <span>📷 ถ่ายรูปโปรไฟล์</span>
            <input type="file" accept="image/*" capture="user" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
          <label class="comic-pill py-2 text-xs bg-[#e5e2ff] cursor-pointer flex items-center justify-center gap-1">
            <span>🖼️ เลือกจากอัลบั้ม</span>
            <input type="file" accept="image/*" onchange="handleProfileAvatarUpload(event)" class="hidden" />
          </label>
        </div>

        ${state.user.avatarPhoto ? `
          <button type="button" onclick="removeProfileAvatar()" class="mt-2 text-[11px] font-bold text-[#e11d48] underline">ลบรูปโปรไฟล์ (กลับไปใช้ไอคอนอารมณ์)</button>
        ` : ''}
      </div>

      <div class="comic-card p-3.5 mb-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold">☁️ การซิงค์ฐานข้อมูลกลางข้ามเครื่อง</h3>
          <button type="button" onclick="window.cloudStore && window.cloudStore.pullFromCloud(true)" class="comic-pill px-3 py-1 text-[11px] bg-[#c6f3dc]">🔄 ซิงค์ขึ้น-ลงเดี๋ยวนี้</button>
        </div>
        <p class="text-[11px] text-[#7a76a3]">ซิงค์แบบเรียลไทม์ผ่านฐานข้อมูลกลาง (Firestore) · คำขอและรายชื่อพนักงานส่งถึง SM ทันที ถ้าเน็ตหลุดจะเก็บคิวไว้แล้วส่งให้อัตโนมัติ</p>
        ${manager ? `
          <div class="mt-2.5 pt-2.5 border-t border-dashed border-[#c7c3ea]">
            <label class="block text-[11px] font-bold mb-1">🔥 Firebase config (วางทั้งก้อน — ใช้ทดสอบเครื่องนี้ ปกติฝังไว้ในไฟล์)</label>
            <div class="flex gap-1.5">
              <input id="inpCustomCloudUrl" type="text" value="" class="comic-input !py-1.5 !text-xs" placeholder='วาง {"apiKey":"…","projectId":"…"}' />
              <button type="button" onclick="saveCustomCloudUrlSetting()" class="comic-pill px-3 py-1.5 text-[11px] bg-[#ffe6d3] shrink-0">บันทึก</button>
            </div>
          </div>
        ` : ''}
      </div>

      ${manager ? `
        <div class="comic-card p-3.5 mb-3">
          <div class="flex items-center justify-between mb-2.5">
            <h3 class="text-sm font-bold">👥 จัดการบัญชีพนักงานในระบบ (${empList.length} คน)</h3>
          </div>
          ${empList.length === 0 ? `
            <p class="text-xs text-[#7a76a3] text-center py-3">ยังไม่มีบัญชีพนักงานที่ลงทะเบียน</p>
          ` : `
            <div class="space-y-2">
              ${empList.map(emp => {
                const id = emp.empId.toUpperCase();
                const isConfirming = state.confirmDeleteEmpId === id;
                return `
                  <div class="p-2.5 rounded-2xl border-2 border-[#1e1b4b] bg-[#f6f5ff] flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      ${renderMoodSvg(emp.mood || 'happy', 34, emp.avatarPhoto)}
                      <div class="min-w-0">
                        <div class="text-xs font-bold truncate">${emp.firstName} ${emp.lastName || ''}</div>
                        <div class="text-[10px] text-[#7a76a3]">รหัส: <b>${id}</b></div>
                      </div>
                    </div>
                    ${isConfirming ? `
                      <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="deleteEmployeeAccount('${id}')" class="px-2.5 py-1 rounded-full bg-[#ff4d8d] text-white border border-[#1e1b4b] text-[10px] font-bold">ยืนยันลบ</button>
                        <button type="button" onclick="state.confirmDeleteEmpId=null; renderApp();" class="px-2 py-1 rounded-full bg-white border border-[#1e1b4b] text-[10px] font-bold">ยกเลิก</button>
                      </div>
                    ` : `
                      <button type="button" onclick="state.confirmDeleteEmpId='${id}'; renderApp();" class="comic-pill px-3 py-1 text-[11px] bg-[#ffd6e0] shrink-0">🗑️ ลบบัญชี</button>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      ` : ''}

      <button type="button" onclick="logoutUser()" class="comic-btn w-full py-3 bg-[#ffd6e0] text-sm">
        ออกจากระบบ / สลับรหัสพนักงาน
      </button>
    `;
  }

  async function saveCustomCloudUrlSetting() {
    const val = (document.getElementById('inpCustomCloudUrl')?.value || '').trim();
    if (window.cloudStore && window.cloudStore.setCustomCloudUrl) {
      await window.cloudStore.setCustomCloudUrl(val);
      if (val) showToast('☁️ บันทึก Firebase config แล้ว');
    }
  }

  function handleProfileAvatarUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file || !state.user) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const size = 220;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const avatarData = canvas.toDataURL('image/jpeg', 0.72);

        state.user.avatarPhoto = avatarData;
        const id = state.user.empId.toUpperCase();
        registeredAccounts[id] = {
          ...(registeredAccounts[id] || state.user),
          empId: id,
          avatarPhoto: avatarData,
          updatedAt: Date.now()
        };
        window.persistLocalDatabase();
        renderApp();
        showToast('✨ อัปเดตรูปโปรไฟล์เรียบร้อยแล้ว');
        if (window.cloudStore) await window.cloudStore.saveAccount(registeredAccounts[id]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function removeProfileAvatar() {
    if (!state.user) return;
    state.user.avatarPhoto = '';
    const id = state.user.empId.toUpperCase();
    if (registeredAccounts[id]) {
      registeredAccounts[id].avatarPhoto = '';
      registeredAccounts[id].updatedAt = Date.now();
    }
    window.persistLocalDatabase();
    renderApp();
    showToast('ลบรูปโปรไฟล์แล้ว');
    if (window.cloudStore && registeredAccounts[id]) {
      await window.cloudStore.saveAccount(registeredAccounts[id]);
    }
  }

  async function deleteEmployeeAccount(empId) {
    const targetId = (empId || '').trim().toUpperCase();
    if (!targetId || targetId === APPROVER_ID) return;

    deletedAccountIds.add(targetId);
    delete registeredAccounts[targetId];

    state.teamRequests.forEach(r => {
      if ((r.empId || '').trim().toUpperCase() === targetId) {
        deletedRequestIds.add(r.id);
      }
    });
    state.teamRequests = state.teamRequests.filter(r => (r.empId || '').trim().toUpperCase() !== targetId);

    allCloudCalendarItems.forEach(c => {
      if ((c.empId || '').trim().toUpperCase() === targetId) {
        deletedCalendarKeys.add(`${targetId}_${c.dateKey}`);
      }
    });
    allCloudCalendarItems = allCloudCalendarItems.filter(c => (c.empId || '').trim().toUpperCase() !== targetId);

    state.confirmDeleteEmpId = null;
    window.persistLocalDatabase();
    rebuildVisibleCalendarItems();
    renderApp();
    showToast(`🗑️ ลบบัญชี ${targetId} และลบรายการ OT/ลาพักร้อนทั้งหมดแล้ว`);

    if (window.cloudStore) {
      await window.cloudStore.deleteAccount(targetId);
    }
  }

  // =========================================================================
  // Toast, PWA Install & Main Render Loop
  // =========================================================================
  let toastTimer = null;
  function showToast(msg) {
    const pill = document.getElementById('toastPill');
    if (!pill) return;
    pill.textContent = msg;
    pill.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => pill.classList.remove('show'), 2800);
  }
  window.showToast = showToast;

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function triggerAppInstall() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt = null;
      return;
    }
    showToast('เปิดใน Safari / Chrome แล้วกด "แชร์ → เพิ่มไปยังหน้าจอโฮม" เพื่อติดตั้งแอป');
  }

  function renderApp() {
    const activeEl = document.activeElement;
    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
      return;
    }
    if (!state.user) return;
    renderHeader();
    renderNav();
    const main = document.getElementById('appMain');
    if (state.activeTab === 'cal') main.innerHTML = renderCalendarTab();
    else if (state.activeTab === 'sum') main.innerHTML = renderSummaryTab();
    else if (state.activeTab === 'app' && isManager()) main.innerHTML = renderApprovalTab();
    else main.innerHTML = renderProfileTab();
  }

  setInterval(() => {
    const clockEl = document.getElementById('liveThaiClock');
    if (clockEl) clockEl.textContent = getThaiTimeStr();
  }, 1000);

  if (state.user && state.user.empId) {
    document.getElementById('loginScreen').classList.add('hidden');
    rebuildVisibleCalendarItems();
    renderApp();
  }
</script>
</body>
</html>
