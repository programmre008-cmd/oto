<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="oto" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link id="dynamicManifestLink" rel="manifest" />
  <link id="appleTouchIconLink" rel="apple-touch-icon" />
  <title>oto — ปฏิทินโอที & ลาพักร้อน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Fredoka:wght@600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1e1b4b;
      --paper: #f6f5ff;
      --card: #ffffff;
      --peach: #ffb98a;
      --lavender: #e5e2ff;
      --mint: #c6f3dc;
      --sky: #d9f0ff;
      --rose: #ffd6e0;
      --muted: #7a76a3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
      pointer-events: auto !important;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Anuphan', sans-serif;
      background: #e9e6fb;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    @media (max-width: 640px) {
      html, body {
        padding: 0;
        background: var(--ink);
        align-items: stretch;
      }
      .phone-shell {
        width: 100vw !important;
        min-width: 100vw !important;
        max-width: 100vw !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }
      .bottom-nav {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
      }
      .sheet-card {
        max-height: 92dvh !important;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }

    h1, h2, h3, .font-heading {
      font-family: 'Kanit', sans-serif;
    }

    .font-brand {
      font-family: 'Fredoka', sans-serif;
    }

    .phone-shell {
      width: 412px;
      min-width: 360px;
      max-width: 100%;
      height: 830px;
      max-height: 94vh;
      margin: 0 auto;
      flex-shrink: 0;
      background: var(--paper);
      border-radius: 44px;
      border: 4px solid var(--ink);
      box-shadow: 0 24px 54px rgba(30, 27, 75, 0.22);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      background: #ffffff;
      padding: 16px 20px 26px;
      position: relative;
      z-index: 10;
    }

    .wave-divider {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 22px;
      display: block;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 104px;
      scrollbar-width: none;
    }
    .main-scroll::-webkit-scrollbar {
      display: none;
    }

    .comic-card {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 26px;
      box-shadow: 0 5px 0 var(--ink);
    }

    .comic-pill {
      border: 2px solid var(--ink);
      border-radius: 9999px;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .comic-pill:active {
      transform: scale(0.96);
    }

    .comic-input {
      width: 100%;
      background: #ffffff !important;
      color: var(--ink) !important;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 11px 14px;
      font-family: 'Anuphan', sans-serif;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      cursor: text;
      -webkit-appearance: none;
      appearance: none;
      transition: box-shadow 0.15s ease, transform 0.12s ease;
    }
    .comic-input::placeholder {
      color: #9e9bc2;
      font-weight: 400;
    }
    .comic-input:focus {
      box-shadow: 0 3px 0 var(--ink);
      background: #fffdfb !important;
    }

    .comic-btn {
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }
    .comic-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .comic-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .day-cell {
      aspect-ratio: 1 / 1.16;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.15s ease;
      position: relative;
      background: #f4f3ff;
    }
    .day-cell:hover {
      border-color: rgba(30, 27, 75, 0.25);
    }
    .day-cell:active {
      transform: scale(0.93);
    }
    .day-cell.other-month {
      opacity: 0.32;
      background: transparent;
    }
    .day-cell.is-today {
      border: 2.5px solid var(--ink);
      background: #ffffff;
    }
    .day-cell.has-ot {
      background: linear-gradient(180deg, #ffe6d3 0%, #ffd5ec 100%);
      border: 2px solid var(--ink);
    }
    .day-cell.has-leave {
      background: #0d9488;
      border: 2px solid var(--ink);
      color: #ffffff;
    }
    .day-cell.has-leave .day-num {
      color: #ffffff !important;
    }
    .day-cell.has-leave .day-badge-leave {
      background: #064e3b;
      color: #ffffff;
      border-color: #ffffff;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2.5px solid var(--ink);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 10px 14px 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 25;
      box-shadow: 0 -6px 20px rgba(30, 27, 75, 0.08);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      min-width: 62px;
      transition: color 0.15s ease;
    }
    .nav-item.active {
      color: var(--ink);
    }
    .nav-item.active .nav-icon-wrap {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -22px;
      box-shadow: 0 3px 0 var(--ink);
    }
    .nav-icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(24, 21, 58, 0.55);
      backdrop-filter: blur(2px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-card {
      background: #f6f5ff;
      border-top: 3px solid var(--ink);
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      padding: 14px 18px 24px;
      max-height: 88%;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      scrollbar-width: none;
    }
    .sheet-card::-webkit-scrollbar {
      display: none;
    }
    .sheet-backdrop.open .sheet-card {
      transform: translateY(0);
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: var(--ink);
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 20px 28px;
      color: #ffffff;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .login-overlay::-webkit-scrollbar {
      display: none;
    }
    .login-overlay.hidden {
      display: none;
    }

    .toast-pill {
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #ffffff;
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 9999px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 0 var(--ink);
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      max-width: 90%;
      text-align: center;
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="phone-shell" id="phoneShell">
  <!-- Login Overlay -->
  <div class="login-overlay" id="loginScreen">
    <div class="flex flex-col items-center text-center mt-2">
      <div class="w-16 h-16 rounded-full bg-white border-[3px] border-[#ffb98a] flex items-center justify-center mb-2 shadow-lg">
        <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="34" r="24" fill="#FFE6D5" stroke="#1E1B4B" stroke-width="3.5"/>
          <path d="M12 24C14 14 23 10 32 10C41 10 50 14 52 24C45 20 39 22 32 22C25 22 19 20 12 24Z" fill="#1E1B4B"/>
          <circle cx="24" cy="34" r="2.8" fill="#1E1B4B"/>
          <circle cx="40" cy="34" r="2.8" fill="#1E1B4B"/>
          <path d="M26 42C28.5 45 35.5 45 38 42" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
          <circle cx="46" cy="39" r="3" fill="#FF9EB5" opacity="0.75"/>
        </svg>
      </div>
      <div class="font-brand text-3xl tracking-tight text-white">oto</div>
      <p class="text-xs text-[#c7c3ea] mt-0.5">บันทึกเวลาโอที & วันลาพักร้อนของทีม</p>
    </div>

    <div class="space-y-3 my-auto pt-3">
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="btnAuthLoginMode" onclick="setAuthMode('login')" class="comic-pill py-2 text-xs font-bold bg-[#ffb98a] text-[#1e1b4b] border-white">
          🔑 เข้าสู่ระบบ
        </button>
        <button type="button" id="btnAuthRegisterMode" onclick="setAuthMode('register')" class="comic-pill py-2 text-xs font-bold bg-[#2c2866] text-white border-[#7a76a3]">
          ✨ สร้างรหัสพนักงาน
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ใส่รหัสพนักงาน</label>
        <input id="inpEmpId" type="text" oninput="onAuthEmpIdChange()" class="comic-input uppercase" placeholder="ใส่รหัสพนักงาน" value="" autocomplete="username" />
      </div>

      <div id="approverRecognizedBadge" class="hidden rounded-2xl bg-[#c6f3dc] text-[#1e1b4b] px-3 py-2 text-xs font-bold">
        🛡️ ผู้อนุมัติหลัก: <span id="approverRecognizedName">นาย ณัฐวุฒิ ชุมหิรัญ</span> (ไม่ต้องกรอกชื่อ ใส่รหัสผ่านได้เลย)
      </div>

      <div id="nameFieldsGroup" class="grid grid-cols-2 gap-2.5 hidden">
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">ชื่อ</label>
          <input id="inpFirst" type="text" class="comic-input" placeholder="เช่น กานต์พิชชา" value="" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#d8d5f7] mb-1">นามสกุล</label>
          <input id="inpLast" type="text" class="comic-input" placeholder="เช่น สุขใจ" value="" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label id="lblPasswordField" class="block text-xs font-semibold text-[#d8d5f7]">รหัสผ่าน (Password)</label>
          <button type="button" id="btnResetSmPass" onclick="resetSmPasswordPrompt()" class="hidden text-[11px] font-bold text-[#ffb98a] underline">
            🔄 รีรหัสผ่าน SM
          </button>
        </div>
        <input id="inpPassword" type="password" class="comic-input" placeholder="กรอกรหัสผ่านของคุณ" value="" autocomplete="current-password" />
      </div>

      <p id="authHelperNote" class="text-[11px] text-[#c7c3ea] leading-relaxed">
        * ระบบจำรหัสพนักงานและซิงค์ข้อมูลข้ามเครื่อง (คอมฯ ↔ มือถือ) อัตโนมัติ
      </p>

      <div class="flex items-center justify-between gap-2 text-[11px] bg-[#262259] border border-[#4c4694] rounded-2xl px-3 py-2">
        <span class="text-[#c7c3ea] shrink-0">☁️ ฐานข้อมูลกลาง:</span>
        <span id="cloudSyncStatusText" class="text-[#36c78c] font-bold text-right">กำลังเชื่อมต่อฐานข้อมูลกลาง...</span>
      </div>

      <button type="button" id="btnAuthSubmit" onclick="handleLogin()" class="comic-btn w-full py-3.5 bg-[#ffb98a] text-[#1e1b4b] text-base mt-1">
        เข้าใช้งานระบบ
      </button>

      <button type="button" id="btnInstallAppLogin" onclick="triggerAppInstall()" class="comic-pill w-full py-2.5 bg-[#2c2866] text-white border-[#7a76a3] text-xs font-bold flex items-center justify-center gap-1.5">
        <span>📲 ติดตั้งแอป oto ลงเครื่อง (iOS / Android / คอมฯ)</span>
      </button>
    </div>
  </div>

  <!-- Top Header -->
  <header class="top-header" id="appHeader"></header>

  <!-- Main Content -->
  <main class="main-scroll" id="appMain"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="appNav"></nav>

  <!-- Day Entry Bottom Sheet -->
  <div class="sheet-backdrop" id="daySheet" onclick="if(event.target===this) closeDaySheet()">
    <div class="sheet-card" id="daySheetContent"></div>
  </div>

  <!-- Approval Detail Sheet -->
  <div class="sheet-backdrop" id="approvalSheet" onclick="if(event.target===this) closeApprovalDetail()">
    <div class="sheet-card" id="approvalSheetContent"></div>
  </div>

  <!-- Photo Lightbox -->
  <div class="sheet-backdrop" id="photoViewer" onclick="closePhotoViewer()" style="justify-content:center; padding:18px; z-index:65;">
    <div class="comic-card p-3 bg-white max-w-full" onclick="event.stopPropagation()">
      <img id="photoViewerImg" src="" class="w-full max-h-[65vh] object-contain rounded-2xl border-2 border-[#1e1b4b]" alt="หลักฐานเช็คเอาท์" />
      <div id="photoViewerMeta" class="mt-2 px-2 py-1.5 rounded-xl bg-[#f6f5ff] border border-[#1e1b4b] text-xs font-bold text-[#1e1b4b]"></div>
      <button type="button" onclick="closePhotoViewer()" class="comic-btn w-full py-2.5 bg-[#ffb98a] text-sm mt-2.5">ปิดรูปภาพ</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-pill" id="toastPill"></div>
</div>

<!-- Firestore real-time cross-device sync (เลิกใช้ ntfy.sh) -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, getDocs, setDoc, deleteDoc, collection, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

// =====================================================================
// ★ ตั้งค่าฐานข้อมูลกลาง (Firebase / Firestore) — วาง firebaseConfig ของโปรเจกต์ตัวเองตรงนี้ ★
// ตัวอย่าง: { apiKey: "AIza...", authDomain: "xxx.firebaseapp.com", projectId: "xxx", appId: "1:123:web:abc" }
// =====================================================================
const EMBEDDED_FIREBASE_CONFIG = {
  apiKey: "AIzaSyChhnbQeF1z4_xPnjof7ggFiH0RrnpdXNQ",
  authDomain: "ogtar-71b7e.firebaseapp.com",
  projectId: "ogtar-71b7e",
  storageBucket: "ogtar-71b7e.firebasestorage.app",
  messagingSenderId: "984596630182",
  appId: "1:984596630182:web:6e912209acb063a7dd8267"
};

const LS_CFG = 'oto_firebase_config_v10';
const SEEN_KEY = 'oto_seen_v10';
const $id = (x) => document.getElementById(x);
const toast = (m) => { try { window.showToast && window.showToast(m); } catch (e) {} };
const safeId = (s) => String(s || '').replace(/[\/\s]/g, '_');

function parseCfgText(text) {
  const t = String(text || '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) return null;
  let body = t.slice(a, b + 1);
  try { return JSON.parse(body); } catch (e) {}
  try {
    body = body.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":').replace(/,\s*}/g, '}').replace(/'/g, '"');
    return JSON.parse(body);
  } catch (e) { return null; }
}

function resolveConfig() {
  if (EMBEDDED_FIREBASE_CONFIG && EMBEDDED_FIREBASE_CONFIG.projectId) return EMBEDDED_FIREBASE_CONFIG;
  if (typeof __firebase_config !== 'undefined') { try { return JSON.parse(__firebase_config); } catch (e) {} }
  try { const v = localStorage.getItem(LS_CFG); if (v) return JSON.parse(v); } catch (e) {}
  return null;
}

const BASE = (typeof __app_id !== 'undefined') ? ['artifacts', __app_id, 'public', 'data'] : [];
let db = null, cloudOn = false, pendingWrites = 0, lastError = '', smHash = '';
const first = { accounts: false, requests: false, calendar: false, settings: false };
const lastIds = { accounts: new Set(), requests: new Set(), calendar: new Set() };
let seen = { accounts: [], requests: [], calendar: [] };
try { seen = { ...seen, ...JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') }; } catch (e) {}
const persistSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} };
const photoSig = new Map();
const photoFail = new Map();

// ---------- สถานะการเชื่อมต่อ (แสดงตามจริง ไม่หลอกว่าออนไลน์) ----------
const BADGE = {
  local:      ['⚠️ ยังไม่ได้ตั้งค่าฐานข้อมูลกลาง · ข้อมูลอยู่เฉพาะเครื่องนี้', '⚠️ ไม่มีฐานข้อมูลกลาง', 'warn'],
  error:      ['⚠️ เชื่อมฐานข้อมูลไม่สำเร็จ (' + '${E}' + ') · ตรวจ Rules / Anonymous Auth', '⚠️ เชื่อมต่อผิดพลาด', 'warn'],
  offline:    ['⚠️ ออฟไลน์ · จะส่งขึ้นระบบกลางอัตโนมัติเมื่อมีเน็ต', '⚠️ ออฟไลน์', 'warn'],
  pending:    ['กำลังส่งข้อมูลขึ้นระบบกลาง…', '☁️ กำลังส่ง…', 'wait'],
  connecting: ['กำลังเชื่อมต่อฐานข้อมูล…', '☁️ เชื่อมต่อ…', 'wait'],
  online:     ['ออนไลน์ · ซิงค์ข้ามเครื่องแล้ว ✓', '☁️ ออนไลน์ ✓', 'ok']
};
function badgeKind() {
  if (!cloudOn) return 'local';
  if (lastError) return 'error';
  if (!navigator.onLine) return 'offline';
  if (pendingWrites > 0) return 'pending';
  if (!(first.accounts && first.requests && first.calendar)) return 'connecting';
  return 'online';
}
function applyBadge() {
  const k = badgeKind(), b = BADGE[k];
  const el = $id('cloudSyncStatusText');
  if (el) {
    el.textContent = b[0].replace('${E}', lastError);
    el.className = b[2] === 'ok' ? 'text-[#36c78c] font-bold text-right' : 'text-[#ffb98a] font-bold text-right';
  }
  const hb = $id('headerCloudBadge');
  if (hb) {
    hb.textContent = b[1];
    hb.className = 'text-[10px] px-2.5 py-0.5 rounded-full border border-[#1e1b4b] font-bold text-[#1e1b4b] ' +

function write(fn, ms = 4000) {
  let p;
  try { p = fn(); } catch (e) { return Promise.resolve(false); }
  pendingWrites++; applyBadge();
  const done = p.then(() => { lastError = ''; return true; })
    .catch((e) => {
      lastError = (e && e.code) || 'error';
      if (e && e.code === 'permission-denied') toast('ฐานข้อมูลปฏิเสธการบันทึก (ตรวจ Firestore Rules / เปิด Anonymous Auth)');
      return false;
    })
    .finally(() => { pendingWrites = Math.max(0, pendingWrites - 1); applyBadge(); });
  return Promise.race([done, new Promise((r) => setTimeout(() => r(false), ms))]);
}
const put = (name, id, data) => db ? write(() => setDoc(doc(db, ...BASE, name, safeId(id)), data)) : Promise.resolve(false);

function shrink(dataUrl, maxLen = 130000, maxW = 720) {
  if (!dataUrl || dataUrl.length <= maxLen) return Promise.resolve(dataUrl);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = Math.min(img.width, maxW), q = 0.72, out = dataUrl;
      for (let i = 0; i < 7; i++) {
        const c = document.createElement('canvas');
        c.width = w; c.height = Math.max(1, Math.round(img.height * w / img.width));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length <= maxLen) break;
        q = Math.max(0.4, q - 0.08); w = Math.round(w * 0.85);
      }
      resolve(out);
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  });
}
async function savePhoto(kind, id, dataUrl) {
  if (!db || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return false;
  const key = kind + '_' + id;
  const sig = dataUrl.length + ':' + dataUrl.slice(-48);
  if (photoSig.get(key) === sig) return true;
  const small = await shrink(dataUrl);
  if (!small) return false;
  photoSig.set(key, sig);
  return put('oto_photos', key, { data: small, updatedAt: Date.now() });
}

let uploading = false;
async function uploadLocalOnly(kind) {
  if (uploading || !db || !window.getAppSyncSnapshot) return;
  const u = window.getCurrentUserInfo && window.getCurrentUserInfo();
  if (!u || !u.empId) return;
  const me = u.empId.toUpperCase();
  const mine = (e) => u.manager || String(e || '').toUpperCase() === me;
  const snap = window.getAppSyncSnapshot(), tomb = snap.tombstones || {}, cloud = lastIds[kind];
  const jobs = [];
  if (kind === 'accounts') {
    Object.entries(snap.accounts || {}).forEach(([k, a]) => {
      if (!a) return;
      const id = String(a.empId || k).toUpperCase();
      if (cloud.has(safeId(id)) || (tomb.accounts || []).includes(id) || !mine(id)) return;
      jobs.push(() => window.cloudStore.saveAccount(a));
    });
  } else if (kind === 'requests') {
    (snap.requests || []).forEach((r) => {
      if (!r || !r.id || cloud.has(safeId(r.id)) || (tomb.requests || []).includes(r.id) || !mine(r.empId)) return;
      jobs.push(() => window.cloudStore.saveRequest(r));
    });
  } else {
    (snap.calendar || []).forEach((c) => {
      if (!c || !c.dateKey) return;
      const emp = String(c.empId || '').toUpperCase(), key = emp + '_' + c.dateKey;
      if (cloud.has(safeId(key)) || (tomb.calendar || []).includes(key) || !mine(emp)) return;
      jobs.push(() => window.cloudStore.saveCalendarItem(c));
    });
  }
  if (!jobs.length) return;
  uploading = true;
  try { for (const j of jobs.slice(0, 60)) await j(); } finally { uploading = false; }
  try { window.persistLocalDatabase && window.persistLocalDatabase(); } catch (e) {}
}

let photoTimer = null;

async function loadPhotos() {
  if (!db || !window.getAppSyncSnapshot) return;

  if (!u || !u.empId) return;
  const me = u.empId.toUpperCase(), snap = window.getAppSyncSnapshot();

  const need = [];
  (snap.requests || []).slice(0, 60).forEach((r) => { if (r && r.hasPhoto && !r.photo && ok(r.empId)) need.push(['req', r.id, r]); });
  (snap.calendar || []).slice(0, 120).forEach((c) => {
    if (c && c.hasPhoto && !c.photo && ok(c.empId)) need.push(['cal', String(c.empId || '').toUpperCase() + '_' + c.dateKey, c]);
  });
  let changed = false, idx = 0;
  const worker = async () => {
    while (idx < need.length) {
      const [kind, id, obj] = need[idx++];
      const key = safeId(kind + '_' + id);
      if ((photoFail.get(key) || 0) > Date.now()) continue;
      try {
        const s = await getDoc(doc(db, ...BASE, 'oto_photos', key));
        if (s.exists() && s.data().data) {
          obj.photo = s.data().data; changed = true;
          photoSig.set(kind + '_' + id, obj.photo.length + ':' + obj.photo.slice(-48));
        } else { photoFail.set(key, Date.now() + 60000); }
      } catch (e) { photoFail.set(key, Date.now() + 30000); }

    try { window.rebuildVisibleCalendarItems && window.rebuildVisibleCalendarItems(); window.renderApp && window.renderApp(); } catch (e) {}
  }
}

function listen(name, kind, applyList) {
  onSnapshot(collection(db, ...BASE, name), { includeMetadataChanges: true }, (snap) => {
    lastError = '';
    const list = [], ids = new Set();
    snap.forEach((d) => { list.push(d.data()); ids.add(d.id); });
    const server = !snap.metadata.fromCache;
    if (server) {
      const prev = seen[kind] || [];
      const suspicious = ids.size === 0 && prev.length > 2; // กันกรณีฐานข้อมูลว่างผิดปกติ ไม่ให้ลบข้อมูลในเครื่องทิ้งทั้งหมด
      if (!suspicious) {
        prev.filter((id) => !ids.has(id)).forEach((id) => applyDelete(kind, id));
        seen[kind] = Array.from(ids); persistSeen();
      }
      lastIds[kind] = ids; first[kind] = true;
    }
    try { applyList(list); } catch (e) {}
    if (server) uploadLocalOnly(kind);
    if (kind !== 'accounts') schedulePhotos();
    applyBadge();
  }, (err) => {
    lastError = (err && err.code) || 'error'; applyBadge();
    if (err && err.code === 'permission-denied') toast('ฐานข้อมูลปฏิเสธการอ่าน (ตรวจ Firestore Rules / เปิด Anonymous Auth)');
  });
}

function waitFirst(keys, ms) {
  return new Promise((res) => {
    if (!db || !navigator.onLine) return res();
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (keys.every((k) => first[k]) || Date.now() - t0 > ms) { clearInterval(iv); res(); }
    }, 100);
  });
}

(async function init() {

        experimentalAutoDetectLongPolling: true,
        ignoreUndefinedProperties: true

    try {

    listen('oto_requests', 'requests', (list) => { window.syncRequestsFromCloud(list); if (window.dedupeRequests) window.dedupeRequests(); });
    setInterval(() => { if (window.dedupeRequests) window.dedupeRequests(); }, 8000);
    listen('oto_calendar', 'calendar', (list) => window.syncCalendarFromCloud(list));
    onSnapshot(doc(db, ...BASE, 'oto_settings', 'sm'), { includeMetadataChanges: true }, (s) => {

      if (!s.metadata.fromCache) first.settings = true;
    }, () => { first.settings = true; });
  } catch (err) {
    lastError = 'init'; applyBadge();
  }
})();

  window.applyLiveEvent = function (evt) {

    const d = evt.data;

    if (evt.action === 'upsert_account') {
      const id = (d.empId || '').trim().toUpperCase();
      if (id && !deletedAccountIds.has(id)) {
        registeredAccounts[id] = {
          ...(registeredAccounts[id] || {}),
          ...d,
          empId: id,
          avatarPhoto: d.avatarPhoto || (registeredAccounts[id] && registeredAccounts[id].avatarPhoto) || ''
        };
        changed = true;
      }
    } else if (evt.action === 'delete_account') {
      const id = (d.empId || '').trim().toUpperCase();
      if (id && id !== APPROVER_ID) {
        deletedAccountIds.add(id);
        delete registeredAccounts[id];
        state.teamRequests.forEach(r => {
          if ((r.empId || '').trim().toUpperCase() === id) deletedRequestIds.add(r.id);
        });
        state.teamRequests = state.teamRequests.filter(r => (r.empId || '').trim().toUpperCase() !== id);
        allCloudCalendarItems.forEach(c => {
          if ((c.empId || '').trim().toUpperCase() === id) deletedCalendarKeys.add(`${id}_${c.dateKey}`);
        });
        allCloudCalendarItems = allCloudCalendarItems.filter(c => (c.empId || '').trim().toUpperCase() !== id);
        changed = true;
      }
    } else if (evt.action === 'upsert_request') {
      const empId = (d.empId || '').trim().toUpperCase();
      if (d.id && !deletedRequestIds.has(d.id) && !deletedAccountIds.has(empId)) {
        ensureAccountFromMeta(empId, d.firstName, d.lastName, d.mood, '');
        const idx = state.teamRequests.findIndex(r => r.id === d.id);

          state.teamRequests[idx] = {
            ...state.teamRequests[idx],
            ...d,
            photo: d.photo || state.teamRequests[idx].photo || ''
          };
        } else {
          state.teamRequests.unshift(d);
        }
        changed = true;
      }
    } else if (evt.action === 'delete_request') {
      if (d.id) {
        deletedRequestIds.add(d.id);
        state.teamRequests = state.teamRequests.filter(r => r.id !== d.id);
        changed = true;
      }
    } else if (evt.action === 'upsert_calendar') {
      const empId = (d.empId || '').trim().toUpperCase();
      if (d.dateKey && !deletedAccountIds.has(empId)) {
        ensureAccountFromMeta(empId, d.firstName, d.lastName, d.mood, '');
        const key = `${empId}_${d.dateKey}`;
        if (!deletedCalendarKeys.has(key)) {
          allCloudCalendarItems = allCloudCalendarItems.filter(c => `${(c.empId || '').trim().toUpperCase()}_${c.dateKey}` !== key);
          allCloudCalendarItems.push({ ...d, empId });
          changed = true;
        }
      }
    } else if (evt.action === 'delete_calendar') {
      const empId = (d.empId || '').trim().toUpperCase();
      if (d.dateKey) {
        const key = `${empId}_${d.dateKey}`;
        deletedCalendarKeys.add(key);
        allCloudCalendarItems = allCloudCalendarItems.filter(c => `${(c.empId || '').trim().toUpperCase()}_${c.dateKey}` !== key);
        changed = true;

    if (changed) {

  window.mergeCloudSnapshot = function (remote) {
    if (!remote || typeof remote !== 'object') return false;
    let changed = false;

    const rTomb = remote.tombstones || {};
    (rTomb.accounts || []).forEach(id => {
      const up = String(id).trim().toUpperCase();
      if (up && !deletedAccountIds.has(up)) {
        deletedAccountIds.add(up);
        changed = true;
      }
    });
    (rTomb.requests || []).forEach(id => {
      if (id && !deletedRequestIds.has(id)) {
        deletedRequestIds.add(id);
        changed = true;
      }
    });
    (rTomb.calendar || []).forEach(k => {
      if (k && !deletedCalendarKeys.has(k)) {
        deletedCalendarKeys.add(k);
        changed = true;
      }
    });

    deletedAccountIds.forEach(delId => {
      if (registeredAccounts[delId]) {
        delete registeredAccounts[delId];
        changed = true;
      }
    });

    Object.entries(remote.accounts || {}).forEach(([rawId, acc]) => {
      if (!acc) return;
      const empId = String(acc.empId || rawId).trim().toUpperCase();
      if (!empId || deletedAccountIds.has(empId)) return;
      const existing = registeredAccounts[empId];
      if (!existing || (acc.updatedAt || 0) > (existing.updatedAt || 0)) {
        registeredAccounts[empId] = {
          ...existing,
          ...acc,
          empId,
          avatarPhoto: acc.avatarPhoto || (existing && existing.avatarPhoto) || ''
        };
        changed = true;
      }
    });

    const reqMap = new Map();
    state.teamRequests.forEach(r => {
      const empUp = (r.empId || '').trim().toUpperCase();
      if (!deletedRequestIds.has(r.id) && !deletedAccountIds.has(empUp)) {
        reqMap.set(r.id, r);
      } else {
        changed = true;
      }
    });

    (remote.requests || []).forEach(r => {
      if (!r || !r.id) return;
      const empUp = (r.empId || '').trim().toUpperCase();
      if (deletedRequestIds.has(r.id) || deletedAccountIds.has(empUp)) return;
      if (ensureAccountFromMeta(empUp, r.firstName, r.lastName, r.mood, '')) changed = true;
      const localReq = reqMap.get(r.id);
      if (!localReq || (r.updatedAt || 0) > (localReq.updatedAt || 0) || (localReq.status === 'submitted' && r.status !== 'submitted')) {
        reqMap.set(r.id, {
          ...localReq,
          ...r,
          photo: r.photo || (localReq && localReq.photo) || ''
        });
        changed = true;
      }
    });
    state.teamRequests = Array.from(reqMap.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    const calMap = new Map();
    allCloudCalendarItems.forEach(c => {
      const empUp = (c.empId || '').trim().toUpperCase();
      const key = `${empUp}_${c.dateKey}`;
      if (!deletedCalendarKeys.has(key) && !deletedAccountIds.has(empUp)) {
        calMap.set(key, c);
      } else {
        changed = true;
      }
    });

    (remote.calendar || []).forEach(c => {
      if (!c || !c.dateKey) return;
      const empUp = (c.empId || '').trim().toUpperCase();
      const key = `${empUp}_${c.dateKey}`;
      if (deletedCalendarKeys.has(key) || deletedAccountIds.has(empUp)) return;
      if (ensureAccountFromMeta(empUp, c.firstName, c.lastName, c.mood, '')) changed = true;
      const localCal = calMap.get(key);

        calMap.set(key, {
          ...localCal,
          ...c,
          photo: c.photo || (localCal && localCal.photo) || ''
        });
        changed = true;
      }
    });
    allCloudCalendarItems = Array.from(calMap.values());

    if (changed) {

  // กติกา OT: ทำงานปกติ 8 ชม. + พัก 1 ชม. = 9 ชม. ชั่วโมงที่เกินจากนั้นจึงนับเป็น OT
  const WORK_STD_HOURS = 8;
  const BREAK_HOURS = 1;

  // เวลาทำงานรวมทั้งหมด (เข้างาน → เลิกงาน) รวมเวลาพัก
  function calcWorkHours(tIn, tOut) {
    if (!tIn || !tOut) return 0;
    const [h1, m1] = tIn.split(':').map(Number);
    const [h2, m2] = tOut.split(':').map(Number);
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 0) diff += 24 * 60;
    return Math.round((diff / 60) * 100) / 100;
  }

  // ชั่วโมง OT = เวลาทำงานรวม − (8 + 1 พัก) ถ้าไม่เกิน 9 ชม. = 0
  function calcHours(tIn, tOut) {
    const work = calcWorkHours(tIn, tOut);
    return Math.max(0, Math.round((work - (WORK_STD_HOURS + BREAK_HOURS)) * 100) / 100);
  }

  // OT ของคำขอหนึ่งรายการ — คำนวณจากเวลาเข้า-เลิกด้วยกติกาปัจจุบันเสมอ (รายการเก่าก็ใช้กติกาเดียวกัน)
  function otHoursOf(r) {
    if (!r || r.type !== 'ot') return 0;
    if (r.timeIn && r.timeOut) return calcHours(r.timeIn, r.timeOut);
    return Number(r.hours) || 0;
  }
  function fmtH(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  function formatThaiShort(dateKey) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-').map(Number);
    return `${d} ${THAI_MONTHS_SHORT[m - 1]} ${y + 543}`;
  }

  function formatThaiFull(dateKey) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return `วัน${THAI_DAYS_FULL[dt.getDay()]}ที่ ${d} ${THAI_MONTHS[m - 1]} ${y + 543}`;
  }

  function rebuildVisibleCalendarItems() {
    let metaChanged = false;
    state.teamRequests.forEach(r => {
      if (ensureAccountFromMeta(r.empId, r.firstName, r.lastName, r.mood, '')) {
        metaChanged = true;
      }
    });

    const nextItems = {};
    const myId = (state.user?.empId || '').trim().toUpperCase();
    const manager = isManager();
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));
    let synthesizedCount = 0;

    allCloudCalendarItems.forEach((it) => {
      const itemEmp = (it.empId || '').trim().toUpperCase();
      if (itemEmp && itemEmp !== APPROVER_ID && deletedAccountIds.has(itemEmp)) return;
      if (itemEmp && itemEmp !== APPROVER_ID && ensureAccountFromMeta(itemEmp, it.firstName, it.lastName, it.mood, '')) {
        metaChanged = true;
      }
      if (manager || itemEmp === myId) {
        nextItems[it.dateKey] = it;
      }

      if (itemEmp && itemEmp !== APPROVER_ID) {
        const autoReqId = `auto-${itemEmp}-${it.dateKey}-${it.type || 'ot'}`;
        const alreadyExists = state.teamRequests.some(
          r => r.id === autoReqId || ((r.empId || '').trim().toUpperCase() === itemEmp && r.from === it.dateKey && r.type === (it.type || 'ot'))
        );
        if (!alreadyExists && !deletedRequestIds.has(autoReqId)) {
          const acc = registeredAccounts[itemEmp] || {};
          const isOt = (it.type || 'ot') === 'ot';
          state.teamRequests.unshift({
            id: autoReqId,
            firstName: acc.firstName || it.firstName || `พนักงาน ${itemEmp}`,
            lastName: acc.lastName || it.lastName || '',
            empId: itemEmp,
            approverId: APPROVER_ID,
            type: isOt ? 'ot' : 'leave',
            from: it.dateKey,
            to: it.to || it.dateKey,
            timeIn: it.timeIn || '18:00',
            timeOut: it.timeOut || '21:00',
            checkoutTime: it.checkoutTime || '',
            checkoutLocation: it.checkoutLocation || '',
            hours: isOt ? calcHours(it.timeIn || '18:00', it.timeOut || '21:00') : 0,
            note: it.note || (isOt ? 'ปฏิบัติงานล่วงเวลา (OT)' : 'ลาพักร้อน'),
            photo: it.photo || '',
            mood: it.mood || 'happy',
            updatedAt: Date.now(),
            status: 'submitted'
          });
          synthesizedCount += 1;
        }

  async function verifySmPassword(pass) {
    const cs = window.cloudStore;
    if (cs && cs.isReady() && !cs.settingsReady()) return 'wait';
    const h = await otoHash(APPROVER_ID, pass);
    const cloudHash = (cs && cs.getSmHash && cs.getSmHash()) || '';
    if (cloudHash) return h === cloudHash;
    const legacy = localStorage.getItem(LS_KEYS.smPass);
    if (legacy && pass === legacy) {
      if (cs && cs.isReady()) cs.setSmHash(h);
      return true;
    }
    return h === DEFAULT_SM_HASH;
  }

  async function handleLogin() {
    const empId = (document.getElementById('inpEmpId').value || '').trim().toUpperCase();
    const pass = (document.getElementById('inpPassword').value || '').trim();
    const first = (document.getElementById('inpFirst').value || '').trim();
    const last = (document.getElementById('inpLast').value || '').trim();

    if (!empId) {
      showToast('กรุณากรอกรหัสพนักงาน');
      return;
    }

    if (window.cloudStore && window.cloudStore.pullFromCloud) {
      await window.cloudStore.pullFromCloud(false);
    }

    if (empId === APPROVER_ID) {
      const smOk = await verifySmPassword(pass);
      if (smOk !== true) {
        showToast(smOk === 'wait' ? 'กำลังเชื่อมต่อฐานข้อมูล กรุณากดเข้าสู่ระบบอีกครั้ง' : 'รหัสผ่าน SM ไม่ถูกต้อง');
        return;
      }
      const existingSm = registeredAccounts[APPROVER_ID] || {};
      state.user = {
        empId: APPROVER_ID,
        firstName: 'นาย ณัฐวุฒิ',
        lastName: 'ชุมหิรัญ',
        mood: existingSm.mood || 'happy',
        avatarPhoto: existingSm.avatarPhoto || ''
      };
      window.persistLocalDatabase();
      enterAuthenticatedApp();
      return;
    }

    if (authMode === 'register') {
      if (!first) {
        showToast('กรุณากรอกชื่อพนักงาน');
        return;
      }
      if (!pass) {
        showToast('กรุณาตั้งรหัสผ่าน');
        return;
      }
      const dup = registeredAccounts[empId] || (window.cloudStore && window.cloudStore.fetchAccount ? await window.cloudStore.fetchAccount(empId) : null);
      if (dup && (dup.pwHash || dup.password)) {
        showToast('รหัสพนักงานนี้มีผู้ใช้งานแล้ว กรุณากดเข้าสู่ระบบ หรือใช้รหัสอื่น');
        return;
      }
      if (deletedAccountIds.has(empId)) {
        deletedAccountIds.delete(empId);
      }
      const acc = {
        empId,
        firstName: first,
        lastName: last,
        pwHash: await otoHash(empId, pass),
        mood: 'happy',
        avatarPhoto: '',
        updatedAt: Date.now()
      };
      registeredAccounts[empId] = acc;
      state.user = { ...acc };
      window.persistLocalDatabase();
      if (window.cloudStore) await window.cloudStore.saveAccount(acc);
      showToast(window.__otoCloudOn ? `✨ สร้างรหัส ${empId} สำเร็จ! ส่งขึ้นระบบกลางแล้ว` : `✨ สร้างรหัส ${empId} สำเร็จ! (บันทึกในเครื่องนี้ ยังไม่ได้เชื่อมฐานข้อมูลกลาง)`);
      enterAuthenticatedApp();
      return;
    }

    let acc = registeredAccounts[empId];
    if (!acc && window.cloudStore && window.cloudStore.fetchAccount) {
      acc = await window.cloudStore.fetchAccount(empId);
    }
    if (!acc) {
      showToast('ไม่พบรหัสพนักงานนี้ กดปุ่ม "✨ สร้างรหัสพนักงาน" ด้านบนเพื่อลงทะเบียน');
      return;
    }
    if (acc.pwHash) {
      if ((await otoHash(empId, pass)) !== acc.pwHash) {
        showToast('รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');
        return;
      }
    } else {
      if (acc.password && pass !== acc.password) {
        showToast('รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');
        return;
      }
      if (!pass) {
        showToast('บัญชีนี้ยังไม่มีรหัสผ่าน กรุณาพิมพ์รหัสผ่านใหม่ที่ต้องการตั้ง');
        return;
      }
      acc.pwHash = await otoHash(empId, pass);
      delete acc.password;
      acc.updatedAt = Date.now();
      registeredAccounts[empId] = acc;
      window.persistLocalDatabase();
      if (window.cloudStore) window.cloudStore.saveAccount(acc);
    }

    state.user = { ...acc };
    window.persistLocalDatabase();
    enterAuthenticatedApp();
  }

  // =========================================================================

  // =========================================================================
  function getLeaveDateMap() {
    const map = {};
    const activeIds = new Set(Object.keys(registeredAccounts).map(k => k.trim().toUpperCase()));

    const addRange = (fromStr, toStr, info) => {
      if (!fromStr) return;
      const start = new Date(fromStr + 'T00:00:00');
      const end = new Date((toStr || fromStr) + 'T00:00:00');
      if (isNaN(start.getTime())) return;
      const cur = new Date(start);
      let guard = 0;
      while (cur <= end && guard < 60) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const d = String(cur.getDate()).padStart(2, '0');
        map[`${y}-${m}-${d}`] = info;
        cur.setDate(cur.getDate() + 1);
        guard++;
      }
    };

    const myId = (state.user?.empId || '').trim().toUpperCase();
    const manager = isManager();

    state.teamRequests.forEach(r => {
      if (r.type !== 'leave' || r.status === 'rejected') return;
      const empUp = (r.empId || '').trim().toUpperCase();
      if (activeIds.size > 0 && !activeIds.has(empUp)) return;
      if (manager || empUp === myId) {
        addRange(r.from, r.to, { empId: empUp, firstName: r.firstName, mood: r.mood || 'calm' });
      }
    });

    Object.values(state.items).forEach(it => {
      if (it.type === 'leave') {
        const empUp = (it.empId || '').trim().toUpperCase();
        if (activeIds.size > 0 && empUp && !activeIds.has(empUp)) return;
        addRange(it.dateKey, it.to || it.dateKey, { empId: empUp, mood: it.mood || 'calm' });
      }
    });

    return map;
  }

  function renderCalendarTab() {
    const year = state.viewYear;
    const month = state.viewMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const leaveMap = getLeaveDateMap();

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    let totalOtHours = 0;
    let totalLeaveDays = 0;
    const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;

    Object.values(state.items).forEach(it => {
      if (it.dateKey && it.dateKey.startsWith(monthPrefix) && it.type === 'ot') {
        totalOtHours += calcHours(it.timeIn, it.timeOut);
      }
    });
    Object.keys(leaveMap).forEach(dk => {
      if (dk.startsWith(monthPrefix)) totalLeaveDays += 1;
    });

    const cells = [];
    for (let i = firstDay - 1; i >= 0; i--) {
      cells.push(`<div class="day-cell other-month"><span class="text-xs font-bold">${prevDays - i}</span></div>`);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const item = state.items[dateKey];
      const leaveInfo = leaveMap[dateKey];
      const isToday = dateKey === todayKey;

      let extraClass = '';
      let middleContent = '';
      let bottomBadge = '';

      const iconIdx = (d + state.iconSeed) % COSMIC_ICONS.length;
      const iconId = (item && item.icon) || COSMIC_ICONS[iconIdx].id;

      if (leaveInfo) {
        extraClass = 'has-leave';
        middleContent = `<div class="w-6 h-6 rounded-lg bg-[#1e1b4b] flex items-center justify-center">${renderCosmicSvg(iconId, 16)}</div>`;
        bottomBadge = `<span class="day-badge-leave text-[8px] leading-tight font-bold px-1 py-0.2 rounded border">ลาพักร้อน</span>`;
      } else if (item && item.type === 'ot') {
        extraClass = 'has-ot';
        const hrs = calcHours(item.timeIn, item.timeOut);
        middleContent = `<div class="w-6 h-6 rounded-lg bg-[#1e1b4b] flex items-center justify-center">${renderCosmicSvg(iconId, 16)}</div>`;
        bottomBadge = `<span class="text-[9px] font-bold px-1.5 rounded-full bg-white border border-[#1e1b4b] text-[#1e1b4b]">+${fmtH(hrs)}ชม.</span>`;
      }

      cells.push(`
        <div class="day-cell ${isToday ? 'is-today' : ''} ${extraClass}" onclick="openDaySheet('${dateKey}')">
          <span class="day-num text-xs font-bold text-[#1e1b4b]">${d}</span>
          ${middleContent}
          ${bottomBadge}
        </div>
      `);
    }

    const totalSlots = Math.ceil(cells.length / 7) * 7;
    let nextDay = 1;
    while (cells.length < totalSlots) {
      cells.push(`<div class="day-cell other-month"><span class="text-xs font-bold">${nextDay++}</span></div>`);
    }

    return `
      <div class="comic-card p-3.5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-[#1e1b4b]">${THAI_MONTHS[month]} ${year + 543}</h2>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="shuffleIcons()" class="comic-pill px-2.5 py-1 text-[11px] bg-white">🎲 สุ่มไอคอน</button>
            <button type="button" onclick="changeMonth(-1)" class="w-7 h-7 rounded-full border-2 border-[#1e1b4b] bg-white font-bold text-xs flex items-center justify-center">‹</button>
            <button type="button" onclick="changeMonth(1)" class="w-7 h-7 rounded-full border-2 border-[#1e1b4b] bg-white font-bold text-xs flex items-center justify-center">›</button>
          </div>
        </div>

        <div class="grid grid-cols-7 text-center text-[11px] font-bold text-[#7a76a3] mb-1.5">
          ${THAI_DAYS_SHORT.map(d => `<div>${d}</div>`).join('')}
        </div>

        <div class="grid grid-cols-7 gap-1.5">
          ${cells.join('')}
        </div>

        <div class="mt-3 pt-2.5 border-t border-dashed border-[#c7c3ea] flex items-center justify-between text-xs font-bold">
          <div class="flex items-center gap-3">
            <span>⚡ OT รวม: <span class="text-[#4f46e5]">${fmtH(totalOtHours)} ชม.</span></span>
            <span>🌴 ลาพักร้อน: <span class="text-[#0d9488]">${totalLeaveDays} วัน</span></span>
          </div>
          ${isManager()
            ? `<span class="px-2.5 py-1 rounded-full bg-[#ffe6d3] border border-[#1e1b4b] text-[10px]">🔒 SM ดูอย่างเดียว</span>`
            : `<button type="button" onclick="goToday()" class="comic-pill px-3 py-1 text-[11px] bg-white">วันนี้</button>`
          }
        </div>
      </div>

      ${isManager() ? `
        <div class="comic-card p-3 mt-3 bg-[#f0efff] text-center text-xs font-semibold text-[#1e1b4b]">
          🛡️ สิทธิ์ผู้อนุมัติ <b>SM2080797</b> ไม่สามารถบันทึกหรือแก้ไขเวลาของใครได้ · ไปที่แท็บ <b>อนุมัติ</b> เพื่อตรวจสอบคำขอ
        </div>
      ` : ''}
    `;
  }

  function stopLiveCamera() {

  async function fetchCurrentGpsLocation() {
    const locEl = document.getElementById('gpsStatusLabel');
    if (locEl) locEl.textContent = 'กำลังดึงพิกัด GPS...';

    if (!navigator.geolocation) {
      currentCheckoutLocation = 'ไม่รองรับ GPS บนอุปกรณ์นี้';
      if (locEl) locEl.textContent = currentCheckoutLocation;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude.toFixed(5);
        const lon = pos.coords.longitude.toFixed(5);
        currentCheckoutLocation = `พิกัด ${lat}, ${lon}`;
        currentGpsCoords = `${lat}, ${lon}`;
        try {
          const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}&accept-language=th`);
          if (resp.ok) {
            const geo = await resp.json();
            const ad = (geo && geo.address) || {};
            const l1 = [[ad.house_number, ad.road].filter(Boolean).join(' '), ad.neighbourhood || ad.suburb].filter(Boolean).join(' ');
            const l2 = [ad.city_district || ad.county || ad.city || ad.town, ad.state, ad.postcode].filter(Boolean).join(' ');
            const addr = [l1, l2].filter(Boolean).join(' ').trim();
            if (addr) {
              currentCheckoutAddress = addr;
              currentCheckoutLocation = addr;
            } else if (geo && geo.display_name) {
              currentCheckoutAddress = geo.display_name.split(',').slice(0, 4).join(' ').trim();
              currentCheckoutLocation = currentCheckoutAddress;
            }
          }
        } catch (e) {}
        if (locEl) locEl.textContent = `📍 ${currentCheckoutLocation}`;
      },
      () => {
        currentCheckoutLocation = 'ไม่สามารถเข้าถึง GPS (กรุณาเปิดสิทธิ์ตำแหน่ง)';
        if (locEl) locEl.textContent = currentCheckoutLocation;
      },
      { enableHighAccuracy: true, timeout: 7000 }
    );
  }

  function openDaySheet(dateKey) {

      const existing = state.items[dateKey];
      if (!existing) {
        showToast('สิทธิ์ผู้อนุมัติ SM2080797 ไม่สามารถบันทึกหรือแก้ไขเวลาของใครได้');
        return;
      }
      const req = state.teamRequests.find(r => r.from === dateKey && (r.empId || '').toUpperCase() === (existing.empId || '').toUpperCase());
      if (req) {
        openApprovalDetail(req.id);
      } else {
        showToast(`รายการวันที่ ${formatThaiShort(dateKey)} (${existing.empId || ''})`);
      }
      return;
    }

    stopLiveCamera();
    editingDateKey = dateKey;
    const existing = state.items[dateKey];

    currentPhoto = (existing && existing.photo) ? existing.photo : '';
    currentCheckoutTime = (existing && existing.checkoutTime) ? existing.checkoutTime : '';
    currentCheckoutLocation = (existing && existing.checkoutLocation) ? existing.checkoutLocation : '';
    editingType = existing ? existing.type : 'ot';
    editingMood = existing ? (existing.mood || 'happy') : 'happy';
    currentCheckoutAddress = '';
    currentGpsCoords = '';
    draft = {
      timeIn: (existing && existing.timeIn) || '',
      timeOut: (existing && existing.timeOut) || '',

      leaveFrom: dateKey,

  const TH_DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  function thaiNowParts() {
    const now = new Date();
    const th = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 7 * 3600000);
    return {
      hh: String(th.getHours()).padStart(2, '0'),
      mm: String(th.getMinutes()).padStart(2, '0'),
      dow: TH_DOW[th.getDay()],
      d: String(th.getDate()).padStart(2, '0'),
      mon: TH_MON[th.getMonth()],
      y: th.getFullYear() + 543
    };
  }

  function makeStampCode() {
    const base = Date.now().toString(36) + ((state.user && state.user.empId) || '');
    return base.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(-12);
  }

  function rrPath(ctx, x, y, w, h, tl, tr, br, bl) {
    ctx.beginPath();
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    if (tr) ctx.arcTo(x + w, y, x + w, y + tr, tr);
    ctx.lineTo(x + w, y + h - br);
    if (br) ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
    ctx.lineTo(x + bl, y + h);
    if (bl) ctx.arcTo(x, y + h, x, y + h - bl, bl);
    ctx.lineTo(x, y + tl);
    if (tl) ctx.arcTo(x, y, x + tl, y, tl);
    ctx.closePath();
  }

  function wrapText(ctx, text, maxW) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    words.forEach((w) => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) { cur = t; return; }
      if (cur) lines.push(cur);
      if (ctx.measureText(w).width <= maxW) { cur = w; return; }
      let part = '';
      for (const ch of w) {
        if (ctx.measureText(part + ch).width > maxW) { lines.push(part); part = ch; } else { part += ch; }
      }
      cur = part;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  // ประทับเวลา/วันที่/ที่อยู่ลงบนภาพ ตามสไตล์แอปตอกบัตร (ป้ายเหลือง + เวลาใหญ่ + วันที่ + ที่อยู่)
  function drawStamp(ctx, W, H) {
    const p = thaiNowParts();
    const u = W / 667;
    const FONT = 'Kanit, Anuphan, sans-serif';
    ctx.save();
    const g = ctx.createLinearGradient(0, H * 0.5, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H * 0.5, W, H * 0.5);

    const x0 = 16 * u, tx = x0 + 14 * u;
    const addr = currentCheckoutAddress || (/^พิกัด/.test(currentCheckoutLocation || '') ? currentCheckoutLocation : 'ไม่พบตำแหน่ง GPS');
    ctx.font = `500 ${22 * u}px ${FONT}`;
    const lines = wrapText(ctx, addr, W * 0.74).slice(0, 3);
    const coordLine = currentGpsCoords ? `Lat/Long ${currentGpsCoords}` : '';
    const rows = lines.length + (coordLine ? 1 : 0);
    const lh = 29 * u;
    const footBase = H - 14 * u;
    const addrBottom = footBase - 36 * u;
    const addrTop = addrBottom - rows * lh;
    const dateBase = addrTop - 8 * u;
    const dateTop = dateBase - 30 * u;
    const pillH = 54 * u;
    const pillY = dateTop - 14 * u - pillH;

    const lab = 'เช็คเอาท์';
    ctx.font = `700 ${27 * u}px ${FONT}`;
    const lw = ctx.measureText(lab).width + 30 * u;
    const tm = `${p.hh}:${p.mm}`;
    ctx.font = `700 ${42 * u}px ${FONT}`;
    const tw = ctx.measureText(tm).width + 30 * u;
    rrPath(ctx, x0, pillY, lw, pillH, 10 * u, 0, 0, 10 * u);
    ctx.fillStyle = '#FFC21A'; ctx.fill();
    rrPath(ctx, x0 + lw, pillY, tw, pillH, 0, 10 * u, 10 * u, 0);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1b1740';
    ctx.font = `700 ${27 * u}px ${FONT}`;
    ctx.fillText(lab, x0 + 15 * u, pillY + pillH / 2 + 1 * u);
    ctx.font = `700 ${42 * u}px ${FONT}`;
    ctx.fillText(tm, x0 + lw + 15 * u, pillY + pillH / 2 + 1 * u);

    ctx.fillStyle = '#FFA21A';
    ctx.fillRect(x0, dateTop, 4 * u, addrBottom - dateTop);

    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 5 * u;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `700 ${28 * u}px ${FONT}`;
    ctx.fillText(`${p.dow}, ${p.d} ${p.mon} ${p.y}`, tx, dateBase);
    ctx.font = `500 ${22 * u}px ${FONT}`;
    lines.forEach((ln, i) => ctx.fillText(ln, tx, addrTop + (i + 1) * lh - 7 * u));
    if (coordLine) {
      ctx.font = `400 ${17 * u}px ${FONT}`;
      ctx.fillText(coordLine, tx, addrTop + rows * lh - 8 * u);
    }

    ctx.fillStyle = '#36C78C';
    ctx.beginPath(); ctx.arc(x0 + 9 * u, footBase - 7 * u, 9 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `700 ${13 * u}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('✓', x0 + 9 * u, footBase - 2.5 * u);
    ctx.textAlign = 'left';
    ctx.font = `500 ${18 * u}px ${FONT}`;
    ctx.fillText('oto บันทึกเวลา & ตำแหน่ง', x0 + 26 * u, footBase);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFB98A';
    ctx.font = `700 ${34 * u}px ${FONT}`;
    ctx.fillText('oto', W - 18 * u, footBase - 22 * u);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `500 ${16 * u}px ${FONT}`;
    ctx.fillText('ภาพจริง 100%', W - 18 * u, footBase);

    ctx.shadowBlur = 0;
    ctx.save();
    ctx.translate(W - 20 * u, 34 * u);
    ctx.rotate(Math.PI / 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = `500 ${15 * u}px ${FONT}`;
    ctx.fillText(`● oto Timestamp · ${stampCode || 'OTO'}`, 0, 0);
    ctx.restore();
    ctx.restore();
  }

  function paintFrame(ctx, src, W, H) {
    ctx.save();
    if (cameraMirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(src, 0, 0, W, H);
    ctx.restore();
  }

  function startCameraLoop() {
    const v = document.getElementById('liveCameraVideo');
    const c = document.getElementById('liveCameraCanvas');
    if (!v || !c) return;
    let last = 0;
    const loop = (ts) => {
      if (!activeCameraStream) return;
      if (ts - last > 45 && v.videoWidth) {
        last = ts;
        const W = Math.min(v.videoWidth, 720);
        const H = Math.round(v.videoHeight * W / v.videoWidth);
        if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
        const ctx = c.getContext('2d');
        paintFrame(ctx, v, W, H);
        drawStamp(ctx, W, H);
      }
      cameraRaf = requestAnimationFrame(loop);
    };
    cameraRaf = requestAnimationFrame(loop);
  }

  async function startLiveCamera(facing) {
    cameraFacingMode = facing || 'environment';
    stampCode = makeStampCode();
    fetchCurrentGpsLocation();
    try {
      stopLiveCamera();
      if (document.fonts && document.fonts.load) {
        try { await Promise.all([document.fonts.load('700 24px Kanit'), document.fonts.load('500 22px Kanit')]); } catch (e) {}
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: cameraFacingMode, width: { ideal: 1280 } },
        audio: false
      });
      activeCameraStream = stream;
      const camBox = document.getElementById('liveCameraContainer');
      const videoEl = document.getElementById('liveCameraVideo');
      if (camBox && videoEl) {
        camBox.classList.remove('hidden');
        videoEl.srcObject = stream;
        try { await videoEl.play(); } catch (e) {}
        startCameraLoop();
      }
    } catch (err) {
      showToast('ไม่สามารถเปิดกล้องสดได้ กรุณากดเลือกรูปจากอัลบั้มด้านล่าง');
    }
  }

  function switchCameraFacing() {
    const nextFacing = cameraFacingMode === 'environment' ? 'user' : 'environment';
    startLiveCamera(nextFacing);
  }

  function toggleCameraMirror() {
    cameraMirror = !cameraMirror;
    showToast(cameraMirror ? 'กลับภาพซ้าย-ขวา: เปิด' : 'กลับภาพซ้าย-ขวา: ปิด (ภาพที่บันทึกตรงกับที่เห็น)');
  }

  function captureLivePhoto() {
    const v = document.getElementById('liveCameraVideo');
    if (!v || !v.videoWidth) { showToast('กล้องยังไม่พร้อม กรุณารอสักครู่'); return; }
    const W = Math.min(v.videoWidth, 960);
    const H = Math.round(v.videoHeight * W / v.videoWidth);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    paintFrame(ctx, v, W, H);
    const p = thaiNowParts();
    currentCheckoutTime = `${p.hh}:${p.mm}`;
    drawStamp(ctx, W, H);
    currentPhoto = c.toDataURL('image/jpeg', 0.8);
    stopLiveCamera();
    renderDaySheet();
  }

  function handleFilePhotoUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
        const W = Math.min(iw, 960);
        const H = Math.round(ih * W / iw);
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);
        stampCode = makeStampCode();
        const p = thaiNowParts();
        currentCheckoutTime = `${p.hh}:${p.mm}`;
        drawStamp(ctx, W, H);
        currentPhoto = c.toDataURL('image/jpeg', 0.8);
        event.target.value = '';
        renderDaySheet();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearCheckoutPhoto() {
    currentPhoto = '';
    currentCheckoutTime = '';
    const fileInput = document.getElementById('inpFilePhoto');
    if (fileInput) fileInput.value = '';
    renderDaySheet();
  }

  function escAttr(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function captureDraft() {
    const g = (id) => document.getElementById(id);
    if (g('inpTimeIn')) draft.timeIn = g('inpTimeIn').value;
    if (g('inpTimeOut')) draft.timeOut = g('inpTimeOut').value;
    if (g('inpNote')) draft.note = g('inpNote').value;
    if (g('inpLeaveFrom')) draft.leaveFrom = g('inpLeaveFrom').value;
    if (g('inpLeaveTo')) draft.leaveTo = g('inpLeaveTo').value;
  }

  function isHHMM(t) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(t || ''); }

  function entryValidation() {
    captureDraft();
    const missing = [];
    let total;
    if (editingType === 'ot') {
      total = 4;
      const okIn = isHHMM(draft.timeIn), okOut = isHHMM(draft.timeOut);
      if (!okIn) missing.push('เวลาเข้างาน');
      if (!okOut) missing.push('เวลาเลิกงาน');
      else if (okIn && calcWorkHours(draft.timeIn, draft.timeOut) <= 0) missing.push('เวลาเลิกต้องหลังเวลาเข้า');
      else if (okIn && calcHours(draft.timeIn, draft.timeOut) <= 0) missing.push('ต้องทำงานเกิน 9 ชม. (รวมพัก) จึงจะมี OT');
      if (!(draft.note || '').trim()) missing.push('หมายเหตุ');
      if (!currentPhoto) missing.push('รูปถ่าย');
    } else {
      total = 2;
      if (!draft.leaveFrom) missing.push('วันที่เริ่มลา');
      if (!draft.leaveTo) missing.push('ถึงวันที่');
      else if (draft.leaveFrom && draft.leaveTo < draft.leaveFrom) missing.push('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม');
    }
    return { ok: missing.length === 0, missing, total, done: Math.max(0, total - missing.length) };
  }

  function refreshSaveState() {
    const btn = document.getElementById('btnSaveEntry');
    const pg = document.getElementById('entryProgress');
    if (!btn) return;
    const v = entryValidation();
    const pv = document.getElementById('otPreview');
    if (pv && editingType === 'ot') {
      if (!isHHMM(draft.timeIn) || !isHHMM(draft.timeOut)) {
        pv.innerHTML = '⏱️ กรอกเวลาเข้า–เลิกงาน ระบบจะหักพัก 1 ชม. และนับ OT เมื่อทำงานเกิน 8 ชม. (รวมพัก = 9 ชม.)';
      } else {
        const w = calcWorkHours(draft.timeIn, draft.timeOut);
        const ot = calcHours(draft.timeIn, draft.timeOut);
        pv.innerHTML = `ทำงานรวม <b>${fmtH(w)}</b> ชม. − เวลาปกติ 9 ชม. (8 + พัก 1) = OT <b style="color:${ot > 0 ? '#4f46e5' : '#e11d48'}">${fmtH(ot)} ชม.</b>`;
      }
    }
    btn.disabled = !v.ok || savingEntry;
    if (pg) {
      pg.textContent = v.ok ? 'กรอกครบแล้ว ✓ พร้อมส่งคำขอ' : `กรอกแล้ว ${v.done}/${v.total} · ยังขาด: ${v.missing.join(', ')}`;
      pg.style.color = v.ok ? '#0d9488' : '#e11d48';
    }
  }

  function dropPendingDuplicates(empId, type, from) {
    const removed = state.teamRequests.filter(r => (r.empId || '').toUpperCase() === empId && r.type === type && r.from === from && r.status !== 'approved');
    removed.forEach(r => {
      deletedRequestIds.add(r.id);
      if (window.cloudStore) window.cloudStore.deleteRequest(r.id);
    });
    state.teamRequests = state.teamRequests.filter(r => !removed.includes(r));
  }

  async function saveCurrentEntry() {
    if (!state.user || isManager() || savingEntry) return;
    const empId = state.user.empId.trim().toUpperCase();
    captureDraft();
    const v = entryValidation();
    if (!v.ok) { showToast('กรุณากรอกให้ครบ: ' + v.missing.join(', ')); refreshSaveState(); return; }

    const isOt = editingType === 'ot';
    const key = isOt ? editingDateKey : draft.leaveFrom;
    const approved = state.teamRequests.find(r => (r.empId || '').toUpperCase() === empId && r.type === (isOt ? 'ot' : 'leave') && r.from === key && r.status === 'approved');
    if (approved) { showToast('วันนี้ได้รับอนุมัติแล้ว แก้ไขหรือส่งซ้ำไม่ได้'); return; }

    savingEntry = true;
    refreshSaveState();
    try {
      if (!registeredAccounts[empId] && !deletedAccountIds.has(empId)) {
        registeredAccounts[empId] = {
          empId,
          firstName: state.user.firstName || `พนักงาน ${empId}`,
          lastName: state.user.lastName || '',
          pwHash: state.user.pwHash || '',
          mood: state.user.mood || 'happy',
          avatarPhoto: state.user.avatarPhoto || '',
          updatedAt: Date.now()
        };
      }
      const rid = (t) => `req-${empId}-${key}-${t}-${Date.now()}`;
      let calItem, reqObj, msg;

      if (isOt) {
        const timeIn = draft.timeIn, timeOut = draft.timeOut, note = draft.note.trim();
        const hours = calcHours(timeIn, timeOut);
        calItem = {
          dateKey: editingDateKey, empId, firstName: state.user.firstName, lastName: state.user.lastName,
          type: 'ot', timeIn, timeOut, note, mood: editingMood, photo: currentPhoto,
          checkoutTime: currentCheckoutTime, checkoutLocation: currentCheckoutLocation, updatedAt: Date.now()
        };
        reqObj = {
          id: rid('ot'), firstName: state.user.firstName, lastName: state.user.lastName, empId, approverId: APPROVER_ID,
          type: 'ot', from: editingDateKey, to: editingDateKey, timeIn, timeOut, hours, workHours: calcWorkHours(timeIn, timeOut), note, mood: editingMood,
          photo: currentPhoto, checkoutTime: currentCheckoutTime, checkoutLocation: currentCheckoutLocation,
          updatedAt: Date.now(), status: 'submitted'
        };
        dropPendingDuplicates(empId, 'ot', editingDateKey);
        msg = `ส่งคำขอทำโอที +${fmtH(hours)} ชม. ไปที่ SM2080797 แล้ว`;
      } else {
        const from = draft.leaveFrom, to = draft.leaveTo, note = (draft.note || '').trim() || 'ลาพักร้อน';
        const prev = state.items[editingDateKey];
        if (prev && prev.type === 'leave' && from !== editingDateKey) {
          dropPendingDuplicates(empId, 'leave', editingDateKey);
          allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empId && c.dateKey === editingDateKey));
          if (window.cloudStore) window.cloudStore.deleteCalendarItem(empId, editingDateKey);
        }
        calItem = {
          dateKey: from, to, empId, firstName: state.user.firstName, lastName: state.user.lastName,
          type: 'leave', note, mood: editingMood, updatedAt: Date.now()
        };
        reqObj = {
          id: rid('leave'), firstName: state.user.firstName, lastName: state.user.lastName, empId, approverId: APPROVER_ID,
          type: 'leave', from, to, hours: 0, note, mood: editingMood, updatedAt: Date.now(), status: 'submitted'
        };
        dropPendingDuplicates(empId, 'leave', from);
        msg = `ส่งคำขอลาพักร้อน (${formatThaiShort(from)} – ${formatThaiShort(to)}) ไปที่ SM2080797 แล้ว`;
      }

      allCloudCalendarItems = allCloudCalendarItems.filter(c => !((c.empId || '').toUpperCase() === empId && c.dateKey === calItem.dateKey));
      allCloudCalendarItems.push(calItem);
      state.teamRequests.unshift(reqObj);

      window.persistLocalDatabase();
      rebuildVisibleCalendarItems();
      closeDaySheet();
      renderApp();
      showToast(msg);

      if (window.cloudStore) {
        await Promise.all([
          window.cloudStore.saveAccount(registeredAccounts[empId]),
          window.cloudStore.saveCalendarItem(calItem),
          window.cloudStore.saveRequest(reqObj)
        ]);
      }
    } finally {
      savingEntry = false;
    }
  }

  // Excel export (.xlsx) — สรุปรายสัปดาห์ / รายเดือน / รายปี / อันดับคนขอ OT
